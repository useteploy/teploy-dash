name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The frontend is committed at cmd/teploy-dash/frontend/ and embedded into
# the binary at build time via //go:embed. CI only needs the Go toolchain —
# no Node, no pnpm, no asset pipeline.

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
