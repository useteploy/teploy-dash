name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reusable from release.yml so a tag can't ship without the same
  # validation a PR runs (audit A50).
  workflow_call:

# The frontend is committed at cmd/teploy-dash/frontend/ and embedded into
# the binary at build time via //go:embed. CI only needs the Go toolchain —
# no Node, no pnpm, no asset pipeline.

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Test
        run: go test ./...
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Module consistency
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
