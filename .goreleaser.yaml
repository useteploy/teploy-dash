version: 2

project_name: teploy-dash

before:
  hooks:
    - go mod tidy

builds:
  - id: teploy-dash
    main: ./cmd/teploy-dash
    binary: teploy-dash
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: teploy-dash-tar
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

brews:
  - name: teploy-dash
    repository:
      owner: useteploy
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    homepage: 'https://github.com/useteploy/teploy-dash'
    description: 'Self-hosted dashboard with uptime monitoring for Teploy CLI deployments'
    license: 'AGPL-3.0-or-later'
    install: |
      bin.install "teploy-dash"
    test: |
      system "#{bin}/teploy-dash", "--help"

scoops:
  - name: teploy-dash
    repository:
      owner: useteploy
      name: scoop-bucket
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    homepage: 'https://github.com/useteploy/teploy-dash'
    description: 'Self-hosted dashboard with uptime monitoring for Teploy CLI deployments'
    license: 'AGPL-3.0-or-later'
