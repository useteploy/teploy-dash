version: 2

project_name: teploy-dash

before:
  hooks:
    - go mod tidy

builds:
  - id: teploy-dash
    main: ./cmd/teploy-dash
    binary: teploy-dash
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: teploy-dash-tar
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{- if eq .Arch "amd64" }}x86_64{{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

# NOTE (2026-05-30): goreleaser 2.x flags `brews:` as deprecated but does not
# yet ship a 1:1 replacement (homebrew_casks rejects `install:`; no
# homebrew_formulae key exists). Leaving as-is until goreleaser publishes a
# clean migration target; release path still works (deprecation, not error).
# Same situation in useteploy/teploy-cli/.goreleaser.yml.
brews:
  - name: teploy-dash
    repository:
      owner: useteploy
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    homepage: 'https://github.com/useteploy/teploy-dash'
    description: 'Self-hosted dashboard with uptime monitoring for Teploy CLI deployments'
    license: 'AGPL-3.0-or-later'
    install: |
      bin.install "teploy-dash"
    test: |
      system "#{bin}/teploy-dash", "--help"

# Docker / GHCR multi-arch images. dash embeds its frontend via go:embed, so
# the goreleaser-built binary is self-contained — the image just copies it in.
#
# NOTE (2026-05-30): goreleaser 2.x flags `dockers:` + `docker_manifests:` as
# being phased out in favor of `dockers_v2:`. The v2 schema is incompatible
# (different field set — no `use`, `image_templates`, `build_flag_templates`,
# `goos`, `goarch`) so it's a full rewrite, not a rename. Deferred until v2
# stabilizes; current config still works (deprecation, not error).
dockers:
  - id: teploy-dash-amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - 'ghcr.io/useteploy/teploy-dash:{{ .Version }}-amd64'
      - 'ghcr.io/useteploy/teploy-dash:latest-amd64'
    build_flag_templates:
      - '--platform=linux/amd64'
      - '--label=org.opencontainers.image.title={{ .ProjectName }}'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.source=https://github.com/useteploy/teploy-dash'
      - '--label=org.opencontainers.image.licenses=AGPL-3.0-or-later'
  - id: teploy-dash-arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - 'ghcr.io/useteploy/teploy-dash:{{ .Version }}-arm64'
      - 'ghcr.io/useteploy/teploy-dash:latest-arm64'
    build_flag_templates:
      - '--platform=linux/arm64'
      - '--label=org.opencontainers.image.title={{ .ProjectName }}'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.source=https://github.com/useteploy/teploy-dash'
      - '--label=org.opencontainers.image.licenses=AGPL-3.0-or-later'

docker_manifests:
  - name_template: 'ghcr.io/useteploy/teploy-dash:{{ .Version }}'
    image_templates:
      - 'ghcr.io/useteploy/teploy-dash:{{ .Version }}-amd64'
      - 'ghcr.io/useteploy/teploy-dash:{{ .Version }}-arm64'
  - name_template: 'ghcr.io/useteploy/teploy-dash:latest'
    image_templates:
      - 'ghcr.io/useteploy/teploy-dash:latest-amd64'
      - 'ghcr.io/useteploy/teploy-dash:latest-arm64'
