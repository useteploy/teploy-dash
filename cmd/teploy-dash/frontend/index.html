<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>teploy dash</title>
  <script>try{var t=localStorage.getItem('teploy-theme');t=t==='light'?'light':'dark';}catch(e){t='dark'}document.documentElement.setAttribute('data-theme',t);</script>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/alpine.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/operations.js"></script>
</head>
<body x-data>

<!-- Skip link: first tab stop, jumps past the nav chrome to the page (A49). -->
<a class="skip-link" href="#main">Skip to content</a>

<!-- Application header -->
<nav class="navbar" aria-label="Primary navigation" x-data="{ menuOpen: false }" @keydown.escape.window="menuOpen = false" @popstate.window="menuOpen = false">
  <div class="brand-group">
  <a class="navbar-brand" href="#" @click.prevent="$store.router.navigate('homepage')">Teploy</a>
  <!-- Product switcher. The current product is always named, so you can tell
       which dashboard you are in; it only becomes a dropdown once a sibling
       is reachable. -->
  <div class="product-switcher" x-data="{ open:false, current:'dash', apps:[], get siblings(){ return this.apps.filter(a=>a.url) }, get label(){ return (this.apps.find(a=>a.key===this.current)||{}).label || 'Dash' }, async init(){ try{ const r=await fetch('/api/nav'); if(r.ok){ const d=await r.json(); this.apps=d.apps||[]; this.current=d.current||'dash'; } }catch(e){} } }" @click.outside="open=false">
    <button class="ps-btn" :class="{ 'ps-static': siblings.length===0 }" @click="if(siblings.length) open=!open"
            :aria-haspopup="siblings.length>0" :aria-expanded="open"
            :title="siblings.length ? 'Switch dashboard' : null">
      <span x-text="label"></span>
      <span class="ps-caret" x-show="siblings.length>0" x-cloak>&#9662;</span>
    </button>
    <div class="ps-menu" x-show="open" x-transition.opacity x-cloak>
      <!-- Only the other dashboards: the chip already names the current one. -->
      <template x-for="a in siblings" :key="a.key">
        <a class="ps-item" :href="a.url" x-text="a.label"></a>
      </template>
    </div>
  </div>
  </div>
  <!-- Primary nav (D07 IA regroup): destinations grouped by task —
       resource work (Projects, Fleet, Activity), then service operations
       (Monitors, Restore Tests, Templates), then Settings. Labels name the
       task; URLs are unchanged (aliases /projects /fleet /activity also
       deep-link here). -->
  <ul class="navbar-nav" id="primary-nav" :class="{ open: menuOpen }" @click="if ($event.target.closest('a')) menuOpen = false">
    <!-- Phones: the header has no room for pinned links, so they open from
         the menu as named tiles (hidden on wider screens, where the header
         shows them as icons). -->
    <li class="nav-pins" x-data="navLinks" x-show="items.length > 0" x-cloak>
      <div class="nav-pins-label">Pinned</div>
      <div class="nav-pins-grid">
        <template x-for="item in items" :key="item.id">
          <a class="nav-pin" :href="item.url" target="_blank" rel="noopener" :title="item.description ? item.name + ' — ' + item.description : item.name">
            <span class="nav-link" :class="{ 'dark-icon': item.dark_icon && !linkGlyph(item) }" aria-hidden="true">
              <template x-if="linkGlyph(item)">
                <svg class="nav-link-glyph" viewBox="0 0 24 24" fill="currentColor"><path :d="linkGlyph(item)"></path></svg>
              </template>
              <template x-if="!linkGlyph(item)">
                <img class="nav-link-favicon" :src="faviconUrl(item.url)" alt=""
                     :style="item._faviconFailed ? 'display:none' : ''"
                     @error="faviconError(item, $el)">
              </template>
              <span class="nav-link-letters" :style="`background:${item.color || '#3b82f6'};${item._faviconFailed && !linkGlyph(item) ? '' : 'display:none'}`"
                    x-text="iconLetters(item.name)"></span>
            </span>
            <span class="nav-pin-name" x-text="item.name"></span>
          </a>
        </template>
      </div>
    </li>
    <li><a href="#" :class="{ active: $store.router.page === 'homepage' }" :aria-current="$store.router.page === 'homepage' ? 'page' : null" @click.prevent="$store.router.navigate('homepage')">Home</a></li>
    <li><a href="#" title="Groups, projects, and the apps deployed to them" :class="{ active: ['projects', 'project-detail', 'app-detail'].includes($store.router.page) }" :aria-current="['projects', 'project-detail', 'app-detail'].includes($store.router.page) ? 'page' : null" @click.prevent="$store.router.navigate('projects')">Projects</a></li>
    <li><a href="#" title="Every server this dash manages — health, host detail, routes" :class="{ active: $store.router.page === 'servers' || $store.router.page === 'server-detail' }" :aria-current="$store.router.page === 'servers' || $store.router.page === 'server-detail' ? 'page' : null" @click.prevent="$store.router.navigate('servers')">Fleet</a></li>
    <li><a href="#" title="Operations started through dash — deploys, rollbacks, removals, with live logs" :class="{ active: $store.router.page === 'operations' || $store.router.page === 'operation-detail' }" :aria-current="$store.router.page === 'operations' || $store.router.page === 'operation-detail' ? 'page' : null" @click.prevent="$store.router.navigate('operations')">Activity</a></li>
    <li class="nav-sep" aria-hidden="true"></li>
    <li><a href="#" :class="{ active: $store.router.page === 'monitors' || $store.router.page === 'monitor-detail' }" :aria-current="$store.router.page === 'monitors' || $store.router.page === 'monitor-detail' ? 'page' : null" @click.prevent="$store.router.navigate('monitors')">Monitors</a></li>
    <li><a href="#" title="DNS, route, certificate and HTTP health for every domain" :class="{ active: $store.router.page === 'domains' }" :aria-current="$store.router.page === 'domains' ? 'page' : null" @click.prevent="$store.router.navigate('domains')">Domains</a></li>
    <li><a href="#" title="What is left over on each server — stale routes, old versions, reclaimable space — with the fix where one exists" :class="{ active: $store.router.page === 'cleanup' || $store.router.page === 'cleanup-detail' }" :aria-current="$store.router.page === 'cleanup' || $store.router.page === 'cleanup-detail' ? 'page' : null" @click.prevent="$store.router.navigate('cleanup')">Cleanup</a></li>
    <li><a href="#" title="Every database and volume across the fleet — coverage, encryption, restore tests" :class="{ active: $store.router.page === 'backups' }" :aria-current="$store.router.page === 'backups' ? 'page' : null" @click.prevent="$store.router.navigate('backups')">Backups</a></li>
    <li><a href="#" :class="{ active: $store.router.page === 'restore-tests' }" :aria-current="$store.router.page === 'restore-tests' ? 'page' : null" @click.prevent="$store.router.navigate('restore-tests')">Restore Tests</a></li>
    <li><a href="#" :class="{ active: $store.router.page === 'templates' }" :aria-current="$store.router.page === 'templates' ? 'page' : null" @click.prevent="$store.router.navigate('templates')">Templates</a></li>
    <li><a href="#" :class="{ active: $store.router.page === 'sources' }" @click.prevent="$store.router.navigate('sources')">Sources</a></li>
    <li class="nav-sep" aria-hidden="true"></li>
    <li><a href="#" :class="{ active: $store.router.page === 'settings' }" :aria-current="$store.router.page === 'settings' ? 'page' : null" @click.prevent="$store.router.navigate('settings')">Settings</a></li>
  </ul>
  <div class="navbar-spacer"></div>
  <!-- Pinned service links. Same shortcut list as the Home grid; the ones
       flagged in Settings > Links surface here as icons, so Forgejo / Proxmox /
       TrueNAS and friends are one click away from every page. -->
  <div class="nav-links" x-data="navLinks" x-show="items.length > 0" x-cloak>
    <template x-for="item in items" :key="item.id">
      <a class="nav-link" :class="{ 'dark-icon': item.dark_icon && !linkGlyph(item) }"
         :href="item.url" target="_blank" rel="noopener"
         :title="item.description ? item.name + ' — ' + item.description : item.name">
        <!-- A monochrome glyph tracks the theme; the favicon is the fallback. -->
        <template x-if="linkGlyph(item)">
          <svg class="nav-link-glyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path :d="linkGlyph(item)"></path>
          </svg>
        </template>
        <template x-if="!linkGlyph(item)">
          <img class="nav-link-favicon" :src="faviconUrl(item.url)" alt=""
               :style="item._faviconFailed ? 'display:none' : ''"
               @error="faviconError(item, $el)">
        </template>
        <span class="nav-link-letters" :style="`background:${item.color || '#3b82f6'};${item._faviconFailed && !linkGlyph(item) ? '' : 'display:none'}`"
              x-text="iconLetters(item.name)"></span>
      </a>
    </template>
  </div>
  <!-- Narrow screens: the primary nav collapses behind this toggle into a
       drop-down panel under the header. Hidden on desktop. -->
  <button class="icon-btn nav-toggle" @click="menuOpen = !menuOpen" @click.outside="menuOpen = false"
          aria-controls="primary-nav" :aria-expanded="menuOpen"
          :aria-label="menuOpen ? 'Close navigation menu' : 'Open navigation menu'">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path x-show="!menuOpen" d="M4 7h16M4 12h16M4 17h16"></path>
      <path x-show="menuOpen" d="M6 6l12 12M18 6 6 18"></path>
    </svg>
  </button>
  <div id="load-bar" class="load-bar"></div>
</nav>

<!-- Global CLI-missing banner: shown when the teploy binary isn't on this host.
     Most actions require it; this surfaces the problem up front. -->
<div class="cli-banner" x-data="cliStatusBanner" x-show="!loading && !installed" x-cloak>
  <strong>teploy CLI not installed on this host.</strong>
  Most actions (deploy, rollback, logs, env) won't work.
  <a href="https://teploy.dev" style="color: white; text-decoration: underline;">Install instructions</a>
</div>

<!-- Content -->
<div class="content" id="main" tabindex="-1">

  <!-- ═══ Homepage ═══ -->
  <template x-if="$store.router.page === 'homepage'">
    <div x-data="homepagePage">
      <div class="page-header">
        <h1 class="page-title">Home</h1>
        <div style="display:flex;gap:8px;align-items:center;">
          <template x-if="editing">
            <button class="btn btn-primary btn-sm" @click="openAdd()">+ Add</button>
          </template>
          <button class="btn btn-sm" @click="editing = !editing; showForm = false"
                  x-text="editing ? 'Done' : 'Edit'"></button>
        </div>
      </div>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <!-- D07: a failed load is an error state with a retry — never the
           empty state, and never data that paints as fresh. -->
      <template x-if="!loading && loadFailed && !showingStale">
        <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="load()">Retry</button></div>
      </template>

      <template x-if="showingStale">
        <div role="status" class="stale-banner" x-text="staleBannerText()"></div>
      </template>

      <template x-if="!loading && !loadFailed && visibleItems.length === 0 && !editing">
        <div class="empty-state">
          <p>No shortcuts yet.</p>
          <button class="btn btn-primary" style="margin-top:12px;" @click="editing = true; openAdd()">Add your first shortcut</button>
        </div>
      </template>

      <template x-if="!loading">
        <div>
          <!-- Add / Edit form -->
          <template x-if="showForm">
            <div class="card" style="margin-bottom:24px;max-width:480px;">
              <div class="form-group">
                <label class="form-label">Name</label>
                <input class="form-input" type="text" x-model="form.name" placeholder="Forgejo">
              </div>
              <div class="form-group">
                <label class="form-label">URL</label>
                <input class="form-input" type="url" x-model="form.url" placeholder="http://100.108.123.49:49152">
              </div>
              <div class="form-group">
                <label class="form-label">Description <span class="text-muted">(optional)</span></label>
                <input class="form-input" type="text" x-model="form.description" placeholder="Self-hosted git">
              </div>
              <div style="display:flex;gap:8px;margin-top:8px;">
                <button class="btn btn-primary" @click="saveForm()" x-text="editingItem ? 'Save' : 'Add'"></button>
                <button class="btn" @click="cancelForm()">Cancel</button>
              </div>
            </div>
          </template>

          <!-- Card grid. Header-only links (hidden) are managed in
               Settings > Links and deliberately don't take a card here. -->
          <div class="homepage-grid">
            <template x-for="item in visibleItems" :key="item.id">
              <div class="homepage-card"
                   :class="{ 'homepage-card-edit': editing, 'homepage-card-dragging': editing && _dragId === item.id, 'homepage-card-dragover': editing && _dragOverId === item.id && _dragId !== item.id }"
                   :draggable="editing"
                   @dragstart="editing && dragStart(item.id, $event)"
                   @dragover="editing && dragOver(item.id, $event)"
                   @dragend="editing && dragEnd()"
                   @click="editing ? openEdit(item) : window.open(item.url, '_blank', 'noopener')">
                <!-- Remove × in top-right corner when editing -->
                <template x-if="editing">
                  <button class="homepage-card-remove" @click.stop="remove(item.id)" title="Remove">&times;</button>
                </template>
                <!-- Monochrome glyph, else favicon, else colored initials -->
                <div class="homepage-card-icon-wrap">
                  <template x-if="linkGlyph(item)">
                    <svg class="homepage-card-glyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                      <path :d="linkGlyph(item)"></path>
                    </svg>
                  </template>
                  <template x-if="!linkGlyph(item)">
                    <img class="homepage-card-favicon"
                         :class="{ 'dark-icon': item.dark_icon }"
                         :src="faviconUrl(item.url)"
                         :style="item._faviconFailed ? 'display:none' : ''"
                         @error="faviconError(item, $el)">
                  </template>
                  <div class="homepage-card-icon"
                       :style="`background:${item.color || '#3b82f6'};${item._faviconFailed && !linkGlyph(item) ? '' : 'display:none'}`"
                       x-text="iconLetters(item.name)"></div>
                </div>
                <div class="homepage-card-body">
                  <div class="homepage-card-name" x-text="item.name"></div>
                  <div class="homepage-card-desc" :title="item.description || item.url" x-text="item.description || item.url"></div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Projects Page ═══ -->
  <template x-if="$store.router.page === 'projects'">
    <div x-data="projectsPage">
      <div class="page-header">
        <div>
          <h1 class="page-title">Projects</h1>
          <p class="subtitle">Groups organize projects; projects hold the apps you deploy.</p>
          <p class="subtitle" x-show="!loading && fleetAge()" x-text="'Server state observed ' + fleetAge()"></p>
        </div>
        <div style="display: flex; gap: 12px; align-items: center; flex: 1; max-width: 500px; margin: 0 24px;">
          <input type="text" class="search-input" placeholder="Search apps..." aria-label="Search apps" x-model="search" style="flex: 1;">
        </div>
        <div class="header-actions">
          <button class="btn" @click="createGroup">+ Group</button>
          <!-- A first deploy must not require creating a group first: this
               deploys into Ungrouped, which can be organized later. -->
          <button class="btn btn-primary" @click="openDeployForm('Ungrouped')">+ Deploy</button>
        </div>
      </div>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="loadError">
        <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="load()">Retry</button></div>
      </template>

      <template x-if="!loading && !loadError">
        <div>
          <!-- Groups with their apps -->
          <template x-for="group in groupedApps()" :key="group.name">
            <div style="margin-bottom: 32px;">
              <div class="section-header">
                <h2 class="section-title" x-text="group.name"></h2>
                <div style="display: flex; gap: 8px;">
                  <button class="btn btn-sm" x-show="!group.system" @click="createProject(group.name)">+ Project</button>
                  <button class="btn btn-sm btn-primary" @click="openDeployForm(group.name)">+ Deploy</button>
                </div>
              </div>

              <!-- Inline deploy form for this group -->
              <template x-if="deployingToGroup === group.name">
                <div class="table-wrap" style="padding: 20px; margin-bottom: 16px;">
                  <div class="form-row">
                    <div class="form-group">
                      <label class="form-label" :for="'grp-deploy-app-' + group.name">App name</label>
                      <input class="form-input" :id="'grp-deploy-app-' + group.name" placeholder="myapp" x-model="deployForm.app">
                    </div>
                    <div class="form-group">
                      <label class="form-label" :for="'grp-deploy-image-' + group.name">Docker image</label>
                      <input class="form-input" :id="'grp-deploy-image-' + group.name" placeholder="nginx:latest" x-model="deployForm.image">
                    </div>
                    <div class="form-group">
                      <label class="form-label" :for="'grp-deploy-domain-' + group.name">Domain</label>
                      <input class="form-input" :id="'grp-deploy-domain-' + group.name" placeholder="myapp.example.com" x-model="deployForm.domain">
                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-group">
                      <label class="form-label" :for="'grp-deploy-server-' + group.name">Server</label>
                      <select class="form-input" :id="'grp-deploy-server-' + group.name" x-model="deployForm.server" @change="loadPreflight()">
                        <option value="">Select a server...</option>
                        <template x-for="s in serverList" :key="s">
                          <option :value="s" x-text="s"></option>
                        </template>
                      </select>
                    </div>
                    <div class="form-group">
                      <label class="form-label" :for="'grp-deploy-port-' + group.name">Container port</label>
                      <input class="form-input" type="number" :id="'grp-deploy-port-' + group.name" placeholder="80" x-model.number="deployForm.port">
                    </div>
                    <div class="form-group" style="display: flex; gap: 8px; align-items: flex-end;">
                      <button class="btn btn-primary" @click="doDeploy(group.system ? null : group.name)" :disabled="deploying || !canDeploy" x-text="deploying ? 'Deploying...' : 'Deploy'"></button>
                      <button class="btn" @click="deployingToGroup = null">Cancel</button>
                    </div>
                  </div>
                  <!-- D03: host readiness shown BEFORE app details are usable;
                       blocking checks gate Deploy, warnings render non-blocking. -->
                  <div class="preflight-panel" x-show="deployForm.server">
                    <div class="preflight-head">
                      <span class="preflight-title">Host readiness</span>
                      <button type="button" class="btn btn-sm" @click="loadPreflight()" :disabled="preflightLoading" x-text="preflightLoading ? 'Checking...' : 'Re-check'"></button>
                    </div>
                    <p class="preflight-error" x-show="preflightError" x-cloak x-text="'Readiness unknown: ' + preflightError"></p>
                    <ul class="preflight-checks" x-show="preflight && !preflightLoading" x-cloak>
                      <template x-for="c in preflightChecks" :key="c.name">
                        <li :class="preflightCheckClass(c)">
                          <span class="check-name" x-text="c.name"></span>
                          <span class="check-result" x-text="c.result"></span>
                          <span class="check-detail" x-text="c.detail"></span>
                          <span class="check-remediation" x-show="c.result !== 'pass' && c.remediation" x-text="c.remediation"></span>
                        </li>
                      </template>
                    </ul>
                  </div>
                </div>
              </template>

              <div class="card-grid">
                <!-- Project cards -->
                <template x-for="proj in group.projects" :key="'proj-' + proj.name">
                  <div class="card card-project" style="position: relative;" @click="openProject(group.name, proj.name)">
                    <div class="card-title">
                      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink: 0;"><path d="M1.5 2A1.5 1.5 0 0 1 3 .5h4.586a1.5 1.5 0 0 1 1.06.44l.914.913a.5.5 0 0 0 .354.147H13A1.5 1.5 0 0 1 14.5 3.5v9A1.5 1.5 0 0 1 13 14H3A1.5 1.5 0 0 1 1.5 12.5V2Z" stroke="currentColor" stroke-width="1.2"/></svg>
                      <span x-text="proj.name"></span>
                    </div>
                    <div class="card-meta" x-text="(proj.resolvedApps || []).length + ' app' + ((proj.resolvedApps || []).length !== 1 ? 's' : '')"></div>
                    <button title="Delete project"
                      @click.stop="deleteProject(group.name, proj.name)"
                      style="position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; font-size: 14px; opacity: 0.6;">&times;</button>
                  </div>
                </template>
                <!-- Direct app cards -->
                <template x-for="app in group.directApps" :key="JSON.stringify([app.server, app.name])">
                  <div class="card" style="position: relative;" @click="openApp(app)">
                    <div class="card-title">
                      <span class="status-dot" :class="app.status"></span>
                      <span x-text="app.name"></span>
                    </div>
                    <div class="card-meta" x-text="app.server"></div>
                    <div class="card-hash" x-text="app.current_hash || app.status"></div>
                    <button x-show="!group.system" title="Remove from group"
                      @click.stop="unassignFromGroup(group.name, app)"
                      style="position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; font-size: 14px; opacity: 0.6;">&times;</button>
                  </div>
                </template>
              </div>
              <template x-if="group.directApps.length === 0 && group.projects.length === 0 && deployingToGroup !== group.name">
                <p style="color: var(--text-muted); font-size: 13px;">No apps in this group yet.</p>
              </template>
            </div>
          </template>

          <!-- Empty state when no groups -->
          <template x-if="groupedApps().length === 0">
            <div class="empty-state">
              <p>No apps yet. Use + Deploy to ship one; groups and projects can organize apps later.</p>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Project Detail Page ═══ -->
  <template x-if="$store.router.page === 'project-detail'">
    <div x-data="projectDetailPage">
      <a href="#" class="back-link" @click.prevent="$store.router.navigate('projects')">&larr; Projects</a>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading && loadFailed && !showingStale">
        <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="load()">Retry</button></div>
      </template>

      <template x-if="showingStale">
        <div role="status" class="stale-banner" x-text="staleBannerText()"></div>
      </template>

      <template x-if="!loading && !loadFailed">
        <div>
          <div class="page-header">
            <div>
              <h1 class="page-title" x-text="projectName"></h1>
              <div class="card-meta" x-text="groupName"></div>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-primary" @click="openDeployForm()">+ Deploy</button>
              <button class="btn" @click="renameThisProject()">Rename</button>
              <button class="btn btn-danger" @click="deleteThisProject()">Delete Project</button>
            </div>
          </div>

          <!-- Inline deploy form -->
          <template x-if="deployingToProject">
            <div class="table-wrap" style="padding: 20px; margin-bottom: 16px;">
                  <div class="form-row">
                    <div class="form-group">
                      <label class="form-label" for="proj-deploy-app">App name</label>
                      <input class="form-input" id="proj-deploy-app" placeholder="myapp" x-model="deployForm.app">
                    </div>
                    <div class="form-group">
                      <label class="form-label" for="proj-deploy-image">Docker image</label>
                      <input class="form-input" id="proj-deploy-image" placeholder="nginx:latest" x-model="deployForm.image">
                    </div>
                    <div class="form-group">
                      <label class="form-label" for="proj-deploy-domain">Domain</label>
                      <input class="form-input" id="proj-deploy-domain" placeholder="myapp.example.com" x-model="deployForm.domain">
                    </div>
                  </div>
                   <div class="form-row">
                     <div class="form-group">
                       <label class="form-label" for="proj-deploy-server">Server</label>
                       <select class="form-input" id="proj-deploy-server" x-model="deployForm.server" @change="loadPreflight()">
                         <option value="">Select a server...</option>
                         <template x-for="s in serverList" :key="s">
                           <option :value="s" x-text="s"></option>
                         </template>
                       </select>
                     </div>
                     <div class="form-group">
                       <label class="form-label" for="proj-deploy-port">Container port</label>
                       <input class="form-input" type="number" id="proj-deploy-port" placeholder="80" x-model.number="deployForm.port">
                     </div>
                 <div class="form-group" style="display: flex; gap: 8px; align-items: flex-end;">
                   <button class="btn btn-primary" @click="doDeploy()" :disabled="deploying || !canDeploy" x-text="deploying ? 'Deploying...' : 'Deploy'"></button>
                   <button class="btn" @click="deployingToProject = false">Cancel</button>
                 </div>
               </div>
               <!-- D03: host readiness shown BEFORE app details are usable;
                    blocking checks gate Deploy, warnings render non-blocking. -->
               <div class="preflight-panel" x-show="deployForm.server">
                 <div class="preflight-head">
                   <span class="preflight-title">Host readiness</span>
                   <button type="button" class="btn btn-sm" @click="loadPreflight()" :disabled="preflightLoading" x-text="preflightLoading ? 'Checking...' : 'Re-check'"></button>
                 </div>
                 <p class="preflight-error" x-show="preflightError" x-cloak x-text="'Readiness unknown: ' + preflightError"></p>
                 <ul class="preflight-checks" x-show="preflight && !preflightLoading" x-cloak>
                   <template x-for="c in preflightChecks" :key="c.name">
                     <li :class="preflightCheckClass(c)">
                       <span class="check-name" x-text="c.name"></span>
                       <span class="check-result" x-text="c.result"></span>
                       <span class="check-detail" x-text="c.detail"></span>
                       <span class="check-remediation" x-show="c.result !== 'pass' && c.remediation" x-text="c.remediation"></span>
                     </li>
                   </template>
                 </ul>
               </div>
             </div>
           </template>

          <div class="card-grid">
            <template x-for="app in projectApps" :key="JSON.stringify([app.server, app.name])">
              <div class="card" style="position: relative;" @click="openApp(app)">
                <div class="card-title">
                  <span class="status-dot" :class="app.status"></span>
                  <span x-text="app.name"></span>
                </div>
                <div class="card-meta" x-text="app.server"></div>
                <div class="card-hash" x-text="app.current_hash || app.status"></div>
                <button title="Remove from project"
                  @click.stop="unassignFromProject(app)"
                  style="position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; font-size: 14px; opacity: 0.6;">&times;</button>
              </div>
            </template>
          </div>

          <template x-if="projectApps.length === 0 && !deployingToProject">
            <div class="empty-state"><p>No apps in this project yet. Deploy one to get started.</p></div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ App Detail Page ═══ -->
  <template x-if="$store.router.page === 'app-detail'">
    <div x-data="appDetailPage">
      <template x-if="$store.router.params.fromProject">
        <a href="#" class="back-link" @click.prevent="$store.router.navigate('project-detail', { group: $store.router.params.fromGroup, project: $store.router.params.fromProject })">&larr; <span x-text="$store.router.params.fromProject"></span></a>
      </template>
      <template x-if="!$store.router.params.fromProject">
        <a href="#" class="back-link" @click.prevent="$store.router.navigate('projects')">&larr; Projects</a>
      </template>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading && !app && loadFailed">
        <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="reload()">Retry</button></div>
      </template>

      <template x-if="!loading && app">
        <div>
          <template x-if="showingStale">
            <div role="status" class="stale-banner" x-text="staleBannerText()"></div>
          </template>
          <div class="page-header">
            <h1 class="page-title" x-text="app.name"></h1>
            <span class="card-meta" x-text="app.server"></span>
          </div>

          <!-- Tabs. role=tablist/tab + aria-selected give screen readers the
               section semantics; Arrow Left/Right move between tabs (and
               activate, matching the click path). -->
          <div class="tabs" role="tablist" aria-label="App sections"
               @keydown.arrow-right.prevent="$el.querySelector('[role=tab][aria-selected=true]')?.nextElementSibling?.focus()"
               @keydown.arrow-left.prevent="$el.querySelector('[role=tab][aria-selected=true]')?.previousElementSibling?.focus()">
            <button class="tab" :class="{ active: tab === 'general' }" role="tab" id="app-tab-general" aria-controls="app-panel-general" :aria-selected="(tab === 'general').toString()" :tabindex="tab === 'general' ? 0 : -1" @focus="switchTab('general')">General</button>
            <button class="tab" x-show="hasFeature('config_home')" :class="{ active: tab === 'settings' }" role="tab" id="app-tab-settings" aria-controls="app-panel-settings" :aria-selected="(tab === 'settings').toString()" :tabindex="tab === 'settings' ? 0 : -1" @focus="switchTab('settings')">Settings</button>
            <button class="tab" x-show="hasFeature('git_source') && teployHome()" :class="{ active: tab === 'repository' }" role="tab" id="app-tab-repository" aria-controls="app-panel-repository" :aria-selected="(tab === 'repository').toString()" :tabindex="tab === 'repository' ? 0 : -1" @focus="switchTab('repository')">Repository</button>
            <button class="tab" :class="{ active: tab === 'env' }" role="tab" id="app-tab-env" aria-controls="app-panel-env" :aria-selected="(tab === 'env').toString()" :tabindex="tab === 'env' ? 0 : -1" @focus="switchTab('env')">Environment</button>
            <button class="tab" :class="{ active: tab === 'logs' }" role="tab" id="app-tab-logs" aria-controls="app-panel-logs" :aria-selected="(tab === 'logs').toString()" :tabindex="tab === 'logs' ? 0 : -1" @focus="switchTab('logs')">Logs</button>
            <button class="tab" :class="{ active: tab === 'deploys' }" role="tab" id="app-tab-deploys" aria-controls="app-panel-deploys" :aria-selected="(tab === 'deploys').toString()" :tabindex="tab === 'deploys' ? 0 : -1" @focus="switchTab('deploys')">Deploys</button>
            <button class="tab" x-show="hasFeature('releases')" :class="{ active: tab === 'releases' }" role="tab" id="app-tab-releases" aria-controls="app-panel-releases" :aria-selected="(tab === 'releases').toString()" :tabindex="tab === 'releases' ? 0 : -1" @focus="switchTab('releases')">Releases</button>
            <button class="tab" x-show="hasFeature('events')" :class="{ active: tab === 'activity' }" role="tab" id="app-tab-activity" aria-controls="app-panel-activity" :aria-selected="(tab === 'activity').toString()" :tabindex="tab === 'activity' ? 0 : -1" @focus="switchTab('activity')">Activity</button>
            <button class="tab" x-show="hasFeature('backups')" :class="{ active: tab === 'backups' }" role="tab" id="app-tab-backups" aria-controls="app-panel-backups" :aria-selected="(tab === 'backups').toString()" :tabindex="tab === 'backups' ? 0 : -1" @focus="switchTab('backups')">Backups</button>
            <button class="tab" :class="{ active: tab === 'kv' }" role="tab" id="app-tab-kv" aria-controls="app-panel-kv" :aria-selected="(tab === 'kv').toString()" :tabindex="tab === 'kv' ? 0 : -1" @focus="switchTab('kv')">KV</button>
          </div>

          <!-- Desired vs applied (spec §2.3): the Teploy settings changed
               since the running release was deployed. -->
          <template x-if="configPending()">
            <div role="status" class="stale-banner pending-banner">
              <span><strong>Settings changed since the last deploy.</strong> The running release does not have them yet.</span>
              <button class="btn btn-sm btn-primary" x-show="canEdit()" @click="deployPending()" :disabled="actionLoading">Deploy pending changes</button>
            </div>
          </template>

          <!-- General Tab: the resource overview (D07 exemplar). One place
               answers: what is running (release), how fresh that answer is,
               what changed last, how to act, and how to recover. -->
          <template x-if="tab === 'general'">
            <div role="tabpanel" id="app-panel-general" aria-labelledby="app-tab-general" tabindex="-1">
              <div class="status-grid">
                <div class="status-item">
                  <div class="status-label">Current release</div>
                  <div class="status-value mono" x-text="app.current_hash || 'N/A'"></div>
                  <div class="card-meta" style="margin-top:4px;" x-show="app.previous_hash" x-text="'was ' + shortHash(app.previous_hash)"></div>
                </div>
                <div class="status-item">
                  <div class="status-label">Deployed</div>
                  <div class="status-value" style="font-size: 13px;" x-text="lastChangeWhen()"></div>
                  <div class="card-meta" style="margin-top:4px;" x-text="observedAge() ? 'observed ' + observedAge() : 'observation age unknown'"></div>
                </div>
                <div class="status-item">
                  <div class="status-label">Port</div>
                  <div class="status-value mono" x-text="app.port || 'N/A'"></div>
                </div>
                <div class="status-item">
                  <div class="status-label">Containers</div>
                  <div class="status-value" x-text="containerCount()"></div>
                </div>
                <div class="status-item">
                  <div class="status-label">Locked</div>
                  <div class="status-value" x-text="app.locked ? 'Yes' : 'No'"></div>
                </div>
                <div class="status-item">
                  <div class="status-label">Maintenance</div>
                  <div class="status-value" x-text="app.maintenance ? 'On' : 'Off'"></div>
                </div>
                <div class="status-item">
                  <div class="status-label">Domain</div>
                  <div class="status-value mono" x-text="app.domain || 'N/A'"></div>
                </div>
                <!-- "Settings edited in" (spec §2.1): where this app's
                     configuration is changed. Only with a CLI that knows
                     config homes. -->
                <div class="status-item" x-show="configHomeLabel()">
                  <div class="status-label">Settings edited in</div>
                  <div class="status-value" style="font-size: 13px;">
                    <a href="#" @click.prevent="switchTab('settings')" style="color: var(--accent);" x-text="configHomeLabel()"></a>
                  </div>
                </div>
              </div>

              <!-- Partial observation errors (D07 misleading states): the
                   status payload carries per-scope errors (e.g. container
                   listing failed while routes read fine). They were dropped
                   entirely — a partially-blind read painted as complete. -->
              <template x-if="app.errors && app.errors.length > 0">
                <div role="alert" class="stale-banner" style="margin-bottom: 20px;">
                  <strong>Partial observation</strong> — status read at <span x-text="observedWhen()"></span> with errors:
                  <ul style="margin: 6px 0 0 16px;">
                    <template x-for="(err, i) in app.errors" :key="i">
                      <li><span class="mono" style="font-size: 12px;" x-text="err.scope"></span>: <span x-text="err.message"></span></li>
                    </template>
                  </ul>
                </div>
              </template>

              <div class="btn-group" style="margin-bottom: 8px;">
                <button class="btn" x-show="app.port" @click="doAction('restart')" :disabled="actionLoading">Restart</button>
                <button class="btn" x-show="app.port" @click="doAction('stop')" :disabled="actionLoading">Stop</button>
                <button class="btn" x-show="app.port" @click="doAction('start')" :disabled="actionLoading">Start</button>
                <button class="btn" @click="doAction('rollback')" :disabled="actionLoading">Rollback</button>
                <!-- D5: redeploy the current release with env re-resolved —
                     how a secret or env edit reaches containers. -->
                <button class="btn" x-show="hasFeature('redeploy')" @click="doAction('redeploy')" :disabled="actionLoading">Redeploy</button>
                <button class="btn" @click="doAction(app.locked ? 'unlock' : 'lock')" :disabled="actionLoading" x-text="app.locked ? 'Unlock' : 'Lock'"></button>
                <button class="btn" @click="doAction(app.maintenance ? 'maintenance/off' : 'maintenance/on')" :disabled="actionLoading" x-text="app.maintenance ? 'End Maintenance' : 'Maintenance'"></button>
                <button class="btn btn-danger" @click="removeApp()" :disabled="actionLoading">Remove</button>
              </div>

              <!-- Recovery row (D07): rollback is above; these are the
                   non-destructive recovery paths — the change history for
                   this app and the scheduled restore verifications that
                   prove its backups actually restore. -->
              <div class="card-meta" style="margin-bottom: 24px; display: flex; gap: 16px;">
                <a href="#" @click.prevent="switchTab('deploys')" style="color: var(--accent);">Deploy history</a>
                <a href="#" @click.prevent="switchTab('logs')" style="color: var(--accent);">Live logs</a>
                <a href="#" @click.prevent="openRestoreTests()" style="color: var(--accent);">Restore tests</a>
                <span>Configuration: <a href="#" @click.prevent="switchTab('env')" style="color: var(--accent);">environment</a> · <a href="#" @click.prevent="switchTab('kv')" style="color: var(--accent);">KV</a></span>
              </div>

              <!-- Drift: live containers vs what was deployed -->
              <template x-if="drift && !drift.unavailable && drift.deployed !== false">
                <div style="margin-bottom: 24px;">
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                    <h3 style="font-size: 15px;">Drift</h3>
                    <span class="status-dot" :class="drift.drift ? 'stopped' : 'running'"></span>
                    <span style="font-size:13px;" x-text="drift.drift ? (drift.items || []).length + ' difference(s) from the deployed version' : 'In sync with the deployed version'"></span>
                    <button class="btn btn-sm" style="margin-left:auto;" @click="loadDrift()" :disabled="driftLoading">Re-check</button>
                  </div>
                  <template x-if="drift.drift">
                    <div class="table-wrap">
                      <table>
                        <thead><tr><th>Container</th><th>Divergence</th></tr></thead>
                        <tbody>
                          <template x-for="item in (drift.items || [])" :key="item.name">
                            <tr>
                              <td style="font-family: var(--mono); font-size: 12px;" x-text="item.name"></td>
                              <td x-text="item.detail"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                  <template x-if="drift.mode === 'state'">
                    <div class="card-meta" style="margin-top:8px;">
                      Derived from server state — replica-count drift needs teploy.yml.
                    </div>
                  </template>
                </div>
              </template>

              <!-- On-demand health probe. Not auto-loaded: it actively hits the
                   app and can take the CLI's full health timeout. -->
              <div style="margin-bottom: 24px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                  <h3 style="font-size: 15px;">Health</h3>
                  <button class="btn btn-sm" style="margin-left:auto;" @click="loadHealth()" :disabled="healthLoading"
                          x-text="healthLoading ? 'Checking…' : (health ? 'Re-check' : 'Run check')"></button>
                </div>
                <template x-if="health">
                  <div class="table-wrap">
                    <table>
                      <tbody>
                        <tr>
                          <td style="width:120px;">Status</td>
                          <td>
                            <span class="badge" :class="health.healthy ? 'green' : 'red'"
                                  x-text="health.healthy ? 'Healthy' : 'Unhealthy'"></span>
                          </td>
                        </tr>
                        <tr x-show="health.port">
                          <td>Port</td>
                          <td style="font-family: var(--mono); font-size: 12px;" x-text="health.port"></td>
                        </tr>
                        <tr x-show="health.error">
                          <td>Error</td>
                          <td style="font-family: var(--mono); font-size: 12px;" x-text="health.error"></td>
                        </tr>
                        <tr x-show="health.observed_at">
                          <td>Checked</td>
                          <td class="card-meta" style="margin:0;" x-text="new Date(health.observed_at).toLocaleString()"></td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </template>
              </div>

              <!-- Resource usage per container -->
              <template x-if="liveStats.length > 0">
                <div style="margin-bottom: 24px;">
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                    <h3 style="font-size: 15px;">Resources</h3>
                    <button class="btn btn-sm" style="margin-left:auto;" @click="loadStats()" :disabled="statsLoading">Refresh</button>
                  </div>
                  <div class="table-wrap">
                    <table>
                      <thead>
                        <tr><th>Container</th><th>CPU</th><th>Memory</th><th>Network I/O</th><th>Block I/O</th></tr>
                      </thead>
                      <tbody>
                        <template x-for="s in liveStats" :key="s.name">
                          <tr>
                            <td style="font-family: var(--mono); font-size: 12px;" x-text="s.name"></td>
                            <td x-text="s.cpu_percent"></td>
                            <td><span x-text="s.memory_usage"></span> <span class="card-meta" style="margin:0;" x-text="'(' + s.memory_percent + ')'"></span></td>
                            <td x-text="s.network_io"></td>
                            <td x-text="s.block_io"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>

              <!-- Containers Table -->
              <template x-if="app.containers && app.containers.length > 0">
                <div>
                  <h3 style="margin-bottom: 12px; font-size: 15px;">Containers</h3>
                  <div class="table-wrap">
                    <table>
                      <thead>
                        <tr>
                          <th>Name</th>
                          <th>Image</th>
                          <th>State</th>
                          <th>Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="c in app.containers" :key="c.ID">
                          <tr>
                            <td style="font-family: var(--mono); font-size: 12px;" x-text="c.Name"></td>
                            <td x-text="c.Image"></td>
                            <td>
                              <span class="status-dot" :class="c.State === 'running' ? 'running' : 'stopped'" style="margin-right: 6px;"></span>
                              <span x-text="c.State"></span>
                            </td>
                            <td x-text="c.Status"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>

              <!-- Accessories Table -->
              <template x-if="accessories && accessories.length > 0">
                <div style="margin-top: 24px;">
                  <h3 style="margin-bottom: 12px; font-size: 15px;">Accessories</h3>
                  <div class="table-wrap">
                    <table>
                      <thead>
                        <tr>
                          <th>Name</th>
                          <th>Image</th>
                          <th>State</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        <!-- Lowercase keys, deliberately: /api/apps/{server}/{app}/accessories
                             passes the CLI's JSON straight through (writeRawJSON in
                             server.go), and the CLI tags that struct id/name/image/state
                             (teploy-cli/internal/cli/accessory.go). This read Go-cased
                             a.ID / a.Name / a.State until 2026-08-16, so every field was
                             undefined: blank rows and a status dot permanently on
                             "stopped". Correct on both ends, unwired in between. -->
                        <template x-for="a in accessories" :key="a.id">
                          <tr>
                            <td style="font-family: var(--mono); font-size: 12px;" x-text="a.name"></td>
                            <td x-text="a.image"></td>
                            <td>
                              <span class="status-dot" :class="a.state === 'running' ? 'running' : 'stopped'" style="margin-right: 6px;"></span>
                              <span x-text="a.state"></span>
                            </td>
                            <td>
                              <!-- D05: database actions are distinct operations with
                                   distinct confirmations — stop and start each state
                                   their own blast radius; the deeper classes (restart,
                                   version upgrade, credential rotation, data restore,
                                   destructive removal) render from the server's
                                   inventory with support status + remedy, never wired
                                   to a closest-match command. -->
                              <button class="btn btn-sm" @click="accessoryAction(a, 'start')">Start</button>
                              <button class="btn btn-sm" @click="accessoryAction(a, 'stop')">Stop</button>
                              <button class="btn btn-sm" @click="toggleDbActions(a)">Db actions</button>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>

                  <!-- Database action inventory for the selected accessory -->
                  <template x-if="dbActionsFor">
                    <div class="table-wrap" style="padding: 16px; margin-top: 12px;">
                      <h4 style="margin: 0 0 4px; font-size: 14px;" x-text="'Database actions - ' + accessoryName(dbActionsFor.name)"></h4>
                      <p style="color: var(--text-muted); font-size: 13px; margin: 0 0 12px;">
                        Each class is its own operation with its own guarantee. Unsupported means the teploy CLI cannot run it from the dashboard's server-state mode — the remedy says exactly what to run and where.
                      </p>
                      <div style="display: grid; gap: 10px;">
                        <template x-for="act in dbActions" :key="act.id">
                          <div style="border: 1px solid var(--border, #ddd); border-radius: 4px; padding: 10px 12px;">
                            <div style="display: flex; align-items: center; gap: 8px;">
                              <strong x-text="act.label"></strong>
                              <span style="font-size: 11px; padding: 1px 6px; border-radius: 3px;"
                                :style="act.supported ? 'background: var(--success-bg, #d8f0d8); color: var(--success, #2a7a2a);' : 'background: var(--bg-inset, #eee); color: var(--text-muted);'"
                                x-text="act.supported ? 'supported' : 'not available from dash'"></span>
                            </div>
                            <p style="margin: 6px 0 0; font-size: 13px;" x-text="act.blast_radius"></p>
                            <p x-show="!act.supported" style="margin: 6px 0 0; font-size: 13px; color: var(--text-muted);" x-text="act.remedy"></p>
                            <p x-show="act.supported && act.command" style="margin: 6px 0 0; font-size: 12px; font-family: var(--mono);" x-text="act.command"></p>
                          </div>
                        </template>
                      </div>
                      <div style="margin-top: 8px;">
                        <button class="btn btn-sm" @click="dbActionsFor = null">Close</button>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>

          <!-- Environment Tab -->
          <template x-if="tab === 'env'">
            <div role="tabpanel" id="app-panel-env" aria-labelledby="app-tab-env" tabindex="-1">

              <template x-if="teployHome()">
                <div class="card-meta" style="margin-bottom: 16px;">
                  Settings for this app are edited in Teploy. Keys its settings declare are changed in <a href="#" @click.prevent="switchTab('settings')" style="color: var(--accent);">Settings</a>; keys set here are kept as secrets on the server.
                </div>
              </template>

              <div class="form-row" style="margin-bottom: 16px;">
                <div class="form-group">
                  <input class="form-input" placeholder="KEY" x-model="newEnvKey" aria-label="Environment variable name">
                </div>
                <div class="form-group">
                  <input class="form-input" placeholder="value" x-model="newEnvValue" aria-label="Environment variable value">
                </div>
                <button class="btn btn-primary" @click="addEnvVar"
                        :disabled="envKeyLocked(newEnvKey)"
                        :title="envKeyLocked(newEnvKey) ? 'Declared in this app\'s settings — change it in Settings' : ''">Add</button>
              </div>

              <template x-if="envVars && envVars.length > 0">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Key</th>
                        <th>Value</th>
                        <th style="width: 80px;"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="v in envVars" :key="v.key">
                        <tr>
                          <td style="font-family: var(--mono); font-size: 12px;">
                            <span x-text="v.key"></span>
                            <!-- Inherited-vs-local: keys this app's Teploy
                                 settings declares are inherited from the
                                 settings; the rest are set locally. -->
                            <template x-if="teployHome()">
                              <span class="badge" style="margin-left: 6px; font-size: 10px; opacity: 0.85;"
                                    :style="envKeySource(v.key) === 'settings' ? 'background:var(--accent, #0969da);color:#fff;' : ''"
                                    :title="envKeySource(v.key) === 'settings' ? 'Declared in this app\'s settings' : 'Set here, outside the settings'"
                                    x-text="envKeySource(v.key) === 'settings' ? 'from settings' : 'local'"></span>
                            </template>
                          </td>
                          <td>
                            <span x-data="{ show: false }" style="font-family: var(--mono); font-size: 12px;" :style="v.restricted ? '' : 'cursor: pointer;'" @click="v.restricted || (show = !show)" x-text="v.restricted ? '(restricted)' : (show ? v.value : '--------')" title="v.restricted ? 'Values require the reveal.secrets capability' : ''"></span>
                          </td>
                          <td>
                            <!-- Declared keys render read-only: no Remove,
                                 the settings own them. -->
                            <button x-show="!envKeyLocked(v.key)" class="btn btn-sm btn-danger" @click="deleteEnvVar(v.key)">Remove</button>
                            <span x-show="envKeyLocked(v.key)" class="card-meta" style="font-size: 11px;">in settings</span>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>

              <template x-if="!envVars || envVars.length === 0">
                <div class="empty-state"><p>No environment variables set.</p></div>
              </template>

              <!-- Secrets (D5): the CLI's encrypted store, write-only from
                   here. Values are never read back — the list is key names,
                   masked at the source by the CLI itself. -->
              <template x-if="hasFeature('secrets')">
                <div style="margin-top: 32px;">
                  <div class="section-header" style="margin-bottom: 12px;">
                    <div>
                      <h3 style="font-size: 15px; margin: 0;">Secrets</h3>
                      <p class="card-meta" style="margin: 2px 0 0;">Encrypted on the app's server; values are never displayed. Redeploy to apply a change.</p>
                    </div>
                    <button class="btn btn-sm" @click="loadSecrets()" :disabled="secretsLoading" x-text="secretsLoading ? 'Loading…' : 'Refresh'"></button>
                  </div>
                  <div class="form-row" style="margin-bottom: 16px;" x-show="canEdit()">
                    <div class="form-group">
                      <input class="form-input" placeholder="KEY" x-model="newSecretKey" aria-label="Secret name" autocomplete="off">
                    </div>
                    <div class="form-group">
                      <input class="form-input" type="password" placeholder="value" x-model="newSecretValue" aria-label="Secret value" autocomplete="new-password" @keydown.enter="addSecret()">
                    </div>
                    <button class="btn btn-primary" @click="addSecret()" :disabled="secretsLoading || !newSecretKey || !newSecretValue">Set</button>
                  </div>
                  <template x-if="secrets.length > 0">
                    <div class="table-wrap">
                      <table>
                        <thead>
                          <tr>
                            <th>Key</th>
                            <th>Provider</th>
                            <th style="width: 100px;"></th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="s in secrets" :key="s.key">
                            <tr>
                              <td style="font-family: var(--mono); font-size: 12px;" x-text="s.key"></td>
                              <td class="card-meta" x-text="s.provider"></td>
                              <td>
                                <button x-show="canEdit()" class="btn btn-sm btn-danger" @click="deleteSecret(s.key)">Remove</button>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                  <template x-if="!secretsLoading && secrets.length === 0">
                    <div class="empty-state"><p>No secrets set.</p></div>
                  </template>
                </div>
              </template>
            </div>
          </template>

          <!-- Settings Tab (server-authority P2): the app's teploy.yml as
               stored on its server. Teploy-home apps edit it here with a
               compare-and-swap save; folder apps are read-only with "Make
               editable here". Dash holds no copy — every read and write is
               the CLI against the server. -->
          <template x-if="tab === 'settings'">
            <div role="tabpanel" id="app-panel-settings" aria-labelledby="app-tab-settings" tabindex="-1">
              <template x-if="settingsLoading && !settings">
                <div class="loading"><div class="spinner"></div></div>
              </template>
              <template x-if="!settingsLoading && !settings && settingsError">
                <div role="alert" class="empty-state"><p x-text="'Could not load settings: ' + settingsError"></p><button class="btn btn-sm" @click="loadSettings()">Retry</button></div>
              </template>

              <template x-if="settings && settings.home === 'folder'">
                <div>
                  <div class="settings-home">
                    <h3>Settings are edited in the app's folder</h3>
                    <p class="card-meta">This app is deployed from a <span class="mono">teploy.yml</span> in a folder, so that file is where its settings change. Deploying from the folder keeps working as before.</p>
                    <p class="card-meta">To edit them here instead, Teploy rebuilds the settings from what is running and switches only if they match exactly. After that, any client (this dashboard, <span class="mono">teploy config edit</span>, CI) edits the same settings on the server.</p>
                    <template x-if="settingsError">
                      <div role="alert" class="stale-banner settings-error" x-text="settingsError"></div>
                    </template>
                    <button class="btn btn-primary" x-show="canEdit()" @click="makeEditableHere()" :disabled="settingsSaving" x-text="settingsSaving ? 'Checking…' : 'Make editable here'"></button>
                  </div>
                </div>
              </template>

              <!-- Repo home (or any home a newer CLI reports): the settings
                   live in the repository's teploy.yml; dash only reads. -->
              <template x-if="settings && settings.home !== 'folder' && settings.home !== 'teploy'">
                <div class="settings-home">
                  <h3 x-text="settings.home === 'repo' ? 'Settings are edited in the app\'s repository' : 'Settings are edited elsewhere (' + settings.home + ')'"></h3>
                  <p class="card-meta" x-show="settings.home === 'repo'">This app deploys from a <span class="mono">teploy.yml</span> kept in its repository, so changes to its settings are commits there.</p>
                  <p class="card-meta" x-show="settings.repository">
                    Edit it in <a class="mono" :href="settings.repository" target="_blank" rel="noopener" x-text="settings.repository"></a>
                  </p>
                </div>
              </template>

              <template x-if="settings && settings.home === 'teploy'">
                <div>
                  <div class="settings-meta">
                    <span>Edited in Teploy</span>
                    <span class="mono" x-show="settings.commit" x-text="'settings ' + shortHash(settings.commit)" :title="settings.commit"></span>
                    <span x-show="settings.applied_commit" class="mono" x-text="'running ' + shortHash(settings.applied_commit)" :title="settings.applied_commit"></span>
                  </div>

                  <!-- Settings fields (D5): the two common scalars as inputs.
                       Update patches the YAML draft below — the operator
                       reviews the diff and saves with the same compare-and-
                       swap Save. Instances cannot apply to every app (static,
                       published/host ingress); the CLI's refusal reason
                       surfaces on save. -->
                  <div class="form-row" style="margin-bottom: 12px;" x-show="canEdit()">
                    <div class="form-group">
                      <label class="form-label" for="settings-field-replicas">Web instances</label>
                      <input id="settings-field-replicas" class="form-input" type="number" min="1" step="1" x-model="settingsFields.replicas" :placeholder="topLevelYAML(settingsDraft, 'replicas') || '1'">
                    </div>
                    <div class="form-group">
                      <label class="form-label" for="settings-field-domain">Domain</label>
                      <input id="settings-field-domain" class="form-input" x-model="settingsFields.domain" :placeholder="topLevelYAML(settingsDraft, 'domain') || 'app.example.com'" autocomplete="off">
                    </div>
                    <button class="btn" style="align-self: flex-end;" @click="applySettingsFields()" :disabled="settingsSaving">Update</button>
                  </div>

                  <template x-if="settingsError">
                    <div role="alert" class="stale-banner settings-error" x-text="settingsError"></div>
                  </template>
                  <template x-if="settingsMerge && settingsMerge.conflicts && settingsMerge.conflicts.length">
                    <div class="table-wrap" style="margin-bottom: 12px;">
                      <table>
                        <thead><tr><th>Key</th><th>Your edit</th><th>Saved elsewhere</th></tr></thead>
                        <tbody>
                          <template x-for="c in settingsMerge.conflicts" :key="c.key">
                            <tr>
                              <td class="mono" x-text="c.key"></td>
                              <td class="mono" x-text="mergeValue(c.mine, c.mine_removed)"></td>
                              <td class="mono" x-text="mergeValue(c.current, c.current_removed)"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>

                  <label for="settings-editor" class="form-label">teploy.yml</label>
                  <textarea id="settings-editor" class="form-input config-editor" spellcheck="false" autocapitalize="off" autocomplete="off"
                            x-model="settingsDraft" :readonly="!canEdit() || settingsSaving"></textarea>
                  <p class="card-meta settings-hint">Secrets do not belong here: reference them as <span class="mono">secret:NAME</span> and set the value under Environment or with <span class="mono">teploy secret set</span>. Changes that reach the host (host volumes, published ports, networks, <span class="mono">caddy_extra</span>) need an administrator.</p>

                  <div class="btn-group" x-show="canEdit()">
                    <button class="btn btn-primary" @click="saveSettings()" :disabled="settingsSaving || (!settingsDirty() && !settingsMerge)" x-text="settingsSaving ? 'Saving…' : 'Save'"></button>
                    <button class="btn" @click="discardSettings()" :disabled="settingsSaving || (!settingsDirty() && !settingsMerge)">Discard</button>
                    <button class="btn" @click="deployPending()" :disabled="actionLoading || settingsDirty()" :title="settingsDirty() ? 'Save first' : ''">Deploy</button>
                    <button class="btn" @click="moveSettingsToFolder()" :disabled="settingsSaving">Edit in a folder instead</button>
                  </div>

                  <h3 class="settings-section">History</h3>
                  <template x-if="settingsHistory.length === 0">
                    <div class="empty-state"><p>No saved changes yet.</p></div>
                  </template>
                  <template x-if="settingsHistory.length > 0">
                    <div class="table-wrap">
                      <table>
                        <thead><tr><th>Change</th><th>When</th><th>By</th><th></th></tr></thead>
                        <tbody>
                          <template x-for="c in settingsHistory" :key="c.commit">
                            <tr>
                              <td>
                                <span class="mono" x-text="shortHash(c.commit)" :title="c.commit"></span>
                                <span class="badge" x-show="c.commit === settings.commit">current</span>
                                <span class="badge" x-show="c.commit === settings.applied_commit">running</span>
                                <div class="card-meta" x-text="c.message"></div>
                              </td>
                              <td x-text="formatWhen(c.date)"></td>
                              <td x-text="c.author"></td>
                              <td>
                                <button class="btn btn-sm" @click="viewSettingsAt(c.commit)">View</button>
                                <button class="btn btn-sm" x-show="canEdit() && c.commit !== settings.commit" @click="restoreSettings(c.commit)">Restore</button>
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                  <template x-if="settingsViewing">
                    <div style="margin-top: 12px;">
                      <div class="section-header">
                        <h3 class="settings-section" style="margin: 0;" x-text="'Settings at ' + shortHash(settingsViewing.commit)"></h3>
                        <button class="btn btn-sm" @click="settingsViewing = null">Close</button>
                      </div>
                      <pre class="log-viewer" x-text="settingsViewing.content"></pre>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>

          <!-- Repository Tab (server-authority D4): connect a git
               repository to a Teploy-home app. The server's poll is the
               only admitter; this card only connects (git: block via the
               CAS settings write, deploy key, host-key pin, webhook) and
               shows its state. Everything comes from the CLI; an older
               CLI or a folder-home app shows nothing here. -->
          <template x-if="tab === 'repository'">
            <div role="tabpanel" id="app-panel-repository" aria-labelledby="app-tab-repository" tabindex="-1">
              <template x-if="gitShowLoading && !gitShow">
                <div class="loading"><div class="spinner"></div></div>
              </template>
              <template x-if="!gitShowLoading && !gitShow && gitShowError">
                <div role="alert" class="empty-state"><p x-text="'Could not load the repository status: ' + gitShowError"></p><button class="btn btn-sm" @click="loadGitSource()">Retry</button></div>
              </template>

              <!-- No repository connected: the connect card -->
              <template x-if="gitShow && !gitSourceConnected() && gitStep === ''">
                <div class="card">
                  <h2 class="section-title">Repository</h2>
                  <p class="card-meta">This app is deployed from an image or a folder checkout. Connect a git repository and the server builds every admitted commit of one branch — GitHub, GitLab, Gitea, Forgejo or any git host.</p>
                  <p class="card-meta">The connection writes a <span class="mono">git:</span> block to this app's settings, generates a read-only deploy key on the server, and pins the forge's host key. Pushes then wake the server's own poll; nothing deploys from dash.</p>
                  <button class="btn btn-primary" x-show="canEdit()" @click="gitConnectStart()">Connect repository</button>
                </div>
              </template>

              <!-- Connect wizard -->
              <template x-if="gitStep !== ''">
                <div class="card">
                  <h2 class="section-title">Connect repository</h2>
                  <p role="alert" class="stale-banner" x-show="gitError" x-text="gitError"></p>

                  <template x-if="gitStep === 'form'">
                    <form @submit.prevent="gitConnectSubmit()">
                      <div class="form-row">
                        <div class="form-group">
                          <label class="form-label" for="git-forge">Forge</label>
                          <select class="form-input" id="git-forge" x-model="gitForm.forge">
                            <option value="github">GitHub</option>
                            <option value="gitlab">GitLab</option>
                            <option value="forgejo">Forgejo</option>
                            <option value="gitea">Gitea</option>
                          </select>
                        </div>
                        <div class="form-group">
                          <label class="form-label" for="git-repository">Clone URL</label>
                          <input class="form-input" id="git-repository" x-model="gitForm.repository" placeholder="git@github.com:owner/repo.git" spellcheck="false" autocapitalize="off" autocomplete="off">
                        </div>
                        <div class="form-group">
                          <label class="form-label" for="git-branch">Branch</label>
                          <input class="form-input" id="git-branch" x-model="gitForm.branch" placeholder="main" spellcheck="false" autocapitalize="off" autocomplete="off">
                        </div>
                      </div>
                      <p class="card-meta">A <span class="mono">git:</span> block is added to this app's settings first (compare-and-swap, merged with any concurrent edit), then the deploy key is generated on the server.</p>
                      <div class="btn-group">
                        <button type="submit" class="btn btn-primary" :disabled="gitBusy" x-text="gitBusy ? 'Working…' : 'Save settings and generate key'"></button>
                        <button type="button" class="btn" @click="gitCancelConnect()" :disabled="gitBusy">Cancel</button>
                      </div>
                    </form>
                  </template>

                  <template x-if="gitStep === 'hostkey'">
                    <div>
                      <h3 class="settings-section">Deploy key</h3>
                      <p class="card-meta" x-show="gitKeyInfo && gitKeyInfo.fingerprint" x-text="'Generated on the server (private half never leaves it): ' + (gitKeyInfo ? gitKeyInfo.fingerprint : '')"></p>
                      <details x-show="gitKeyInfo && gitKeyInfo.public_key">
                        <summary class="card-meta">Public key</summary>
                        <pre class="log-viewer" x-text="gitKeyInfo ? gitKeyInfo.public_key : ''"></pre>
                      </details>

                      <h3 class="settings-section">Forge host key</h3>
                      <template x-if="!gitHostKeys">
                        <div>
                          <p class="card-meta">The server pins the forge's SSH host keys (ssh-keyscan) so fetches cannot be intercepted. Pin first, then verify the fingerprints it reports against what your forge publishes.</p>
                          <div class="btn-group">
                            <button class="btn btn-primary" @click="gitPinHostKey('')" :disabled="gitBusy" x-text="gitBusy ? 'Pinning…' : 'Pin host key'"></button>
                            <button class="btn" @click="gitCancelConnect()" :disabled="gitBusy">Cancel</button>
                          </div>
                        </div>
                      </template>
                      <template x-if="gitHostKeys">
                        <div>
                          <p class="card-meta">Pinned host keys — confirm they match your forge's published fingerprints:</p>
                          <pre class="log-viewer" x-text="(gitHostKeys.host_key_fingerprints || []).join('\n')"></pre>
                          <div class="btn-group">
                            <button class="btn btn-primary" @click="gitConfirmHostKeys()" :disabled="gitBusy" x-text="gitBusy ? 'Connecting…' : 'Confirmed — finish connection'"></button>
                          </div>
                          <div class="form-row" style="margin-top: 12px;">
                            <div class="form-group">
                              <label class="form-label" for="git-expected-fp">Mismatch? Re-pin with the verified fingerprint</label>
                              <input class="form-input" id="git-expected-fp" x-model="gitExpectedFingerprint" placeholder="SHA256:..." spellcheck="false" autocapitalize="off" autocomplete="off">
                            </div>
                            <div class="form-group" style="align-self: end;">
                              <button class="btn" @click="gitPinHostKey(gitExpectedFingerprint)" :disabled="gitBusy || !gitExpectedFingerprint" x-text="gitBusy ? 'Pinning…' : 'Re-pin'"></button>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>

                  <template x-if="gitStep === 'done'">
                    <div>
                      <template x-if="gitRegister && gitRegister.registered">
                        <div>
                          <p>Deploy key and push webhook registered on the forge. Pushes to the repository now wake this app's server poll.</p>
                          <button class="btn btn-primary" @click="gitFinishConnect()">Done</button>
                        </div>
                      </template>
                      <template x-if="gitRegister && !gitRegister.registered">
                        <div>
                          <p>Dash holds no credential for this forge, so add these by hand:</p>
                          <ol style="margin: 10px 0 10px 20px;">
                            <li>Add the deploy key below to the repository as a <strong>read-only</strong> deploy key.</li>
