                            <li x-show="gitRegister.webhook_secret">Add a push webhook to <code x-text="gitRegister.webhook_url"></code> with secret <code x-text="gitRegister.webhook_secret"></code> (shown once).</li>
                            <li x-show="!gitRegister.webhook_secret">Add a push webhook to <code x-text="gitRegister.webhook_url"></code>; ask an administrator for its secret (or rotate it on the Sources page and update the forge).</li>
                          </ol>
                          <p class="card-meta" x-show="gitRegister.webhook_secret">The webhook secret is shown once, here only.</p>
                          <details>
                            <summary class="card-meta">Deploy key (public half)</summary>
                            <pre class="log-viewer" x-text="gitRegister ? gitRegister.public_key : ''"></pre>
                          </details>
                          <button class="btn btn-primary" @click="gitFinishConnect()">Done</button>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Connected: the source status card -->
              <template x-if="gitShow && gitSourceConnected()">
                <div class="card">
                  <h2 class="section-title">Repository</h2>
                  <p role="alert" class="stale-banner" x-show="gitError" x-text="gitError"></p>
                  <div class="table-wrap">
                    <table>
                      <tbody>
                        <tr><td style="width:200px;">Repository</td><td class="mono" style="font-size: 12px;" x-text="gitShow.repository"></td></tr>
                        <tr><td>Branch</td><td class="mono" style="font-size: 12px;" x-text="gitShow.branch"></td></tr>
                        <tr><td>Poll</td><td x-text="gitShow.poll || '5m'"></td></tr>
                        <tr>
                          <td>Deploy key</td>
                          <td>
                            <span x-text="gitShow.credential ? gitShow.credential.type : 'none'"></span>
                            <span class="card-meta" style="margin: 0;" x-show="gitShow.credential && gitShow.credential.fingerprint" x-text="gitShow.credential ? gitShow.credential.fingerprint : ''"></span>
                            <div class="card-meta" style="margin: 4px 0 0;" x-show="!gitShow.credential">No credential yet — run Connect repository to generate the deploy key.</div>
                          </td>
                        </tr>
                        <tr x-show="gitShow.trigger">
                          <td>Last admitted commit</td>
                          <td>
                            <span class="mono" style="font-size: 12px;" :title="gitShow.trigger ? gitShow.trigger.watermark : ''" x-text="gitShow.trigger && gitShow.trigger.watermark ? shortHash(gitShow.trigger.watermark) : 'nothing yet'"></span>
                            <span class="card-meta" style="margin: 4px 0 0;" x-show="gitShow.trigger && gitShow.trigger.last_head" x-text="'last head ' + shortHash(gitShow.trigger.last_head)"></span>
                            <span class="card-meta" style="margin: 4px 0 0;" x-show="gitShow.trigger && gitShow.trigger.last_deployed_release" x-text="'deployed as ' + (gitShow.trigger ? gitShow.trigger.last_deployed_release : '')"></span>
                          </td>
                        </tr>
                        <tr>
                          <td>Server poll timer</td>
                          <td>
                            <span x-show="gitTimer && gitTimer.known && gitTimer.installed">Installed (polls every minute)</span>
                            <span x-show="!gitTimer || !gitTimer.known">Unknown</span>
                            <div style="display:flex;align-items:center;gap:8px;" x-show="gitTimerMissing()">
                              <span>Not installed — pushes still wake the poll, but nothing catches a missed wake</span>
                              <button class="btn btn-sm" x-show="canEdit()" @click="gitInstallTimer()" :disabled="gitBusy" x-text="gitBusy ? 'Installing…' : 'Install'"></button>
                            </div>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div role="alert" class="stale-banner" x-show="gitShow.trigger && gitShow.trigger.refused_head">
                    <span x-text="'A force-pushed head was refused (' + shortHash(gitShow.trigger ? gitShow.trigger.refused_head : '') + '). The poll stays refused until the watermark is reset.'"></span>
                  </div>
                  <div class="btn-group" x-show="canEdit()">
                    <button class="btn" @click="gitRetry()" :disabled="gitBusy">Retry failed commit</button>
                    <button class="btn" x-show="gitShow.trigger && gitShow.trigger.refused_head" @click="gitResetWatermark()" :disabled="gitBusy">Reset watermark</button>
                  </div>
                  <p class="card-meta">The server's poll is the only admitter: it deduplicates commits, requires each new head to descend from the last admitted one, and deploys what passes. Edit the <span class="mono">git:</span> block in Settings to change repository, branch or poll interval.</p>
                </div>
              </template>
            </div>
          </template>

          <!-- Activity Tab (server-authority P2): the app's server event
               history. Every client writes it — laptop CLI, CI, this
               dashboard — so a deploy from anywhere shows here. -->
          <template x-if="tab === 'activity'">
            <div role="tabpanel" id="app-panel-activity" aria-labelledby="app-tab-activity" tabindex="-1">
              <div class="section-header" style="margin-bottom: 12px;">
                <span class="card-meta">Everything done to this app, from any client.</span>
                <button class="btn btn-sm" @click="loadEvents()" :disabled="eventsLoading" x-text="eventsLoading ? 'Loading…' : 'Refresh'"></button>
              </div>
              <template x-if="eventsError">
                <div role="alert" class="empty-state"><p x-text="'Could not load activity: ' + eventsError"></p><button class="btn btn-sm" @click="loadEvents()">Retry</button></div>
              </template>
              <template x-if="!eventsError && !eventsLoading && events.length === 0">
                <div class="empty-state"><p>No recorded activity yet. Actions taken with teploy v0.1.42 or later appear here.</p></div>
              </template>
              <template x-if="!eventsError && events.length > 0">
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>What</th><th>When</th><th>Result</th><th>By</th><th>Detail</th></tr></thead>
                    <tbody>
                      <template x-for="ev in events" :key="ev.id || ev.seq">
                        <tr>
                          <td class="mono" x-text="ev.kind"></td>
                          <td x-text="formatWhen(ev.ts)"></td>
                          <td>
                            <span class="status-dot" :class="eventOutcomeClass(ev)" style="margin-right: 6px;"></span>
                            <span x-text="ev.outcome"></span>
                          </td>
                          <td x-text="eventActor(ev)"></td>
                          <td class="event-detail" x-text="eventSummary(ev)" :title="eventSummary(ev)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>
          </template>

          <!-- Logs Tab -->
          <template x-if="tab === 'logs'">
            <div role="tabpanel" id="app-panel-logs" aria-labelledby="app-tab-logs" tabindex="-1" x-data="logViewer" @start-logs.window="connect()">
              <div class="log-controls">
                <label for="log-process" class="sr-only">Process name</label>
                <input type="text" id="log-process" class="process-input" :value="process" placeholder="web"
                  aria-label="Process name (container to tail)"
                  @keydown.enter="switchProcess($event.target.value)"
                  @change="switchProcess($event.target.value)"
                  style="width: 100px;">
                <label for="log-lines" class="sr-only">Tail length</label>
                <select id="log-lines" x-model="lineCount" @change="connect()"
                        aria-label="Number of tail lines">
                  <option value="50">50 lines</option>
                  <option value="100" selected>100 lines</option>
                  <option value="500">500 lines</option>
                  <option value="1000">1000 lines</option>
                </select>
                <button class="btn btn-sm" @click="togglePause()" x-text="paused ? 'Resume' : 'Pause'"></button>
                <button class="btn btn-sm" @click="clear()">Clear</button>
                <span class="ws-indicator" :class="connected ? 'connected' : 'disconnected'" aria-hidden="true"></span>
                <span style="font-size: 12px; color: var(--text-muted);" x-text="connected ? 'Connected' : 'Disconnected'"></span>
              </div>
              <div class="log-viewer" x-ref="logContent"><template x-for="(line, i) in lines" :key="i"><span x-text="line"></span></template></div>
            </div>
          </template>

          <!-- Deploys Tab -->
          <template x-if="tab === 'deploys'">
            <div role="tabpanel" id="app-panel-deploys" aria-labelledby="app-tab-deploys" tabindex="-1">
              <template x-if="deployLog && deployLog.length > 0">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Time</th>
                        <th>Type</th>
                        <th>Version</th>
                        <th>Status</th>
                        <th>Duration</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="entry in deployLog" :key="entry.ts">
                        <tr>
                          <td x-text="new Date(entry.ts).toLocaleString()"></td>
                          <td x-text="entry.type"></td>
                          <td style="font-family: var(--mono); font-size: 12px;" x-text="entry.hash || '-'"></td>
                          <td>
                            <span class="status-dot" :class="entry.success ? 'running' : 'stopped'" style="margin-right: 6px;"></span>
                            <span x-text="entry.success ? 'Success' : 'Failed'"></span>
                          </td>
                          <td x-text="entry.duration_ms ? (entry.duration_ms / 1000).toFixed(1) + 's' : '-'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>

              <template x-if="!deployLog || deployLog.length === 0">
                <div class="empty-state"><p>No deploy history yet.</p></div>
              </template>
            </div>
          </template>

          <!-- Releases Tab (D5): the app's release records as the server
               holds them, newest first. Rollback-to goes through the durable
               rollback operation; a row that cannot be rolled back says why
               (retention removed its containers). -->
          <template x-if="tab === 'releases'">
            <div role="tabpanel" id="app-panel-releases" aria-labelledby="app-tab-releases" tabindex="-1">
              <div class="section-header" style="margin-bottom: 12px;">
                <span class="card-meta">Every release the server recorded, newest first.</span>
                <button class="btn btn-sm" @click="loadReleases()" :disabled="releasesLoading" x-text="releasesLoading ? 'Loading…' : 'Refresh'"></button>
              </div>
              <template x-if="releasesError">
                <div role="alert" class="empty-state"><p x-text="'Could not load releases: ' + releasesError"></p><button class="btn btn-sm" @click="loadReleases()">Retry</button></div>
              </template>
              <template x-if="!releasesError && !releasesLoading && releases.length === 0">
                <div class="empty-state"><p>No releases recorded yet.</p></div>
              </template>
              <template x-if="!releasesError && releases.length > 0">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Release</th>
                        <th>Deployed</th>
                        <th>Image</th>
                        <th>By</th>
                        <th style="width: 140px;"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="rel in releases" :key="rel.release">
                        <tr>
                          <td style="font-family: var(--mono); font-size: 12px;">
                            <span x-text="shortHash(rel.release)" :title="rel.release"></span>
                            <span class="badge green" x-show="rel.current">current</span>
                            <div class="card-meta" x-show="!rel.current && !rel.rollback_available && rel.reason" x-text="rel.reason"></div>
                          </td>
                          <td x-text="rel.deployed_at ? new Date(rel.deployed_at).toLocaleString() : '-'"></td>
                          <td style="font-family: var(--mono); font-size: 12px;" x-text="rel.image || '-'"></td>
                          <td class="card-meta" x-text="rel.actor || '-'"></td>
                          <td>
                            <button x-show="canEdit() && hasFeature('rollback_to') && rel.rollback_available"
                                    class="btn btn-sm" @click="rollbackTo(rel)" :disabled="actionLoading">Roll back to</button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>
          </template>

          <!-- Backups Tab (D5): the app's backups and schedules as the CLI
               reads them from the server's stored backup target. Restore
               replaces the app's live data under its lock — it asks for the
               app name typed, and runs as a durable operation. -->
          <template x-if="tab === 'backups'">
            <div role="tabpanel" id="app-panel-backups" aria-labelledby="app-tab-backups" tabindex="-1">
              <div class="section-header" style="margin-bottom: 12px;">
                <span class="card-meta" x-text="backups && backups.target ? 'Stored in ' + backups.target.bucket + (backups.target.region ? ' (' + backups.target.region + ')' : '') : 'The server\'s stored backup target'"></span>
                <div style="display:flex; gap:8px;">
                  <button class="btn btn-sm" @click="loadBackups()" :disabled="backupsLoading" x-text="backupsLoading ? 'Loading…' : 'Refresh'"></button>
                  <button x-show="canEdit()" class="btn btn-sm btn-primary" @click="runBackupNow()" :disabled="backupSaving" x-text="backupSaving ? 'Starting…' : 'Run now'"></button>
                </div>
              </div>
              <template x-if="backupsError">
                <div role="alert" class="empty-state"><p x-text="'Could not load backups: ' + backupsError"></p><button class="btn btn-sm" @click="loadBackups()">Retry</button></div>
              </template>
              <template x-if="!backupsError && !backupsLoading && (!backups || (backups.backups || []).length === 0)">
                <div class="empty-state"><p>No backups listed for this app.</p></div>
              </template>

              <template x-if="backups && (backups.schedules || []).length > 0">
                <div style="margin-bottom: 20px;">
                  <h3 style="font-size: 15px; margin: 0 0 8px;">Schedules</h3>
                  <div class="table-wrap">
                    <table>
                      <thead><tr><th>Kind</th><th>Cron</th><th>Keep</th><th>Form</th></tr></thead>
                      <tbody>
                        <template x-for="(sc, i) in backups.schedules" :key="i">
                          <tr>
                            <td x-text="sc.kind === 'accessory' ? 'accessory ' + (sc.accessory || '') : sc.kind"></td>
                            <td class="mono" style="font-size: 12px;" x-text="sc.cron"></td>
                            <td class="card-meta" x-text="sc.keep_last ? 'last ' + sc.keep_last : (sc.max_age_days ? sc.max_age_days + 'd' : '-')"></td>
                            <td>
                              <span class="badge" x-text="sc.form"></span>
                              <span class="card-meta" x-show="sc.form === 'legacy'" title="Pre-D3 teploy cron with the bucket and credentials embedded; `teploy server backup-target set` rewrites it."> — rewrite with backup-target set</span>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>

              <template x-if="backups && (backups.backups || []).length > 0">
                <div>
                  <h3 style="font-size: 15px; margin: 0 0 8px;">Backups</h3>
                  <div class="table-wrap">
                    <table>
                      <thead><tr><th>Backup</th><th>Kind</th><th>Size</th><th>Created</th><th style="width: 100px;"></th></tr></thead>
                      <tbody>
                        <template x-for="b in backups.backups" :key="b.key">
                          <tr>
                            <td style="font-family: var(--mono); font-size: 12px;" x-text="b.id"></td>
                            <td x-text="backupKindLabel(b)"></td>
                            <td x-text="formatBytes(b.size_bytes)"></td>
                            <td x-text="new Date(b.created_at).toLocaleString()"></td>
                            <td>
                              <button x-show="canRestoreData() && b.restorable" class="btn btn-sm btn-danger" @click="openBackupRestore(b)">Restore</button>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>

              <!-- Restore confirmation (D5): restoring replaces the app's
                   live data, so the operator types the app name. -->
              <div class="dialog-overlay" x-show="backupRestore" @click.self="backupRestore = null"
                   @keydown.escape.window="backupRestore && (backupRestore = null)" x-cloak>
                <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="backup-restore-title"
                     tabindex="-1" x-effect="backupRestore && $nextTick(() => $el.focus())">
                  <h2 id="backup-restore-title">Restore backup</h2>
                  <template x-if="backupRestore">
                    <form @submit.prevent="confirmBackupRestore()">
                      <p>Restoring <span class="mono" x-text="backupRestore.id"></span><span x-show="backupRestore.accessory" x-text="' (accessory ' + backupRestore.accessory + (backupRestore.database ? ', database ' + backupRestore.database : '') + ')'"></span> replaces this app's current data with the backup's contents.</p>
                      <p>The app's containers are stopped for the restore and started again after; requests fail while they are down. On failure the previous data is kept on the server and its location is named in the operation log.</p>
                      <div class="field" x-show="hasFeature('backup_fleet')">
                        <label class="checkbox-label"><input type="checkbox" x-model="backupRestore.noBackup"> Skip the automatic backup taken first</label>
                        <span class="settings-hint">A fresh backup is stored before the restore, and a failed backup stops it. Skip it only if the backup can't run, such as during disaster recovery.</span>
                      </div>
                      <div class="field">
                        <label for="backup-restore-confirm">Type <span class="mono" x-text="resource.name"></span> to confirm</label>
                        <input id="backup-restore-confirm" type="text" class="form-input" x-model="backupRestoreConfirm" autocomplete="off">
                      </div>
                      <div class="dialog-actions">
                        <button type="button" class="btn" @click="backupRestore = null">Cancel</button>
                        <button type="submit" class="btn btn-danger" :disabled="backupSaving || backupRestoreConfirm !== resource.name"
                                x-text="backupSaving ? 'Restoring…' : 'Restore'"></button>
                      </div>
                    </form>
                  </template>
                </div>
              </div>
            </div>
          </template>

          <!-- KV Tab: the shared Nucleus KV store, read through the CLI.
               Values are NOT prefetched with the key list. `teploy kv get`
               opens a fresh SSH connection per invocation, so resolving every
               key on tab open would cost one handshake per key. Listing then
               revealing on demand is both the cheap path and the honest one —
               dash holds no values of its own, it asks the CLI each time.
               Note the store is one global keyspace: prefixes are convention,
               not isolation. -->
          <template x-if="tab === 'kv'">
            <div role="tabpanel" id="app-panel-kv" aria-labelledby="app-tab-kv" tabindex="-1">
              <div class="form-row" style="margin-bottom: 16px;">
                <div class="form-group">
                  <label class="form-label">Pattern</label>
                  <input class="form-input" placeholder="*" x-model="kvPattern" @keydown.enter="loadKv()">
                </div>
                <div class="form-group">
                  <label class="form-label">Accessory</label>
                  <input class="form-input" placeholder="nucleus" x-model="kvAccessory" @change="resetKvScope()" @keydown.enter="loadKv()">
                </div>
                <button class="btn" @click="loadKv()" :disabled="kvLoading" x-text="kvLoading ? 'Loading…' : 'Refresh'"></button>
              </div>

              <div class="form-row" style="margin-bottom: 16px;" x-show="canEdit()">
                <div class="form-group">
                  <input class="form-input" placeholder="key" x-model="newKvKey">
                </div>
                <div class="form-group">
                  <input class="form-input" placeholder="value" x-model="newKvValue">
                </div>
                <div class="form-group" style="max-width: 140px;">
                  <input class="form-input" type="number" min="0" placeholder="TTL (s)" x-model="newKvTtl">
                </div>
                <button class="btn btn-primary" @click="setKv()" :disabled="kvSaving">Add</button>
              </div>

              <template x-if="kvError">
                <div class="empty-state"><p x-text="kvError"></p></div>
              </template>

              <template x-if="!kvError && kvKeys.length > 0">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Key</th>
                        <th>Value</th>
                        <th style="width: 160px;"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="k in kvKeys" :key="k">
                        <tr>
                          <td style="font-family: var(--mono); font-size: 12px;" x-text="k"></td>
                          <td style="font-family: var(--mono); font-size: 12px;"
                              x-text="hasKvValue(k) ? (kvValues[k] === null ? '(not set)' : kvValues[k]) : '--------'"></td>
                          <td>
                            <!-- Keys the store holds but this panel cannot drive: the
                                 CLI takes the key as argv, so a flag-shaped or
                                 otherwise unsafe key is rejected server-side. Showing
                                 live buttons made them fail with a generic toast. -->
                            <template x-if="kvReadonly.has(k)">
                              <span class="muted" style="font-size: 12px;"
                                    title="This key cannot be read or removed from the dashboard. Use the teploy CLI.">read-only</span>
                            </template>
                            <template x-if="!kvReadonly.has(k)">
                              <span>
                                <!-- X03: value reads need reveal.secrets; without it
                                     the button would only ever answer 403. -->
                                <button class="btn btn-sm" x-show="canRevealSecrets()" @click="revealKv(k)" x-text="hasKvValue(k) ? 'Refresh' : 'Reveal'"></button>
                                <button class="btn btn-sm btn-danger" x-show="canEdit()" @click="delKv(k)">Remove</button>
                              </span>
                            </template>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>

              <template x-if="!kvError && kvKeys.length === 0 && !kvLoading">
                <div class="empty-state"><p>No keys match this pattern.</p></div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Monitors Page ═══ -->
  <!-- One row per domain: DNS, route, certificate, HTTP, and the first layer
       that fails. Results of the scheduled check; each row shows its age. -->
  <template x-if="$store.router.page === 'domains'">
    <div x-data="domainsPage">
      <div class="page-header">
        <div>
          <h1 class="page-title">Domains</h1>
          <p class="subtitle" x-text="rows.length ? rows.length + ' domain' + (rows.length !== 1 ? 's' : '') + ': ' + countBy('fail') + ' failing, ' + countBy('warn') + ' warning, ' + countBy('unknown') + ' unknown' : 'DNS, route, certificate and HTTP health for every domain'"></p>
        </div>
        <div class="header-actions">
          <label class="checkbox-label"><input type="checkbox" x-model="problemsOnly"> Problems only</label>
        </div>
      </div>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading && loadFailed && !showingStale">
        <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="load()">Retry</button></div>
      </template>

      <template x-if="showingStale">
        <div role="status" class="stale-banner" x-text="staleBannerText()"></div>
      </template>

      <template x-if="!loading && !cliSupported">
        <div role="status" class="stale-banner" x-text="note"></div>
      </template>

      <template x-if="!loading && sweepError">
        <div role="status" class="stale-banner" x-text="'The last check did not finish: ' + sweepError"></div>
      </template>

      <template x-for="s in troubledServers" :key="s.server">
        <div role="status" class="stale-banner" x-text="serverProblem(s)"></div>
      </template>

      <template x-if="!loading && !loadFailed && rows.length === 0">
        <div class="empty-state"><p x-text="lastSweepAt ? 'No domains found on your servers or monitors.' : 'The first check has not run yet. It starts shortly after Dash does.'"></p></div>
      </template>

      <template x-if="!loading && !loadFailed && rows.length > 0 && visibleRows.length === 0">
        <div class="empty-state"><p>No problems.</p></div>
      </template>

      <template x-if="!loading && visibleRows.length > 0">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Domain</th>
                <th>DNS</th>
                <th>Route</th>
                <th>Certificate</th>
                <th>HTTP</th>
                <th>What is wrong</th>
                <th>Checked</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in visibleRows" :key="row.host">
                <tr>
                  <td>
                    <span class="status-dot dot" :class="dotClass(row.overall)"></span>
                    <span class="mono" x-text="row.host"></span>
                    <div class="text-muted" x-show="row.app || row.server" x-text="[row.app, row.server].filter(Boolean).join(' on ')"></div>
                  </td>
                  <td :title="row.dns.detail" x-text="layerLabel(row.dns)"></td>
                  <td :title="row.route.detail" x-text="layerLabel(row.route)"></td>
                  <td :title="row.cert.detail" x-text="layerLabel(row.cert)"></td>
                  <td :title="row.http.detail" x-text="layerLabel(row.http)"></td>
                  <td>
                    <strong x-show="firstFailingLabel(row)" x-text="firstFailingLabel(row) + ': '"></strong>
                    <span x-text="row.evidence || ''"></span>
                  </td>
                  <td class="text-muted" x-text="ageLabel(row.age_seconds)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Backups Page (plan P2) ═══ -->
  <!-- Every database and volume across the fleet, plus the configuration
       surfaces: connect storage once, the recovery key and its decrypt
       drill, one policy. Reads the cached fleet view; nothing probes a
       server on load. -->
  <template x-if="$store.router.page === 'backups'">
    <div x-data="backupsPage">
      <div class="page-header">
        <div>
          <h1 class="page-title">Backups</h1>
          <p class="subtitle" x-text="rows.length
            ? rows.length + ' target' + (rows.length !== 1 ? 's' : '') + ': ' + countBy('covered') + countBy('adopted') + ' covered, ' + countBy('failing') + ' failing, ' + countBy('stale') + ' stale, ' + countBy('uncovered') + ' uncovered'
            : 'Every database and volume across the fleet — storage, encryption, restore tests'"></p>
        </div>
        <div class="header-actions">
          <button class="btn btn-sm" @click="refresh()" x-text="'Read servers now'"></button>
        </div>
      </div>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading && loadFailed && !showingStale">
        <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="load()">Retry</button></div>
      </template>

      <template x-if="showingStale">
        <div role="status" class="stale-banner" x-text="staleBannerText()"></div>
      </template>

      <template x-if="!loading && view && !view.cli_supported">
        <div role="status" class="stale-banner" x-text="view.note"></div>
      </template>

      <template x-if="!loading && view && view.sweep_error">
        <div role="status" class="stale-banner" x-text="'The last fleet read did not finish: ' + view.sweep_error"></div>
      </template>

      <!-- First-run checklist: storage → alert channel → recovery drill →
           first verified backup. Shown until complete. -->
      <template x-if="!loading && checklist.length > 0">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.5rem"><h2>Get protected</h2><span class="card-meta">Four steps, once</span></div>
          <ul style="list-style:none;padding:0;margin:0">
            <template x-for="item in checklist" :key="item.id">
              <li style="display:flex;gap:.5rem;align-items:baseline;padding:.25rem 0">
                <span class="dot" :class="item.state === 'done' ? 'green' : (item.state === 'todo' ? 'red' : 'gray')"></span>
                <span x-text="item.label"></span>
                <span class="text-muted" x-text="item.detail"></span>
              </li>
            </template>
          </ul>
        </div>
      </template>

      <!-- The decrypt drill banner: a key (or storage) without a passed
           drill keeps this up. Deliberately not an alert. -->
      <template x-if="!loading && recovery.banner">
        <div role="status" class="stale-banner">
          <strong>Recovery is unproven.</strong>
          <span x-text="recovery.public_key
            ? 'A recovery key exists but has never decrypted a backup. Do the drill below — until then, a lost server means unreadable backups.'
            : 'Backups run without a recovery key: they are stored unencrypted. Generate one below.'"></span>
        </div>
      </template>

      <template x-if="!loading && view && view.cli_supported">
        <div>
          <!-- Storage + recovery + policy -->
          <div style="display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:1rem">
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.5rem">
                <h2>Storage</h2>
                <span class="card-meta" x-text="storageView
                  ? storageView.provider.toUpperCase() + ' · ' + storageView.bucket + (storageView.rotated_at ? ' · rotated ' + ageLabel(Math.round((Date.now() - Date.parse(storageView.rotated_at)) / 1000)) : '')
                  : 'Connect once, push to every server'"></span>
              </div>

              <template x-if="storageView">
                <div>
                  <p class="text-muted" style="margin:.25rem 0 .5rem">Credentials live on the servers; Dash keeps only the bucket name and each server's prefix. Rotation re-prompts, pushes, verifies — and tells you when to revoke the old key.</p>
                  <dl style="margin:0">
                    <div style="display:flex;gap:.5rem"><dt class="text-muted">Endpoint</dt><dd class="mono" x-text="storageView.endpoint || '—'"></dd></div>
                    <div style="display:flex;gap:.5rem"><dt class="text-muted">Prefixes</dt><dd class="mono" x-text="Object.entries(storageView.prefixes || {}).map(([s, p]) => s + ' → ' + p).join(', ') || '—'"></dd></div>
                  </dl>
                  <div class="header-actions" style="margin-top:.5rem">
                    <button class="btn btn-sm btn-danger" @click="rotateMode = true" x-show="!rotateMode">Rotate keys…</button>
                  </div>
                </div>
              </template>

              <template x-if="!storageView || rotateMode">
                <form @submit.prevent="connectStorage()">
                  <p class="text-muted" x-show="rotateMode" style="margin:.25rem 0 .5rem">Enter the NEW keys. Dash pushes them to every server, verifies each one, and only then tells you to revoke the old key.</p>
                  <div class="form-row">
                    <label>Provider
                      <select x-model="storage.provider">
                        <option value="b2">Backblaze B2 (recommended)</option>
                        <option value="r2">Cloudflare R2</option>
                        <option value="custom">S3-compatible (advanced)</option>
                      </select>
                    </label>
                    <label x-show="storage.provider === 'r2'">Cloudflare account ID<input x-model="storage.account_id" placeholder="32 hex characters"></label>
                    <label x-show="storage.provider === 'b2'">B2 region<input x-model="storage.region" placeholder="us-west-004"></label>
                  </div>
                  <template x-if="storage.provider === 'custom'">
                    <div class="form-row">
                      <label>Endpoint URL<input x-model="storage.endpoint" placeholder="https://s3.example.com"></label>
                      <label>Region<input x-model="storage.region" placeholder="us-east-1"></label>
                    </div>
                  </template>
                  <div class="form-row">
                    <label>Bucket<input x-model="storage.bucket" placeholder="teploy-backups"></label>
                    <label>Base prefix (optional)<input x-model="storage.base_prefix" placeholder="teploy"></label>
                  </div>
                  <div class="form-row">
                    <label>Access key ID<input x-model="storage.access_key" autocomplete="off"></label>
                    <label>Secret access key<input type="password" x-model="storage.secret_key" autocomplete="new-password"></label>
                  </div>
                  <label class="checkbox-label" x-show="storage.provider === 'custom'"><input type="checkbox" x-model="storage.allow_internal"> This endpoint is on a private network (admin choice)</label>
                  <label class="checkbox-label"><input type="checkbox" x-model="storage.delete_refusal_ok"> The store refuses deletes on purpose (a bucket lock)</label>
                  <p class="text-muted">Dash probes write/read/delete first. On B2, a key that cannot delete is the recommended setup: a compromised server cannot destroy history.</p>
                  <button class="btn" type="submit" :disabled="storageBusy" x-text="storageBusy ? 'Working…' : (rotateMode ? 'Push new keys to every server' : 'Probe and connect every server')"></button>
                  <button class="btn btn-sm" type="button" x-show="rotateMode" @click="rotateMode = false">Cancel</button>
                </form>
              </template>

              <template x-if="storageResult">
                <div style="margin-top:.5rem">
                  <p class="text-muted" x-show="storageResult.probe_note" x-text="storageResult.probe_note"></p>
                  <p x-show="storageResult.revoke_note" x-text="storageResult.revoke_note"></p>
                  <template x-for="sv in storageResult.servers || []" :key="sv.server">
                    <p style="margin:.15rem 0" :class="sv.verified ? 'text-muted' : ''">
                      <span class="dot" :class="sv.verified ? 'green' : 'red'"></span>
                      <span class="mono" x-text="sv.server"></span>
                      <span x-text="sv.verified ? ' stored and verified' : (sv.pushed ? ' stored, not verified: ' + sv.error : ' not pushed: ' + sv.error)"></span>
                    </p>
                  </template>
                </div>
              </template>
            </div>

            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.5rem">
                <h2>Recovery key</h2>
                <span class="card-meta" x-text="recovery.public_key
                  ? (recovery.drill_passed_at ? 'drill passed' : 'drill pending')
                  : 'none yet — backups are unencrypted'"></span>
              </div>

              <template x-if="!recovery.public_key && !keygen">
                <div>
                  <p class="text-muted">Backups are encrypted to the owner recovery key and each server's own identity. The private key is shown once, stored nowhere by Dash, and is the only way back when a server is lost.</p>
                  <div class="form-row">
                    <label>Dash password (re-authentication)<input type="password" x-model="reauthPassword" autocomplete="current-password"></label>
                  </div>
                  <button class="btn" @click="generateKey()" :disabled="keygenBusy" x-text="keygenBusy ? 'Generating…' : 'Generate recovery key'"></button>
                </div>
              </template>

              <template x-if="keygen">
                <div>
                  <p><strong>Save this now.</strong> It is shown once and never stored. Write the file to offline storage before continuing.</p>
                  <textarea class="mono" rows="4" readonly x-text="keygen.file_text" style="width:100%"></textarea>
                  <a class="btn btn-sm" :href="'data:text/plain;charset=utf-8,' + encodeURIComponent(keygen.file_text)" :download="keygen.file_name">Download</a>
                  <div class="form-row" style="margin-top:.5rem">
                    <label>Dash password (re-authentication)<input type="password" x-model="reauthPassword" autocomplete="current-password"></label>
                  </div>
                  <button class="btn" @click="confirmKey()" :disabled="keyConfirmedBusy" x-text="keyConfirmedBusy ? 'Pushing to servers…' : \"I saved it — encrypt every server's backups\""></button>
                  <button class="btn btn-sm" @click="keygen = null">Discard and start over</button>
                </div>
              </template>

              <template x-if="recovery.public_key && !recovery.drill_passed_at">
                <div>
                  <p class="text-muted">Prove the key works: run the fetch with your saved recovery key and paste the JSON it prints. The object is re-assigned daily (retention can take the old one).</p>
                  <p class="mono" style="white-space:pre-wrap;word-break:break-all" x-text="recovery.drill_command || 'Waiting for the first encrypted object…'"></p>
                  <textarea rows="4" placeholder='{"key":"s3://…","size_bytes":…,"encrypted":true}' x-model="drillOutput" style="width:100%"></textarea>
                  <button class="btn" @click="submitDrill()" :disabled="drillBusy || !recovery.drill_key" x-text="drillBusy ? 'Checking…' : 'Record the drill'"></button>
                  <p class="text-muted" x-show="recovery.rotation_note" x-text="recovery.rotation_note"></p>
                </div>
              </template>

              <template x-if="recovery.drill_passed_at">
                <div>
                  <p class="text-muted mono" style="word-break:break-all" x-text="'encrypting to ' + recovery.public_key"></p>
                  <p class="text-muted" x-show="recovery.rotation_note" x-text="recovery.rotation_note"></p>
                  <p class="text-muted">Decrypt drill passed <span x-text="ageLabel(Math.round((Date.now() - Date.parse(recovery.drill_passed_at)) / 1000))"></span>.</p>
                </div>
              </template>
            </div>
          </div>

          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.5rem">
              <h2>One policy</h2>
              <span class="card-meta" x-text="view.policy ? view.policy.interval + ' · ' + view.policy.preset : 'same schedule and retention everywhere'"></span>
            </div>
            <p class="text-muted">Written to every server through the teploy CLI; a server's own excludes and adopted containers are kept. Servers that already send heartbeats elsewhere are left alone.</p>
            <form @submit.prevent="applyPolicy()">
              <div class="form-row">
                <label>Frequency
                  <select x-model="policy.interval">
                    <template x-for="i in view.intervals || []" :key="i"><option :value="i" x-text="i"></option></template>
                  </select>
                </label>
                <label>Retention
                  <select x-model="policy.preset">
                    <option value="simple">simple — keep 14 days</option>
                    <option value="standard">standard — 7 daily, 4 weekly, 12 monthly</option>
                  </select>
                </label>
              </div>
              <div class="form-row">
                <label class="checkbox-label"><input type="checkbox" x-model="policy.volumes"> Back up app volumes (each archive is a full copy)</label>
                <label>Volume size cap (GB, 0 = none)<input type="number" min="0" step="0.5" x-model.number="policy.volume_max_gb"></label>
              </div>
              <div class="form-row">
                <label>Restore-test window start (UTC hour)<input type="number" min="0" max="23" x-model.number="policy.window_start_hour"></label>
                <label>Window end (UTC hour)<input type="number" min="0" max="23" x-model.number="policy.window_end_hour"></label>
              </div>
              <p class="text-muted" x-show="!view.public_url_set">Set Dash's public URL in Settings so servers can heartbeat after each run — that is how a stopped cron line is caught within a day.</p>
              <button class="btn" type="submit" :disabled="policyBusy" x-text="policyBusy ? 'Writing…' : 'Apply to every server'"></button>
            </form>
            <template x-if="policyResult">
              <div style="margin-top:.5rem">
                <template x-for="sv in policyResult.servers || []" :key="sv.server">
                  <p style="margin:.15rem 0">
                    <span class="dot" :class="sv.ok ? 'green' : 'red'"></span>
                    <span class="mono" x-text="sv.server"></span>
                    <span class="text-muted" x-text="sv.ok ? (sv.note || 'policy written') : sv.error"></span>
                  </p>
                </template>
              </div>
            </template>
          </div>

          <!-- Fleet rows -->
          <template x-for="s in servers" :key="s.server">
            <template x-if="s.state !== 'ok' || serverNotes(s).length > 0">
              <div role="status" class="stale-banner" x-text="serverProblemLine(s) || (s.server + ': ' + serverNotes(s).join('; '))"></div>
            </template>
          </template>

          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.5rem">
              <h2>Every target</h2>
              <span class="card-meta" x-text="'projected ' + bytesLabel(view.projected_bytes) + ' of storage at steady state'"></span>
            </div>
            <template x-if="rows.length === 0">
              <div class="empty-state"><p x-text="view.last_sweep_at ? 'No databases or volumes found on your servers yet.' : 'The first fleet read has not finished; it runs shortly after Dash starts.'"></p></div>
            </template>
            <template x-if="rows.length > 0">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Target</th>
                      <th>Engine</th>
                      <th>State</th>
                      <th>Last good</th>
                      <th>Newest copy</th>
                      <th>Encrypted</th>
                      <th>Restore test</th>
                      <th>Old job</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="row in rows" :key="row.server + '/' + row.name">
                      <tr>
                        <td>
                          <span class="mono" x-text="row.name"></span>
                          <div class="text-muted" x-text="[row.app, row.server].filter(Boolean).join(' on ')"></div>
                          <div class="text-muted" x-show="row.uncovered_databases && row.uncovered_databases.length" x-text="'uncovered databases: ' + row.uncovered_databases.join(', ')"></div>
                          <div class="text-muted" x-show="row.reason" x-text="row.reason"></div>
                        </td>
                        <td x-text="row.engine || '—'"></td>
                        <td>
                          <span class="dot" :class="coverageClass(row.state)"></span>
                          <span x-text="coverageLabel(row.state)"></span>
                          <span class="text-muted" x-show="row.own_schedule" title="This target has its own schedule; the policy leaves it alone"> own schedule</span>
                          <span class="text-muted" x-show="row.legacy_schedule" title="A pre-fleet-engine teploy cron line"> legacy</span>
                        </td>
                        <td>
                          <span x-text="row.last_good ? ageLabel(row.last_good_age_seconds) : 'never'"></span>
                          <div class="text-muted" x-show="row.last_error" x-text="row.last_error"></div>
                        </td>
                        <td x-text="bytesLabel(row.size_bytes)"></td>
                        <td>
                          <span class="dot" :class="row.encrypted ? 'green' : 'red'"></span>
                          <span x-text="row.encrypted ? 'yes' : 'no'"></span>
                        </td>
                        <td>
                          <span x-show="row.last_restore_test" x-text="row.last_restore_test.ok ? 'passed ' + ageLabel(Math.round((Date.now() - Date.parse(row.last_restore_test.at)) / 1000)) : 'FAILED ' + ageLabel(Math.round((Date.now() - Date.parse(row.last_restore_test.at)) / 1000))"></span>
                          <span class="text-muted" x-show="!row.last_restore_test">never</span>
                        </td>
                        <td>
                          <template x-if="row.migration">
                            <span>
                              <span class="dot" :class="row.migration.ready ? 'green' : 'gray'"></span>
                              <span :title="row.migration.detail" x-text="row.migration.ready ? 'safe to remove' : 'not yet'"></span>
                            </span>
                          </template>
                          <span class="text-muted" x-show="!row.migration">—</span>
                        </td>
                        <td>
                          <button class="btn btn-sm" x-show="row.exclude_name && row.state !== 'excluded'" @click="beginExclude(row)">Exclude…</button>
                          <button class="btn btn-sm" x-show="row.exclude_name && row.state === 'excluded'" @click="excludeFor = row; submitExclude(false)">Include</button>
                          <button class="btn btn-sm" x-show="row.app && row.kind === 'volumes'" @click="beginOverride(row)">Own schedule…</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>

            <!-- Exclude dialog -->
            <template x-if="excludeFor">
              <div class="card" style="margin-top:.5rem">
                <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.5rem"><h2 x-text="'Exclude ' + excludeFor.name + ' on ' + excludeFor.server + '?'"></h2></div>
                <p class="text-muted">Excluded targets get no backup. The reason goes to the audit log.</p>
                <div class="form-row"><label>Reason<input x-model="excludeReason" placeholder="backed up elsewhere / disposable"></label></div>
                <button class="btn btn-danger" @click="submitExclude(true)" :disabled="!excludeReason.trim()">Exclude</button>
                <button class="btn btn-sm" @click="excludeFor = null">Cancel</button>
              </div>
            </template>

            <!-- Override dialog -->
            <template x-if="overrideFor">
              <div class="card" style="margin-top:.5rem">
                <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.5rem"><h2 x-text="'Own volume schedule for ' + overrideFor.app + ' on ' + overrideFor.server"></h2></div>
                <p class="text-muted">A per-app schedule overrides the policy for this app's volumes. Five cron fields; retention counts what it keeps.</p>
                <div class="form-row">
                  <label>Cron<input x-model="override.cron" placeholder="0 3 * * *"></label>
                  <label>Keep last<input type="number" min="0" x-model.number="override.keep_last"></label>
                  <label>Max age (days)<input type="number" min="0" x-model.number="override.max_age_days"></label>
                </div>
                <button class="btn" @click="submitOverride(false)">Set schedule</button>
                <button class="btn btn-sm" @click="submitOverride(true)" x-show="overrideFor.own_schedule">Return to the policy</button>
                <button class="btn btn-sm" @click="overrideFor = null">Cancel</button>
              </div>
            </template>
          </div>

          <!-- Automatic restore tests -->
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.5rem">
              <h2>Automatic restore tests</h2>
              <span class="card-meta" x-text="tests.length + ' dash-owned, weekly, in the off-hours window'"></span>
            </div>
            <p class="text-muted">One per covered database: the latest backup is restored into a scratch container on its own server and proven usable. One test per server at a time, only inside the window, and only when the host has RAM and disk to spare.</p>
            <template x-if="tests.length === 0">
              <div class="empty-state"><p>None yet — they appear as the policy covers databases.</p></div>
            </template>
            <template x-if="tests.length > 0">
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Test</th><th>Engine</th><th>Next</th><th>Last run</th><th>History</th></tr></thead>
                  <tbody>
                    <template x-for="t in tests" :key="t.id">
                      <tr>
                        <td>
                          <span class="mono" x-text="[t.server, t.app || t.accessory, t.database].filter(Boolean).join(' · ')"></span>
                          <span class="text-muted" x-show="t.adopted"> adopted</span>
                        </td>
                        <td x-text="t.engine || '—'"></td>
                        <td x-text="ageLabel(Math.round((Date.parse(t.next_due_at) - Date.now()) / 1000)).replace(' ago', '')"></td>
                        <td>
                          <template x-if="t.last_run">
                            <span>
                              <span class="dot" :class="t.last_run.ok ? 'green' : (t.last_run.skipped ? 'gray' : 'red')"></span>
                              <span x-text="t.last_run.skipped ? t.last_run.skipped : (t.last_run.ok ? 'passed' : 'failed')"></span>
                            </span>
                          </template>
                          <span class="text-muted" x-show="!t.last_run">not yet</span>
                        </td>
                        <td class="text-muted" x-text="t.history"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>

          <!-- Migration off hand-written jobs (report-only) -->
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.5rem"><h2>Retiring hand-written backup jobs</h2></div>
            <p class="text-muted" x-text="view.handwritten_rule"></p>
            <p class="text-muted">Dash cannot read a server's systemd timers and cron scripts (no CLI read for them yet), so the known job names are a checklist to confirm by hand:</p>
            <ul>
              <template x-for="job in view.handwritten || []" :key="job.name">
                <li><span class="mono" x-text="job.name"></span> — <span class="text-muted" x-text="job.where"></span></li>
              </template>
            </ul>
            <p class="text-muted">A row above shows “safe to remove” when its database has had two consecutive good policy backups and a passing restore test of the same engine. Removal itself stays a human action on the server; keep the old dumps until they age out.</p>
          </div>

          <!-- Dash itself -->
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.5rem"><h2>Dash itself</h2><span class="card-meta" x-text="view.self_backup.available ? 'covered' : 'not covered yet'"></span></div>
            <p x-text="view.self_backup.reason"></p>
            <p class="text-muted">Rebuild runbook: <span class="mono" x-text="view.self_backup.runbook"></span> in the repository.</p>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- Cleanup (Slice 6): what is left over on each server, from the CLI's
       read-only `server audit`. One component serves the fleet overview
       (/cleanup) and a server's report (/cleanup/:server), like monitors. -->
  <template x-if="$store.router.page === 'cleanup' || $store.router.page === 'cleanup-detail'">
    <div x-data="cleanupPage">

      <!-- Fleet overview -->
      <template x-if="!routeIdentity()">
        <div>
          <div class="page-header">
            <div>
              <h1 class="page-title">Cleanup</h1>
              <p class="subtitle">What is left over on each server — stale routes, old versions, reclaimable space — and the command that fixes it, where one exists.</p>
            </div>
          </div>

          <template x-if="loading">
            <div class="loading"><div class="spinner"></div></div>
          </template>

          <template x-if="!loading && loadFailed && !showingStale">
            <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="load()">Retry</button></div>
          </template>

          <template x-if="showingStale">
            <div role="status" class="stale-banner" x-text="'Showing the last report — the refresh failed: ' + loadError"></div>
          </template>

          <template x-if="!loading && !cliSupported">
            <div role="status" class="stale-banner" x-text="note"></div>
          </template>

          <template x-if="discoveryError">
            <div role="status" class="stale-banner" x-text="discoveryError"></div>
          </template>

          <template x-if="finishedServers.length > 0">
            <div role="status" class="stale-banner">
              <span>A remedy finished on <span x-text="finishedServers.join(', ')"></span>. Re-audit to confirm the finding cleared:</span>
              <template x-for="server in finishedServers" :key="server">
                <button class="btn btn-sm" style="margin-left: 8px;" @click="runAudit(server)" :disabled="auditBusy === server" x-text="auditBusy === server ? 'Auditing…' : 'Re-audit ' + server"></button>
              </template>
            </div>
          </template>

          <template x-if="!loading && !loadFailed && rows.length === 0">
            <div class="empty-state"><p>No servers configured.</p></div>
          </template>

          <template x-if="rows.length > 0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Server</th>
                    <th>Last audit</th>
                    <th>Findings</th>
                    <th style="width: 220px;"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="row in rows" :key="row.server">
                    <tr>
                      <td>
                        <span class="status-dot dot" :class="stateClass(row.state)"></span>
                        <a :href="'/cleanup/' + encodeURIComponent(row.server)" @click.prevent="openServer(row.server)" x-text="row.server"></a>
                        <div class="text-muted" x-text="stateLabel(row.state) + (row.configured === false ? ' — no longer configured' : '')"></div>
                        <div class="text-muted" x-show="row.error" x-text="row.error"></div>
                      </td>
                      <td>
                        <div x-text="ageLabel(row.age_seconds)"></div>
                        <div class="text-muted" x-show="row.live_audit">
                          <span>audit <span x-text="row.live_audit ? row.live_audit.status : ''"></span></span>
                          <a x-show="row.live_audit" :href="'/operations/' + (row.live_audit ? row.live_audit.id : '')">follow</a>
                        </div>
                        <div class="text-muted" x-show="row.checks_unknown" x-text="row.checks_unknown + ' check(s) could not be read'"></div>
                        <div class="text-muted" x-show="row.last_error" x-text="row.last_error"></div>
                      </td>
                      <td x-text="countsSummary(row)"></td>
                      <td>
                        <button class="btn btn-sm btn-primary" @click="runAudit(row.server)" :disabled="auditBusy === row.server || !!row.live_audit || !cliSupported"
                                x-text="auditBusy === row.server ? 'Auditing…' : 'Run audit'" title="Minutes over SSH; it runs as an operation you can follow"></button>
                        <button class="btn btn-sm" @click="openServer(row.server)" :disabled="row.state === 'never'">Open</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
        </div>
      </template>

      <!-- One server's report -->
      <template x-if="routeIdentity()">
        <div>
          <a href="#" class="back-link" @click.prevent="$store.router.navigate('cleanup')">&larr; Cleanup</a>
          <div class="page-header">
            <div>
              <h1 class="page-title" x-text="detail ? detail.server : routeIdentity()"></h1>
              <p class="subtitle" x-text="detail ? stateLabel(detail.state) + (detail.audited_at ? ' — audited ' + ageLabel(detail.age_seconds) : '') : ''"></p>
            </div>
            <div class="header-actions" x-show="detail">
              <button class="btn btn-sm" @click="load()">Refresh</button>
              <button class="btn btn-sm btn-primary" @click="runAudit(detail.server)" :disabled="auditBusy === detail.server || !!detail.live_audit || !cliSupported"
                      x-text="auditBusy === detail.server ? 'Auditing…' : 'Re-run audit'"></button>
            </div>
          </div>

          <template x-if="loading">
            <div class="loading"><div class="spinner"></div></div>
          </template>

          <template x-if="!loading && loadFailed && !showingStale">
            <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="load()">Retry</button></div>
          </template>

          <template x-if="showingStale">
            <div role="status" class="stale-banner" x-text="'Showing the last report — the refresh failed: ' + loadError"></div>
          </template>

          <template x-if="!loading && !cliSupported">
            <div role="status" class="stale-banner" x-text="note"></div>
          </template>

          <template x-if="detail && detail.state === 'unreachable'">
            <div role="status" class="stale-banner" x-text="'The server could not be audited' + (detail.error ? ': ' + detail.error : '') + '. Nothing here says it is clean.'"></div>
          </template>

          <template x-if="detail && detail.state === 'partial'">
            <div role="status" class="stale-banner">Part of the audit could not read its sources (below); the findings that depend on them are missing, not cleared.</div>
          </template>

          <template x-if="detail && detail.last_error">
            <div role="status" class="stale-banner" x-text="detail.last_error + ' — the report below is the last good one.'"></div>
          </template>

          <template x-if="detail && detail.live_audit">
            <div role="status" class="stale-banner">An audit is <span x-text="detail.live_audit.status"></span> — <a :href="'/operations/' + detail.live_audit.id">follow it</a>.</div>
          </template>

          <template x-if="finishedServers.includes(routeIdentity())">
            <div role="status" class="stale-banner">A remedy finished here. <button class="btn btn-sm" style="margin-left: 8px;" @click="runAudit(routeIdentity())" :disabled="auditBusy === routeIdentity()" x-text="auditBusy === routeIdentity() ? 'Auditing…' : 'Re-audit now'"></button></div>
          </template>

          <template x-if="detail && detail.state === 'never'">
            <div class="empty-state">
              <p>This server has not been audited yet.</p>
              <button class="btn btn-primary" @click="runAudit(detail.server)" :disabled="auditBusy === detail.server || !cliSupported" x-text="auditBusy === detail.server ? 'Auditing…' : 'Run the first audit'"></button>
            </div>
          </template>

          <template x-if="detail && detail.checks && detail.checks.length > 0">
            <div style="margin-bottom: 20px;">
              <h3 style="font-size: 15px; margin: 0 0 8px;">Checks</h3>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Check</th><th>Status</th><th>Detail</th></tr></thead>
                  <tbody>
                    <template x-for="c in detail.checks" :key="c.name">
                      <tr>
                        <td x-text="c.name"></td>
                        <td><span class="dot" :class="c.status === 'ok' ? 'green' : 'yellow'"></span> <span x-text="c.status === 'ok' ? 'ok' : 'unknown'"></span></td>
                        <td class="text-muted" x-text="c.detail || (c.status === 'unknown' ? 'could not be read' : '')"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>

          <template x-if="detail && detail.disk">
            <div style="margin-bottom: 20px;">
              <h3 style="font-size: 15px; margin: 0 0 8px;">Disk</h3>
              <p class="card-meta" x-text="detail.disk.path + ': ' + fmtBytes(detail.disk.available_bytes) + ' available (' + detail.disk.used_percent + '% used)'"></p>
              <div class="table-wrap" x-show="detail.disk.attribution && detail.disk.attribution.length">
                <table>
                  <thead><tr><th>Attribution</th><th>Size</th></tr></thead>
                  <tbody>
                    <template x-for="a in (detail.disk.attribution || [])" :key="a.name">
                      <tr><td x-text="a.name"></td><td x-text="fmtBytes(a.size_bytes)"></td></tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>

          <template x-if="detail && detail.state !== 'never'">
            <div>
              <div class="section-header" style="margin-bottom: 12px;">
                <h3 style="font-size: 15px; margin: 0;">Findings</h3>
                <label class="checkbox-label" x-show="dismissedFindings.length > 0"><input type="checkbox" x-model="showDismissed"> Show dismissed (<span x-text="dismissedFindings.length"></span>)</label>
              </div>
              <template x-if="visibleFindings.length === 0">
                <div class="empty-state"><p>No open findings<x-show="dismissedFindings.length"> — <span x-text="dismissedFindings.length"></span> dismissed</x-show>.</p></div>
              </template>
              <div class="table-wrap" x-show="visibleFindings.length > 0">
                <table>
                  <thead>
                    <tr><th>Finding</th><th>Evidence</th><th style="width: 280px;"></th></tr>
                  </thead>
                  <tbody>
                    <template x-for="f in visibleFindings" :key="f.id">
                      <tr :class="f.dismissed ? 'text-muted' : ''">
                        <td>
                          <span class="dot" :class="severityClass(f.severity)"></span>
                          <strong x-text="kindLabel(f.kind)"></strong>
                          <div class="mono" style="font-size: 12px;" x-text="f.subject"></div>
                          <div class="text-muted" x-show="f.size_bytes" x-text="f.size_bytes ? fmtBytes(f.size_bytes) : ''"></div>
                        </td>
                        <td>
                          <span x-text="f.evidence"></span>
                          <div class="text-muted" style="margin-top: 4px;" x-show="f.related && f.related.length" x-text="'related: ' + (f.related || []).join(', ')"></div>
                          <div class="text-muted" style="margin-top: 4px;" x-show="f.dismissed" x-text="'dismissed by ' + f.dismissed.actor"></div>
                        </td>
                        <td>
                          <template x-if="f.remedy && f.remedy.runnable">
                            <button class="btn btn-sm" :class="f.remedy.destructive ? 'btn-danger' : ''" @click="openRemedy(f)" :disabled="remedyBusy"
                                    :title="remedyLabel(f)" x-text="f.remedy.destructive ? 'Fix (destructive)…' : 'Fix'"></button>
                          </template>
                          <template x-if="f.remedy && f.remedy.available && !f.remedy.runnable">
                            <div>
                              <span class="badge">report-only here</span>
                              <div class="text-muted" style="font-size: 12px;" x-text="f.remedy.note"></div>
                            </div>
                          </template>
                          <template x-if="f.remedy && !f.remedy.available">
                            <span class="text-muted" style="font-size: 12px;">report-only</span>
                          </template>
                          <button class="btn btn-sm" style="margin-left: 8px;" @click="f.dismissed ? undismiss(f) : dismiss(f)" x-text="f.dismissed ? 'Un-dismiss' : 'Dismiss'" title="Hide this finding; a fresh audit that proves it cleared retires the dismissal"></button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- Destructive remedy confirmation: type the finding's app or subject
           name. The server enforces the match; this dialog is the prompt. -->
      <div class="dialog-overlay" x-show="confirmFinding" @click.self="confirmFinding = null" @keydown.escape.window="confirmFinding && (confirmFinding = null)" x-cloak>
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cleanup-remedy-title" tabindex="-1" x-effect="confirmFinding && $nextTick(() => $el.focus())">
          <h2 id="cleanup-remedy-title">Fix <span x-text="confirmFinding ? kindLabel(confirmFinding.kind) : ''"></span>?</h2>
          <template x-if="confirmFinding">
            <form @submit.prevent="confirmRemedy()">
              <p>This runs <span class="mono" x-text="remedyLabel(confirmFinding)"></span> — the fix the audit named. It is destructive: what it removes does not come back.</p>
              <p class="text-muted" x-text="confirmFinding.evidence"></p>
              <div class="field">
                <label for="cleanup-remedy-confirm">Type <span class="mono" x-text="confirmName(confirmFinding)"></span> to confirm</label>
                <input id="cleanup-remedy-confirm" type="text" class="form-input" x-model="confirmText" autocomplete="off">
              </div>
              <div class="dialog-actions">
                <button type="button" class="btn" @click="confirmFinding = null">Cancel</button>
                <button type="submit" class="btn btn-danger" :disabled="remedyBusy || confirmText !== confirmName(confirmFinding)" x-text="remedyBusy ? 'Starting…' : 'Run it'"></button>
              </div>
            </form>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- One component serves the list (/monitors) and a monitor's detail
       (/monitors/:id), so moving between them keeps the loaded list. -->
  <template x-if="$store.router.page === 'monitors' || $store.router.page === 'monitor-detail'">
    <div x-data="monitorsPage">

      <!-- Monitor List View (when no monitor is open) -->
      <template x-if="!detailId">
        <div>
          <div class="page-header">
            <div>
              <h1 class="page-title">Uptime Monitors</h1>
              <p class="subtitle" x-text="monitors.length ? monitors.length + ' monitor' + (monitors.length !== 1 ? 's' : '') : 'No monitors configured'"></p>
            </div>
            <div class="header-actions">
              <span class="cli-status" x-show="cliStatus">
                <span class="dot" :class="cliStatus?.installed ? 'green' : 'gray'"></span>
                CLI <span x-text="cliStatus?.version || 'not installed'"></span>
              </span>
              <button class="btn btn-primary" @click="openCreate()">Add Monitor</button>
            </div>
          </div>

          <template x-if="loading">
            <div class="loading"><div class="spinner"></div></div>
          </template>

          <template x-if="!loading && loadFailed && !showingStale">
            <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="loadMonitors()">Retry</button></div>
          </template>

          <template x-if="showingStale">
            <div role="status" class="stale-banner" x-text="staleBannerText()"></div>
          </template>

          <!-- Monitor List (also renders under a stale banner: earlier data
               stays visible when a refresh fails — D07) -->
          <template x-if="!loading && monitors.length > 0">
            <div class="monitor-list">
              <template x-for="m in monitors" :key="m.id">
                <a class="monitor-card" :href="'/monitors/' + encodeURIComponent(m.id)" @click.prevent="selectMonitor(m.id)">
                  <div class="monitor-header">
                <div class="monitor-status">
                  <span class="dot" :class="getMonitorDot(m)"></span>
                  <span class="monitor-name" x-text="m.name"></span>
                  <span class="monitor-type badge" x-text="m.type"></span>
                  <!-- D08: a failing alert delivery warns at list level. -->
                  <span class="badge" x-show="deliveryWarns(m.delivery)"
                        style="background: transparent; border: 1px solid var(--yellow); color: var(--yellow);"
                        :title="(m.delivery && m.delivery.last_error) || ''"
                        x-text="deliveryLabel(m.delivery)"></span>
                </div>
                    <div class="monitor-uptime">
                      <span class="uptime-pct" x-text="m.stats ? m.stats.uptime_percent.toFixed(1) + '%' : '--'"></span>
                      <span class="uptime-label">24h uptime</span>
                    </div>
                  </div>
                  <div class="monitor-target" x-text="m.target"></div>
                  <div class="monitor-meta">
                    <span x-text="'Every ' + formatInterval(m.interval)"></span>
                    <span x-show="m.stats" x-text="m.stats ? 'Avg ' + fmtMs(m.stats.avg_response) : ''"></span>
                  </div>
                </a>
              </template>
            </div>
          </template>

          <!-- Alerts v2: open incidents, held alerts, silences and the
               recent delivery history (suppressed and dead-lettered too). -->
          <template x-if="!loading">
            <div x-data="alertsPanel" class="section" style="margin-top: 24px;">
              <h2>Alerts</h2>
              <template x-if="error"><div role="alert" class="card-meta" x-text="error"></div></template>
              <div class="table-wrap" style="padding: 12px 16px; margin-bottom: 12px;">
                <strong>Open incidents</strong>
                <template x-if="incidents.open.length === 0"><p class="card-meta" style="margin: 6px 0 0;">None.</p></template>
                <template x-for="inc in incidents.open" :key="inc.key">
                  <div style="margin-top: 6px; font-size: 13px;">
                    <span class="badge" :class="inc.severity === 'critical' ? 'red' : 'yellow'" x-text="inc.source"></span>
                    <span x-text="inc.name"></span>
                    <span class="card-meta" x-text="' since ' + formatDate(inc.started_at) + (inc.notified ? '' : ' (not announced: no channel was configured)')"></span>
                    <div class="card-meta" style="margin: 2px 0 0; font-family: var(--mono);" x-show="inc.message" x-text="inc.message"></div>
                  </div>
                </template>
                <template x-if="incidents.held.length > 0">
                  <div style="margin-top: 10px;">
                    <strong>Held</strong>
                    <template x-for="h in incidents.held" :key="h.key">
                      <div class="card-meta" style="margin: 4px 0 0;" x-text="h.name + ': ' + h.reason + ' (' + h.consecutive_failures + ' failed checks)'"></div>
                    </template>
                  </div>
                </template>
              </div>

              <div class="table-wrap" style="padding: 12px 16px; margin-bottom: 12px;">
                <strong>Silences</strong>
                <p class="card-meta" style="margin: 4px 0 8px;">A silence holds new alerts until it expires and closes open incidents it covers. Anything still failing when it ends alerts then.</p>
                <template x-for="sl in silences" :key="sl.id">
                  <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 4px;">
                    <span x-text="silenceLabel(sl)"></span>
                    <span class="card-meta" style="margin: 0;" x-text="'until ' + formatDate(sl.expires_at) + (sl.reason ? ' - ' + sl.reason : '') + (sl.created_by ? ' (' + sl.created_by + ')' : '')"></span>
                    <button class="btn btn-sm" @click="removeSilence(sl.id)">End</button>
                  </div>
                </template>
                <div class="form-row" style="gap: 8px; align-items: flex-end;">
                  <div class="form-group">
                    <label class="form-label">Scope</label>
                    <select class="form-input" x-model="draft.scope">
                      <option value="all">Everything</option>
                      <option value="app">One app</option>
                      <option value="monitor">One monitor</option>
                    </select>
                  </div>
                  <div class="form-group" x-show="draft.scope === 'app'">
                    <label class="form-label">App</label>
                    <input class="form-input" x-model="draft.target" placeholder="app name">
                  </div>
