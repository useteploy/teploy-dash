      <!-- Account Tab -->
      <!-- MCP Tab -->
      <template x-if="!loading && tab === 'mcp'">
        <div style="max-width: 640px;">
          <div class="card" style="padding: 24px; margin-bottom: 16px;">
            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">MCP access tokens</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
              Let AI clients (Claude Code, Cursor, any MCP client) read fleet state and run deploy
              actions through this dashboard. Every action goes through the teploy CLI — the same
              path as the buttons here — so there is no second source of truth. Endpoint:
              <code style="font-family: var(--mono);">POST /api/mcp</code> with the token as a Bearer header.
            </p>
            <div class="form-row" style="margin-bottom: 16px; align-items: flex-end;">
              <div class="form-group">
                <label class="form-label" for="mcp-token-name">Token name</label>
                <input class="form-input" id="mcp-token-name" x-model="newMcpToken.name" placeholder="claude-code">
              </div>
              <div class="form-group">
                <label class="form-label" for="mcp-token-access">Access</label>
                <select class="form-input" id="mcp-token-access" x-model="newMcpToken.readOnly">
                  <option value="false">Read + actions</option>
                  <option value="true">Read-only</option>
                </select>
              </div>
              <button class="btn btn-primary" @click="createMcpToken()">Create</button>
            </div>

            <template x-if="createdMcpToken">
              <div class="card" style="padding: 14px 16px; margin-bottom: 16px; border: 1px solid var(--green); ">
                <p style="font-size: 13px; margin-bottom: 8px;">Copy this token now — it will not be shown again.</p>
                <code style="font-family: var(--mono); font-size: 12px; word-break: break-all;" x-text="createdMcpToken"></code>
              </div>
            </template>

            <template x-if="mcpTokens.length > 0">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr><th>Name</th><th>Access</th><th>Created</th><th>Last used</th><th style="width: 80px;"></th></tr>
                  </thead>
                  <tbody>
                    <template x-for="t in mcpTokens" :key="t.id">
                      <tr>
                        <td x-text="t.name"></td>
                        <td x-text="t.read_only ? 'Read-only' : 'Read + actions'"></td>
                        <td style="font-size: 12px;" x-text="new Date(t.created_at).toLocaleDateString()"></td>
                        <td style="font-size: 12px;" x-text="t.last_used && !t.last_used.startsWith('0001') ? new Date(t.last_used).toLocaleString() : 'never'"></td>
                        <td style="text-align: right;">
                          <button class="btn btn-sm btn-danger" @click="deleteMcpToken(t.id)">Revoke</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
            <template x-if="mcpTokens.length === 0 && !createdMcpToken">
              <p style="font-size: 13px; color: var(--text-muted);">No tokens yet.</p>
            </template>
          </div>

          <div class="card" style="padding: 24px;">
            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">Connect a client</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">Claude Code example:</p>
            <pre style="font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto;">claude mcp add teploy --transport http \
  --header "Authorization: Bearer &lt;token&gt;" \
  <span x-text="location.origin + '/api/mcp'"></span></pre>
          </div>
        </div>
      </template>

      <!-- Users Tab -->
      <template x-if="!loading && tab === 'users'">
        <div style="max-width: 720px;">
          <div class="card" style="padding: 24px; margin-bottom: 16px;">
            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">Team access</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
              Dashboard accounts, their roles, and their capability profiles.
              <strong>Admin</strong> manages users, servers, and settings; <strong>Editor</strong>
              (operator preset) can deploy, mutate config, and read logs; <strong>Viewer</strong>
              sees metadata only — env and KV <em>values</em> need the reveal.secrets capability,
              which new accounts do not carry. Accounts that predate the capability matrix keep
              their exact previous permissions under a <strong>legacy</strong> profile until you
              narrow them — the button is the explicit act. Access governs this dashboard only —
              anyone with SSH to a server can still act on it directly.
            </p>
            <div class="form-row" style="margin-bottom: 16px; align-items: flex-end;">
              <div class="form-group">
                <label class="form-label" for="new-user-name">Username</label>
                <input class="form-input" id="new-user-name" x-model="newUser.username" placeholder="jane">
              </div>
              <div class="form-group">
                <label class="form-label" for="new-user-pass">Password</label>
                <input class="form-input" id="new-user-pass" type="password" x-model="newUser.password" placeholder="At least 8 characters">
              </div>
              <div class="form-group">
                <label class="form-label" for="new-user-role">Role</label>
                <select class="form-input" id="new-user-role" x-model="newUser.role">
                  <option value="viewer">Viewer</option>
                  <option value="editor">Editor</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <button class="btn btn-primary" @click="createUser()">Add user</button>
            </div>

            <template x-if="users.length > 0">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr><th>Username</th><th>Role</th><th>Capabilities</th><th style="width: 260px;"></th></tr>
                  </thead>
                  <tbody>
                    <template x-for="u in users" :key="u.username">
                      <tr>
                        <td x-text="u.username"></td>
                        <td>
                          <select class="form-input" style="max-width: 130px; padding: 4px 8px;"
                                  :aria-label="'Role for ' + u.username"
                                  @change="changeRole(u.username, $event.target.value)">
                            <option value="viewer" :selected="u.role === 'viewer'">Viewer</option>
                            <option value="editor" :selected="u.role === 'editor'">Editor</option>
                            <option value="admin" :selected="u.role === 'admin'">Admin</option>
                          </select>
                        </td>
                        <!-- X03: the capability profile is visible per account.
                             legacy = the account still holds its pre-matrix
                             permissions (flagged for the operator to narrow);
                             preset = the role's current preset; custom = an
                             explicit set. The capability list is the
                             effective set, title shows it in full. -->
                        <td>
                          <span class="muted" style="font-size: 12px; margin-right: 6px;"
                                x-text="u.capability_profile === 'legacy' ? 'legacy (pre-matrix permissions)' : u.capability_profile"></span>
                          <span style="font-family: var(--mono); font-size: 11px; color: var(--text-muted);"
                                x-text="(u.capabilities || []).length + ' caps'"
                                :title="(u.capabilities || []).join(', ')"></span>
                        </td>
                        <td style="display: flex; gap: 6px; justify-content: flex-end;">
                          <button class="btn btn-sm" x-show="u.capability_profile === 'legacy'"
                                  title="Replace this account's pre-matrix permissions with its role's preset. Takes effect immediately on live sessions."
                                  @click="narrowToPreset(u.username)">Narrow to preset</button>
                          <button class="btn btn-sm" @click="editCapabilities(u)">Edit capabilities</button>
                          <button class="btn btn-sm" @click="resetUserPassword(u.username)">Reset password</button>
                          <button class="btn btn-sm" @click="revokeUserSessions(u.username)">Revoke sessions</button>
                          <button class="btn btn-sm btn-danger" @click="deleteUser(u.username)"
                                  x-show="u.username !== (me && me.username)">Remove</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
            <template x-if="capabilityEditor">
              <div class="card" style="padding:16px; margin-top:16px;">
                <h4 x-text="'Capabilities for ' + capabilityEditor.username"></h4>
                <p class="text-muted">Saving creates a custom profile. Unchecked permissions are removed immediately.</p>
                <template x-for="token in capabilityTokens" :key="token">
                  <label style="display:block; margin:8px 0;">
                    <input type="checkbox" :value="token" x-model="capabilityEditor.capabilities" :disabled="capabilityEditor.saving">
                    <span x-text="token"></span>
                  </label>
                </template>
                <button class="btn btn-primary" @click="saveCapabilities()" :disabled="capabilityEditor.saving">Save capabilities</button>
                <button class="btn" @click="capabilityEditor = null" :disabled="capabilityEditor.saving">Cancel</button>
              </div>
            </template>
            <template x-if="users.length === 0">
              <p style="font-size: 13px; color: var(--text-muted);">No users yet.</p>
            </template>
          </div>
        </div>
      </template>

      <!-- SSO Tab: external (OIDC) identities known to this instance. The

      <template x-if="!loading && tab === 'sso'">

                      <tr>
                        <td>
                          <div x-text="p.username"></div>

                        <td style="font-size: 12px;" x-text="fmtDate(p.last_sign_in)"></td>

                  </tbody>
                </table>
              </div>
            </template>
            <template x-if="ssoPrincipals.length === 0">

                <span x-show="!me.username">(SSO is unavailable while authentication is disabled)</span>.

            </template>
          </div>
        </div>

      <!-- Links Tab: custom service shortcuts. The same list the Home grid

            Home and Header are independent: a link can be a card on Home, an icon in the top-right of

          </p>

          <template x-if="canEdit()">
            <div style="margin-bottom: 16px;">

                <input class="form-input" x-model="form.icon" placeholder="M12 .297c-6.63 0-12 5.373-12 12 …"

                <p class="text-muted" style="margin-top: 5px; font-size: 11px;">
                  Drawn in the current text colour, so it is white on the dark theme and black on the light one —

                </p>

              </div>
            </div>
          </template>

          <template x-if="items.length > 0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th style="width: 40px;"></th>
                    <th>Name</th>
                    <th>URL</th>
                    <th style="width: 80px;">Home</th>
                    <th style="width: 90px;">Header</th>
                    <th style="width: 150px;"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="item in items" :key="item.id">
                    <tr>
                      <td>
                        <span class="nav-link" :class="{ 'dark-icon': item.dark_icon && !linkGlyph(item) }" style="pointer-events: none;">
                          <template x-if="linkGlyph(item)">
                            <svg class="nav-link-glyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                              <path :d="linkGlyph(item)"></path>

                          <template x-if="!linkGlyph(item)">
                            <img class="nav-link-favicon" :src="faviconUrl(item.url)" alt=""

                                 @error="faviconError(item, $el)">
                          </template>
                          <span class="nav-link-letters"
                                :style="`background:${item.color || '#3b82f6'};${item._faviconFailed && !linkGlyph(item) ? '' : 'display:none'}`"
                                x-text="iconLetters(item.name)"></span>
                        </span>
                      </td>
                      <td>
                        <div x-text="item.name"></div>
                        <div class="text-muted" style="font-size: 11px;" x-text="item.description"></div>
                      </td>
                      <td style="font-family: var(--mono); font-size: 12px;">
                        <a :href="item.url" target="_blank" rel="noopener" style="color: var(--accent);" x-text="item.url"></a>
                      </td>
                      <td>
                        <button class="btn btn-sm" :class="{ 'btn-primary': !item.hidden }"
                                :disabled="!canEdit()" @click="toggle(item, 'hidden')"
                                x-text="item.hidden ? 'Off' : 'On'"></button>
                      </td>
                      <td>
                        <button class="btn btn-sm" :class="{ 'btn-primary': item.pinned }"
                                :disabled="!canEdit()" @click="toggle(item, 'pinned')"
                                x-text="item.pinned ? 'Pinned' : 'Pin'"></button>
                      </td>
                      <td>
                        <div style="display: flex; gap: 6px; justify-content: flex-end;">
                          <button class="btn btn-sm" x-show="canEdit()" @click="edit(item)">Edit</button>
                          <button class="btn btn-sm btn-danger" x-show="canEdit()" @click="remove(item.id)">Remove</button>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <template x-if="items.length === 0">
            <p style="font-size: 13px; color: var(--text-muted);">No links yet.</p>
          </template>
        </div>
      </template>

      <template x-if="!loading && tab === 'account'">
        <div style="max-width: 420px;">
          <!-- Appearance: stored in this browser only. -->
          <div class="card" style="padding: 24px; cursor: default; margin-bottom: 16px;">
            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">Appearance</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">Saved in this browser.</p>
            <div class="segmented" role="group" aria-label="Theme">
              <button type="button" class="btn" :class="{ 'btn-primary': $store.theme.mode === 'dark' }" :aria-pressed="($store.theme.mode === 'dark').toString()" @click="$store.theme.set('dark')">Dark</button>
              <button type="button" class="btn" :class="{ 'btn-primary': $store.theme.mode === 'light' }" :aria-pressed="($store.theme.mode === 'light').toString()" @click="$store.theme.set('light')">Light</button>
            </div>
          </div>
          <div class="card" style="padding: 24px; cursor: default;">
            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">Change password</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">After changing your password you will be signed out.</p>
            <div class="form-group">
              <label class="form-label">Current password</label>
              <input class="form-input" type="password" x-model="pw.current" autocomplete="current-password">
            </div>
            <div class="form-group">
              <label class="form-label">New password</label>
              <input class="form-input" type="password" x-model="pw.next" autocomplete="new-password" placeholder="At least 8 characters">
            </div>
            <div class="form-group">
              <label class="form-label">Confirm new password</label>
              <input class="form-input" type="password" x-model="pw.confirm" autocomplete="new-password">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 4px;">
              <button class="btn btn-primary" @click="changePassword()" :disabled="pw.saving">
                <span x-text="pw.saving ? 'Saving...' : 'Change password'"></span>
              </button>
            </div>
            <p x-show="pw.error" x-text="pw.error" style="font-size: 13px; color: var(--red); margin-top: 12px;"></p>
          </div>

          <!-- Sign out lives here rather than in the header: it is a rare,
               irreversible action and does not need permanent chrome. Hidden
               when auth is off (--no-auth), where there is no session to end. -->
          <template x-if="me.username">
            <div class="card" style="padding: 24px; margin-top: 16px; cursor: default;">
              <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">Session</h3>
              <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
                Signed in as <strong x-text="me.username"></strong> (<span x-text="me.role || 'viewer'"></span>).
              </p>
              <button class="btn btn-danger" @click="logout()">Sign out</button>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>

</div>

<!-- Toast Container -->
<div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

</body>
</html>
