<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>teploy dash</title>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('teploy-theme') || 'dark');</script>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/alpine.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/operations.js"></script>
</head>
<body x-data>

<!-- Application header -->
<nav class="navbar" aria-label="Primary navigation">
  <a class="navbar-brand" href="#" @click.prevent="$store.router.navigate('homepage')">Teploy</a>
  <!-- Product switcher. The current product is always named, so you can tell
       which dashboard you are in; it only becomes a dropdown once a sibling
       is reachable. -->
  <div class="product-switcher" x-data="{ open:false, current:'dash', apps:[], get siblings(){ return this.apps.filter(a=>a.url) }, get label(){ return (this.apps.find(a=>a.key===this.current)||{}).label || 'Dash' }, async init(){ try{ const r=await fetch('/api/nav'); if(r.ok){ const d=await r.json(); this.apps=d.apps||[]; this.current=d.current||'dash'; } }catch(e){} } }" @click.outside="open=false">
    <button class="ps-btn" :class="{ 'ps-static': siblings.length===0 }" @click="if(siblings.length) open=!open"
            :aria-haspopup="siblings.length>0" :aria-expanded="open"
            :title="siblings.length ? 'Switch dashboard' : null">
      <span x-text="label"></span>
      <span class="ps-caret" x-show="siblings.length>0" x-cloak>&#9662;</span>
    </button>
    <div class="ps-menu" x-show="open" x-transition.opacity x-cloak>
      <template x-for="a in apps" :key="a.key">
        <a class="ps-item" :class="{ current: a.key===current }" :href="a.url||null" x-text="a.label" @click="if(a.key===current) $event.preventDefault()"></a>
      </template>
    </div>
  </div>
  <ul class="navbar-nav">
    <li><a href="#" :class="{ active: $store.router.page === 'homepage' }" @click.prevent="$store.router.navigate('homepage')">Home</a></li>
    <li><a href="#" :class="{ active: ['projects', 'project-detail', 'app-detail'].includes($store.router.page) }" @click.prevent="$store.router.navigate('projects')">Deployments</a></li>
    <li><a href="#" :class="{ active: $store.router.page === 'monitors' || $store.router.page === 'monitor-detail' }" @click.prevent="$store.router.navigate('monitors')">Monitors</a></li>
    <li><a href="#" :class="{ active: $store.router.page === 'restore-tests' }" @click.prevent="$store.router.navigate('restore-tests')">Restore Tests</a></li>
    <li><a href="#" :class="{ active: $store.router.page === 'templates' }" @click.prevent="$store.router.navigate('templates')">Templates</a></li>
    <li><a href="#" :class="{ active: $store.router.page === 'servers' || $store.router.page === 'server-detail' }" @click.prevent="$store.router.navigate('servers')">Servers</a></li>
    <li><a href="#" :class="{ active: $store.router.page === 'operations' || $store.router.page === 'operation-detail' }" @click.prevent="$store.router.navigate('operations')">Operations</a></li>
    <li><a href="#" :class="{ active: $store.router.page === 'settings' }" @click.prevent="$store.router.navigate('settings')">Settings</a></li>
  </ul>
  <div class="navbar-spacer"></div>
  <span class="navbar-env">self-hosted</span>
  <button class="theme-toggle" @click="$store.theme.toggle()" x-text="$store.theme.mode === 'dark' ? 'Light' : 'Dark'"></button>
  <button class="btn-logout" @click="logout()">Sign out</button>
  <div id="load-bar" class="load-bar"></div>
</nav>

<!-- Global CLI-missing banner: shown when the teploy binary isn't on this host.
     Most actions require it; this surfaces the problem up front. -->
<div class="cli-banner" x-data="cliStatusBanner" x-init="init()" x-show="!loading && !installed" x-cloak>
  <strong>teploy CLI not installed on this host.</strong>
  Most actions (deploy, rollback, logs, env) won't work.
  <a href="https://teploy.dev" style="color: white; text-decoration: underline;">Install instructions</a>
</div>

<!-- Content -->
<div class="content">

  <!-- ═══ Homepage ═══ -->
  <template x-if="$store.router.page === 'homepage'">
    <div x-data="homepagePage">
      <div class="page-header">
        <h1 class="page-title">Home</h1>
        <div style="display:flex;gap:8px;align-items:center;">
          <template x-if="editing">
            <button class="btn btn-primary btn-sm" @click="openAdd()">+ Add</button>
          </template>
          <button class="btn btn-sm" @click="editing = !editing; showForm = false"
                  x-text="editing ? 'Done' : 'Edit'"></button>
        </div>
      </div>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading && items.length === 0 && !editing">
        <div class="empty-state">
          <p>No shortcuts yet.</p>
          <button class="btn btn-primary" style="margin-top:12px;" @click="editing = true; openAdd()">Add your first shortcut</button>
        </div>
      </template>

      <template x-if="!loading">
        <div>
          <!-- Add / Edit form -->
          <template x-if="showForm">
            <div class="card" style="margin-bottom:24px;max-width:480px;">
              <div class="form-group">
                <label class="form-label">Name</label>
                <input class="form-input" type="text" x-model="form.name" placeholder="Forgejo">
              </div>
              <div class="form-group">
                <label class="form-label">URL</label>
                <input class="form-input" type="url" x-model="form.url" placeholder="http://100.108.123.49:49152">
              </div>
              <div class="form-group">
                <label class="form-label">Description <span class="text-muted">(optional)</span></label>
                <input class="form-input" type="text" x-model="form.description" placeholder="Self-hosted git">
              </div>
              <div style="display:flex;gap:8px;margin-top:8px;">
                <button class="btn btn-primary" @click="saveForm()" x-text="editingItem ? 'Save' : 'Add'"></button>
                <button class="btn" @click="cancelForm()">Cancel</button>
              </div>
            </div>
          </template>

          <!-- Card grid -->
          <div class="homepage-grid">
            <template x-for="item in items" :key="item.id">
              <div class="homepage-card"
                   :class="{ 'homepage-card-edit': editing, 'homepage-card-dragging': editing && _dragId === item.id, 'homepage-card-dragover': editing && _dragOverId === item.id && _dragId !== item.id }"
                   :draggable="editing"
                   @dragstart="editing && dragStart(item.id, $event)"
                   @dragover="editing && dragOver(item.id, $event)"
                   @dragend="editing && dragEnd()"
                   @click="editing ? openEdit(item) : window.open(item.url, '_blank', 'noopener')">
                <!-- Remove × in top-right corner when editing -->
                <template x-if="editing">
                  <button class="homepage-card-remove" @click.stop="remove(item.id)" title="Remove">&times;</button>
                </template>
                <!-- Favicon with colored-initials fallback -->
                <div class="homepage-card-icon-wrap">
                  <img class="homepage-card-favicon"
                       :src="faviconUrl(item.url)"
                       :style="item._faviconFailed ? 'display:none' : ''"
                       @error="item._faviconFailed = true">
                  <div class="homepage-card-icon"
                       :style="`background:${item.color || '#3b82f6'};${item._faviconFailed ? '' : 'display:none'}`"
                       x-text="iconLetters(item.name)"></div>
                </div>
                <div class="homepage-card-body">
                  <div class="homepage-card-name" x-text="item.name"></div>
                  <div class="homepage-card-desc" x-text="item.description || item.url"></div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Projects Page ═══ -->
  <template x-if="$store.router.page === 'projects'">
    <div x-data="projectsPage">
      <div class="page-header">
        <h1 class="page-title">Deployments</h1>
        <div style="display: flex; gap: 12px; align-items: center; flex: 1; max-width: 500px; margin: 0 24px;">
          <input type="text" class="search-input" placeholder="Search apps..." x-model="search" style="flex: 1;">
        </div>
        <button class="btn" @click="createGroup">+ Group</button>
      </div>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading">
        <div>
          <!-- Groups with their apps -->
          <template x-for="group in groupedApps()" :key="group.name">
            <div style="margin-bottom: 32px;">
              <div class="section-header">
                <h2 class="section-title" x-text="group.name"></h2>
                <div style="display: flex; gap: 8px;" x-show="!group.system">
                  <button class="btn btn-sm" @click="createProject(group.name)">+ Project</button>
                  <button class="btn btn-sm btn-primary" @click="openDeployForm(group.name)">+ Deploy</button>
                </div>
              </div>

              <!-- Inline deploy form for this group -->
              <template x-if="deployingToGroup === group.name">
                <div class="table-wrap" style="padding: 20px; margin-bottom: 16px;">
                  <div class="form-row">
                    <div class="form-group">
                      <label class="form-label">App name</label>
                      <input class="form-input" placeholder="myapp" x-model="deployForm.app">
                    </div>
                    <div class="form-group">
                      <label class="form-label">Docker image</label>
                      <input class="form-input" placeholder="nginx:latest" x-model="deployForm.image">
                    </div>
                    <div class="form-group">
                      <label class="form-label">Domain</label>
                      <input class="form-input" placeholder="myapp.example.com" x-model="deployForm.domain">
                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-group">
                      <label class="form-label">Server</label>
                      <select class="form-input" x-model="deployForm.server">
                        <option value="">Select a server...</option>
                        <template x-for="s in serverList" :key="s">
                          <option :value="s" x-text="s"></option>
                        </template>
                      </select>
                    </div>
                    <div class="form-group">
                      <label class="form-label">Container port</label>
                      <input class="form-input" type="number" placeholder="80" x-model.number="deployForm.port">
                    </div>
                    <div class="form-group" style="display: flex; gap: 8px; align-items: flex-end;">
                      <button class="btn btn-primary" @click="doDeploy(group.name)" :disabled="deploying" x-text="deploying ? 'Deploying...' : 'Deploy'"></button>
                      <button class="btn" @click="deployingToGroup = null">Cancel</button>
                    </div>
                  </div>
                </div>
              </template>

              <div class="card-grid">
                <!-- Project cards -->
                <template x-for="proj in group.projects" :key="'proj-' + proj.name">
                  <div class="card card-project" style="position: relative;" @click="openProject(group.name, proj.name)">
                    <div class="card-title">
                      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink: 0;"><path d="M1.5 2A1.5 1.5 0 0 1 3 .5h4.586a1.5 1.5 0 0 1 1.06.44l.914.913a.5.5 0 0 0 .354.147H13A1.5 1.5 0 0 1 14.5 3.5v9A1.5 1.5 0 0 1 13 14H3A1.5 1.5 0 0 1 1.5 12.5V2Z" stroke="currentColor" stroke-width="1.2"/></svg>
                      <span x-text="proj.name"></span>
                    </div>
                    <div class="card-meta" x-text="(proj.resolvedApps || []).length + ' app' + ((proj.resolvedApps || []).length !== 1 ? 's' : '')"></div>
                    <button title="Delete project"
                      @click.stop="deleteProject(group.name, proj.name)"
                      style="position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; font-size: 14px; opacity: 0.6;">&times;</button>
                  </div>
                </template>
                <!-- Direct app cards -->
                <template x-for="app in group.directApps" :key="app.name">
                  <div class="card" style="position: relative;" @click="openApp(app)">
                    <div class="card-title">
                      <span class="status-dot" :class="app.status"></span>
                      <span x-text="app.name"></span>
                    </div>
                    <div class="card-meta" x-text="app.server"></div>
                    <div class="card-hash" x-text="app.current_hash || app.status"></div>
                    <button x-show="!group.system" title="Remove from group"
                      @click.stop="unassignFromGroup(group.name, app.name)"
                      style="position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; font-size: 14px; opacity: 0.6;">&times;</button>
                  </div>
                </template>
              </div>
              <template x-if="group.directApps.length === 0 && group.projects.length === 0 && deployingToGroup !== group.name">
                <p style="color: var(--text-muted); font-size: 13px;">No apps in this group yet.</p>
              </template>
            </div>
          </template>

          <!-- Empty state when no groups -->
          <template x-if="groupedApps().length === 0">
            <div class="empty-state">
              <p>No groups yet. Create a group to get started, then deploy apps into it.</p>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Project Detail Page ═══ -->
  <template x-if="$store.router.page === 'project-detail'">
    <div x-data="projectDetailPage">
      <a href="#" class="back-link" @click.prevent="$store.router.navigate('projects')">&larr; Deployments</a>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading">
        <div>
          <div class="page-header">
            <div>
              <h1 class="page-title" x-text="projectName"></h1>
              <div class="card-meta" x-text="groupName"></div>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-primary" @click="openDeployForm()">+ Deploy</button>
              <button class="btn" @click="renameThisProject()">Rename</button>
              <button class="btn btn-danger" @click="deleteThisProject()">Delete Project</button>
            </div>
          </div>

          <!-- Inline deploy form -->
          <template x-if="deployingToProject">
            <div class="table-wrap" style="padding: 20px; margin-bottom: 16px;">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">App name</label>
                  <input class="form-input" placeholder="myapp" x-model="deployForm.app">
                </div>
                <div class="form-group">
                  <label class="form-label">Docker image</label>
                  <input class="form-input" placeholder="nginx:latest" x-model="deployForm.image">
                </div>
                <div class="form-group">
                  <label class="form-label">Domain</label>
                  <input class="form-input" placeholder="myapp.example.com" x-model="deployForm.domain">
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Server</label>
                  <select class="form-input" x-model="deployForm.server">
                    <option value="">Select a server...</option>
                    <template x-for="s in serverList" :key="s">
                      <option :value="s" x-text="s"></option>
                    </template>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Container port</label>
                  <input class="form-input" type="number" placeholder="80" x-model.number="deployForm.port">
                </div>
                <div class="form-group" style="display: flex; gap: 8px; align-items: flex-end;">
                  <button class="btn btn-primary" @click="doDeploy()" :disabled="deploying" x-text="deploying ? 'Deploying...' : 'Deploy'"></button>
                  <button class="btn" @click="deployingToProject = false">Cancel</button>
                </div>
              </div>
            </div>
          </template>

          <div class="card-grid">
            <template x-for="app in projectApps" :key="app.name">
              <div class="card" style="position: relative;" @click="openApp(app)">
                <div class="card-title">
                  <span class="status-dot" :class="app.status"></span>
                  <span x-text="app.name"></span>
                </div>
                <div class="card-meta" x-text="app.server"></div>
                <div class="card-hash" x-text="app.current_hash || app.status"></div>
                <button title="Remove from project"
                  @click.stop="unassignFromProject(app.name)"
                  style="position: absolute; top: 8px; right: 8px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; font-size: 14px; opacity: 0.6;">&times;</button>
              </div>
            </template>
          </div>

          <template x-if="projectApps.length === 0 && !deployingToProject">
            <div class="empty-state"><p>No apps in this project yet. Deploy one to get started.</p></div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ App Detail Page ═══ -->
  <template x-if="$store.router.page === 'app-detail'">
    <div x-data="appDetailPage">
      <template x-if="$store.router.params.fromProject">
        <a href="#" class="back-link" @click.prevent="$store.router.navigate('project-detail', { group: $store.router.params.fromGroup, project: $store.router.params.fromProject })">&larr; <span x-text="$store.router.params.fromProject"></span></a>
      </template>
      <template x-if="!$store.router.params.fromProject">
        <a href="#" class="back-link" @click.prevent="$store.router.navigate('projects')">&larr; Deployments</a>
      </template>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading && app">
        <div>
          <div class="page-header">
            <h1 class="page-title" x-text="app.name"></h1>
            <span class="card-meta" x-text="app.server"></span>
          </div>

          <!-- Tabs -->
          <div class="tabs">
            <button class="tab" :class="{ active: tab === 'general' }" @click="switchTab('general')">General</button>
            <button class="tab" :class="{ active: tab === 'env' }" @click="switchTab('env')">Environment</button>
            <button class="tab" :class="{ active: tab === 'logs' }" @click="switchTab('logs')">Logs</button>
            <button class="tab" :class="{ active: tab === 'deploys' }" @click="switchTab('deploys')">Deploys</button>
          </div>

          <!-- General Tab -->
          <template x-if="tab === 'general'">
            <div>
              <div class="status-grid">
                <div class="status-item">
                  <div class="status-label">Version</div>
                  <div class="status-value mono" x-text="app.current_hash || 'N/A'"></div>
                </div>
                <div class="status-item">
                  <div class="status-label">Port</div>
                  <div class="status-value mono" x-text="app.port || 'N/A'"></div>
                </div>
                <div class="status-item">
                  <div class="status-label">Containers</div>
                  <div class="status-value" x-text="containerCount()"></div>
                </div>
                <div class="status-item">
                  <div class="status-label">Locked</div>
                  <div class="status-value" x-text="app.locked ? 'Yes' : 'No'"></div>
                </div>
                <div class="status-item">
                  <div class="status-label">Maintenance</div>
                  <div class="status-value" x-text="app.maintenance ? 'On' : 'Off'"></div>
                </div>
                <div class="status-item">
                  <div class="status-label">Domain</div>
                  <div class="status-value mono" x-text="app.domain || 'N/A'"></div>
                </div>
              </div>

              <div class="btn-group" style="margin-bottom: 24px;">
                <button class="btn" x-show="app.port" @click="doAction('restart')" :disabled="actionLoading">Restart</button>
                <button class="btn" x-show="app.port" @click="doAction('stop')" :disabled="actionLoading">Stop</button>
                <button class="btn" x-show="app.port" @click="doAction('start')" :disabled="actionLoading">Start</button>
                <button class="btn" @click="doAction('rollback')" :disabled="actionLoading">Rollback</button>
                <button class="btn" @click="doAction(app.locked ? 'unlock' : 'lock')" :disabled="actionLoading" x-text="app.locked ? 'Unlock' : 'Lock'"></button>
                <button class="btn" @click="doAction(app.maintenance ? 'maintenance/off' : 'maintenance/on')" :disabled="actionLoading" x-text="app.maintenance ? 'End Maintenance' : 'Maintenance'"></button>
                <button class="btn btn-danger" @click="removeApp()" :disabled="actionLoading">Remove</button>
              </div>

              <!-- Drift: live containers vs what was deployed -->
              <template x-if="drift && !drift.unavailable && drift.deployed !== false">
                <div style="margin-bottom: 24px;">
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                    <h3 style="font-size: 15px;">Drift</h3>
                    <span class="status-dot" :class="drift.drift ? 'stopped' : 'running'"></span>
                    <span style="font-size:13px;" x-text="drift.drift ? (drift.items || []).length + ' difference(s) from the deployed version' : 'In sync with the deployed version'"></span>
                    <button class="btn btn-sm" style="margin-left:auto;" @click="loadDrift()" :disabled="driftLoading">Re-check</button>
                  </div>
                  <template x-if="drift.drift">
                    <div class="table-wrap">
                      <table>
                        <thead><tr><th>Container</th><th>Divergence</th></tr></thead>
                        <tbody>
                          <template x-for="item in (drift.items || [])" :key="item.name">
                            <tr>
                              <td style="font-family: var(--mono); font-size: 12px;" x-text="item.name"></td>
                              <td x-text="item.detail"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                  <template x-if="drift.mode === 'state'">
                    <div class="card-meta" style="margin-top:8px;">
                      Derived from server state — replica-count drift needs teploy.yml.
                    </div>
                  </template>
                </div>
              </template>

              <!-- Resource usage per container -->
              <template x-if="liveStats.length > 0">
                <div style="margin-bottom: 24px;">
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                    <h3 style="font-size: 15px;">Resources</h3>
                    <button class="btn btn-sm" style="margin-left:auto;" @click="loadStats()" :disabled="statsLoading">Refresh</button>
                  </div>
                  <div class="table-wrap">
                    <table>
                      <thead>
                        <tr><th>Container</th><th>CPU</th><th>Memory</th><th>Network I/O</th><th>Block I/O</th></tr>
                      </thead>
                      <tbody>
                        <template x-for="s in liveStats" :key="s.name">
                          <tr>
                            <td style="font-family: var(--mono); font-size: 12px;" x-text="s.name"></td>
                            <td x-text="s.cpu_percent"></td>
                            <td><span x-text="s.memory_usage"></span> <span class="card-meta" style="margin:0;" x-text="'(' + s.memory_percent + ')'"></span></td>
                            <td x-text="s.network_io"></td>
                            <td x-text="s.block_io"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>

              <!-- Containers Table -->
              <template x-if="app.containers && app.containers.length > 0">
                <div>
                  <h3 style="margin-bottom: 12px; font-size: 15px;">Containers</h3>
                  <div class="table-wrap">
                    <table>
                      <thead>
                        <tr>
                          <th>Name</th>
                          <th>Image</th>
                          <th>State</th>
                          <th>Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="c in app.containers" :key="c.ID">
                          <tr>
                            <td style="font-family: var(--mono); font-size: 12px;" x-text="c.Name"></td>
                            <td x-text="c.Image"></td>
                            <td>

                        <th>Version</th>
                        <th>Status</th>
                        <th>Duration</th>

  <!-- ═══ Monitors Page ═══ -->
  <template x-if="$store.router.page === 'monitors'">

        <div>
          <div class="page-header">

            <div class="header-actions">

                </svg>

            </div>
          </template>
        </div>
      </template>

      <!-- Monitor Detail View -->
      <template x-if="selectedMonitor">

          <div class="page-header">
            <div>

              <p class="subtitle" x-text="selectedMonitor?.monitor?.target"></p>

            <div class="header-actions" style="display: flex; gap: 8px; align-items: center;">
              <label style="display: flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer;">

              <span x-show="testResult.status_code" x-text="' — HTTP ' + testResult.status_code"></span>
              <span x-show="testResult.response_time" x-text="' — ' + fmtMs(testResult.response_time)"></span>
              <span x-show="testResult.message" x-text="' — ' + testResult.message"></span>

          </template>

          <!-- Stats -->
          <template x-if="selectedMonitor?.stats">
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-value" x-text="selectedMonitor.stats.uptime_percent?.toFixed(2) + '%'"></div>
                <div class="stat-label">Uptime (24h)</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" x-text="selectedMonitor.stats.total_checks || 0"></div>
                <div class="stat-label">Total Checks</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" x-text="fmtMs(selectedMonitor.stats.avg_response)"></div>
                <div class="stat-label">Avg Response</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" x-text="selectedMonitor.stats.down_checks || 0"></div>
                <div class="stat-label">Downtime Events</div>
              </div>
            </div>
          </template>

          <!-- Check History -->
          <div class="section">
            <h2>Recent Checks</h2>
            <div class="check-list">
              <template x-for="check in (selectedMonitor?.checks || [])" :key="check.checked_at">
                <div class="check-row">
                  <span class="dot" :class="check.status === 'up' ? 'green' : 'red'"></span>
                  <span class="check-status" x-text="check.status"></span>
                  <span class="check-code" x-show="check.status_code" x-text="check.status_code"></span>
                  <span class="check-time" x-text="fmtMs(check.response_time)"></span>
                  <span class="check-date" x-text="formatDate(check.checked_at)"></span>
                  <span class="check-msg" x-show="check.message" x-text="check.message"></span>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- Create Monitor Dialog -->
      <div class="dialog-overlay" x-show="showCreateDialog" @click.self="showCreateDialog = false" x-cloak>
        <div class="dialog">
          <h2>Add Monitor</h2>

            <div class="field">
              <label>Name</label>
              <input type="text" x-model="newMonitor.name" placeholder="My API" required>

            <div class="field">
              <label>Type</label>
              <select x-model="newMonitor.type">
                <option value="http">HTTP</option>
                <option value="tcp">TCP</option>
                <option value="ping">Ping</option>
              </select>
            </div>
            <div class="field">
              <label>Target</label>
              <input type="text" x-model="newMonitor.target"
                :placeholder="newMonitor.type === 'http' ? 'https://example.com' : (newMonitor.type === 'tcp' ? 'example.com:5432' : 'example.com')" required>

            <div class="field-row">
              <div class="field">
                <label>Check Interval</label>
                <select x-model="newMonitor.interval">
                  <option value="30000">30 seconds</option>
                  <option value="60000" selected>1 minute</option>
                  <option value="300000">5 minutes</option>
                  <option value="600000">10 minutes</option>
                </select>
              </div>
              <div class="field">
                <label>Timeout</label>
                <select x-model="newMonitor.timeout">
                  <option value="5000">5 seconds</option>
                  <option value="10000" selected>10 seconds</option>
                  <option value="30000">30 seconds</option>
                </select>
              </div>
            </div>
            <div class="field-row" x-show="newMonitor.type === 'http'">
              <div class="field">
                <label>Method</label>
                <select x-model="newMonitor.method">
                  <option value="GET">GET</option>
                  <option value="HEAD">HEAD</option>
                  <option value="POST">POST</option>
                </select>
              </div>
              <div class="field">
                <label>Expected Status <span style="opacity:0.6">(optional)</span></label>
                <input type="number" x-model="newMonitor.expected_status" placeholder="any 2xx/3xx">
              </div>
            </div>
            <div class="dialog-actions">
              <button type="button" class="btn" @click="showCreateDialog = false">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="creating">
                <span x-show="!creating">Create</span>
                <span x-show="creating">Creating...</span>
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </template>


  <!-- ═══ Restore Tests Page ═══ -->
  <template x-if="$store.router.page === 'restore-tests'">
    <div x-data="restoreTestsPage">

        <div>

          <button class="btn btn-primary" @click="showCreateDialog = true">Add Restore Test</button>

        <div class="loading"><div class="spinner"></div></div>
      </template>

                  <span class="monitor-name" x-text="t.app + '/' + t.accessory"></span>
                  <span class="monitor-type badge" x-text="t.server"></span>

                </div>

                  </button>

                </div>
              </div>

                <span x-text="'s3://' + t.bucket + ' — every ' + t.interval_hours + 'h'"></span>

                  <span>
                    <strong x-text="t.last_ok ? 'OK' : 'FAILED'" :style="t.last_ok ? 'color:var(--green, #2da44e)' : 'color:var(--red, #cf222e)'"></strong>
                    <span x-show="t.last_date" x-text="' — backup ' + t.last_date"></span>
                    <span x-show="t.last_metric" x-text="' — ' + t.last_metric"></span>
                    <span x-show="t.last_duration_ms" x-text="' — ' + (t.last_duration_ms / 1000).toFixed(1) + 's'"></span>
                    <span x-text="' — ' + formatDate(t.last_run_at)"></span>
                  </span>

                <template x-if="!t.last_run_at || t.last_run_at.startsWith('0001')">
                  <span>Never run</span>

              </div>
              <div class="monitor-meta" x-show="!t.last_ok && t.last_detail">

                </div>

                  <div class="progress-fill" :class="barClass(parsePercent(status.disk_percent))" :style="'width:' + parsePercent(status.disk_percent) + '%'"></div>
                </div>
              </div>

              <!-- Containers -->
              <template x-if="status.containers && status.containers.length > 0">
                <div>
                  <h3 style="margin-bottom: 12px; font-size: 15px;">Containers</h3>
                  <div class="table-wrap">
                    <table>
                      <thead>
                        <tr>
                          <th>Name</th>
                          <th>Image</th>
                          <th>State</th>
                          <th>Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="c in status.containers" :key="c.ID">
                          <tr>
                            <td style="font-family: var(--mono); font-size: 12px;" x-text="c.Name"></td>
                            <td x-text="c.Image"></td>
                            <td>
                              <span class="status-dot" :class="c.State === 'running' ? 'running' : 'stopped'" style="margin-right: 6px;"></span>
                              <span x-text="c.State"></span>
                            </td>
                            <td x-text="c.Status"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
              <template x-if="!status.containers || status.containers.length === 0">
                <div class="empty-state"><p>No containers running on this server.</p></div>
              </template>
            </div>
          </template>

          <!-- Proxy Tab -->
          <template x-if="tab === 'proxy'">
            <div>
              <div class="status-grid" style="margin-bottom: 24px;">
                <div class="status-item">
                  <div class="status-label">Caddy</div>
                  <div class="status-value" style="display: flex; align-items: center; gap: 8px;">
                    <span class="status-dot" :class="proxy && proxy.running ? 'running' : 'stopped'"></span>
                    <span x-text="proxy && proxy.running ? 'Running' : 'Not running'"></span>
                  </div>
                </div>
                <div class="status-item">
                  <div class="status-label">Routes</div>
                  <div class="status-value" x-text="proxy ? proxy.routes.length : 0"></div>
                </div>
              </div>

              <template x-if="proxy && proxy.routes.length > 0">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Domain</th>
                        <th>Upstream</th>
                        <th>Type</th>
                        <th>Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="route in proxy.routes" :key="route.id">
                        <tr>
                          <td style="font-family: var(--mono); font-size: 12px;" x-text="(route.domains || []).join(', ') || '-'"></td>
                          <td style="font-family: var(--mono); font-size: 12px;" x-text="(route.upstreams || []).join(', ') || '-'"></td>
                          <td x-text="route.handler || '-'"></td>
                          <td>
                            <template x-if="route.maintenance">
                              <span style="color: var(--yellow); font-weight: 500;">Maintenance</span>
                            </template>
                            <template x-if="!route.maintenance">
                              <span style="color: var(--green);">Active</span>
                            </template>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>

              <template x-if="!proxy || proxy.routes.length === 0">
                <div class="empty-state">
                  <template x-if="proxy && proxy.running">
                    <p>Caddy is running but no routes are configured. Deploy an app to add routes.</p>
                  </template>
                  <template x-if="!proxy || !proxy.running">
                    <p>Caddy is not running. Run <code style="background: var(--bg-input); padding: 2px 6px; border-radius: 4px;">teploy setup</code> to install it.</p>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Templates Page ═══ -->
  <template x-if="$store.router.page === 'templates'">
    <div x-data="templatesPage">
      <div class="page-header">
        <h1 class="page-title">Templates</h1>
        <p class="subtitle">Install ready-made apps from the teploy catalog.</p>
      </div>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading && (templates || []).length === 0">
        <div class="empty-state">
          <p>No templates available. Check that teploy CLI is installed and `teploy template list` returns results.</p>
        </div>
      </template>

      <template x-if="!loading && selected">
        <div class="table-wrap" style="padding: 20px; margin-bottom: 16px;">
          <h2 class="section-title" x-text="'Install ' + selected.name"></h2>
          <p class="subtitle" x-text="selected.description"></p>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Domain</label>
              <input class="form-input" x-model="installForm.domain" placeholder="app.example.com">
            </div>
            <div class="form-group">
              <label class="form-label">Server</label>
              <select class="form-input" x-model="installForm.server">
                <option value="">Select a server...</option>
                <template x-for="s in serverList" :key="s">
                  <option :value="s" x-text="s"></option>
                </template>
              </select>
            </div>
          </div>

          <template x-for="v in (selected.vars || [])" :key="v.key || v">
            <div class="form-group">
              <label class="form-label" x-text="v.label || v.key || v"></label>
              <input class="form-input" :placeholder="v.default || ''" @input="installForm.vars[v.key || v] = $event.target.value">
            </div>
          </template>

          <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button class="btn btn-primary" @click="install()" :disabled="installing" x-text="installing ? 'Installing...' : 'Install'"></button>
            <button class="btn" @click="selected = null">Cancel</button>
          </div>
        </div>
      </template>

      <template x-if="!loading && !selected && (templates || []).length > 0">
        <div class="card-grid">
          <template x-for="t in templates" :key="t.name">
            <div class="card" @click="selectTemplate(t)">
              <div class="card-title" x-text="t.name"></div>
              <div class="card-meta" x-text="t.description"></div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Operations Page ═══ -->
  <template x-if="$store.router.page === 'operations'">
    <div x-data="operationsPage">
      <div class="page-header">
        <h1 class="page-title">Operations</h1>
        <div class="header-actions">
          <select class="form-input" style="width:auto;" x-model="statusFilter" @change="load()">
            <option value="">All statuses</option>
            <option value="queued">Queued</option>
            <option value="running">Running</option>
            <option value="succeeded">Succeeded</option>
            <option value="failed">Failed</option>
            <option value="canceled">Canceled</option>
            <option value="interrupted">Interrupted</option>
          </select>
          <button class="btn btn-sm" @click="load()">Refresh</button>
        </div>
      </div>

      <template x-if="!loading && ops.length === 0">
        <div class="empty-state">
          <p>No operations yet.</p>
          <p style="color: var(--text-muted); font-size: 12px; margin-top: 6px;">
            Deploys, rollbacks, and removals started from the dashboard appear here with live logs.
          </p>
        </div>
      </template>

      <template x-if="ops.length > 0">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Status</th>
                <th>Kind</th>
                <th>Target</th>
                <th>Attempt</th>
                <th>Started</th>
                <th>Duration</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="op in ops" :key="op.id">
                <tr style="cursor:pointer;" @click="open(op)">
                  <td>
                    <span class="status-dot" :class="{ running: op.status === 'running' || op.status === 'succeeded', stopped: op.status === 'failed' || op.status === 'interrupted', unknown: op.status === 'queued' || op.status === 'canceled' }"></span>
                    <span x-text="op.status"></span>
                  </td>
                  <td style="font-family: var(--mono); font-size: 12px;" x-text="op.request.kind"></td>
                  <td x-text="op.target"></td>
                  <td x-text="op.attempt"></td>
                  <td x-text="when(op.started_at || op.created_at)"></td>
                  <td x-text="duration(op)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Operation Detail ═══ -->
  <template x-if="$store.router.page === 'operation-detail'">
    <div x-data="operationDetailPage">
      <a href="#" class="back-link" @click.prevent="$store.router.navigate('operations')">&larr; Operations</a>

      <template x-if="!loading && op">
        <div>
          <div class="page-header">
            <h1 class="page-title" x-text="op.request.kind + ' — ' + op.target"></h1>
            <div class="header-actions">
              <button class="btn" x-show="cancelable()" @click="cancel()" :disabled="actionLoading">Cancel</button>
              <button class="btn" x-show="retryable()" @click="retry()" :disabled="actionLoading">Retry</button>
            </div>
          </div>

          <div class="card-grid" style="margin-bottom: 16px;">
            <div class="card">
              <div class="card-meta">Status</div>
              <div class="card-title">
                <span class="status-dot" :class="{ running: op.status === 'running' || op.status === 'succeeded', stopped: op.status === 'failed' || op.status === 'interrupted', unknown: op.status === 'queued' || op.status === 'canceled' }"></span>
                <span x-text="op.status"></span>
              </div>
            </div>
            <div class="card">
              <div class="card-meta">Started</div>
              <div class="card-title" style="font-size: 13px;" x-text="when(op.started_at)"></div>
            </div>
            <div class="card">
              <div class="card-meta">Duration</div>
              <div class="card-title" style="font-size: 13px;" x-text="duration(op)"></div>
            </div>
            <div class="card">
              <div class="card-meta">Exit code</div>
              <div class="card-title mono" x-text="op.exit_code === null || op.exit_code === undefined ? '—' : op.exit_code"></div>
            </div>
          </div>

          <template x-if="op.error">
            <div class="cli-banner" style="margin: 0 0 16px; border-radius: var(--radius); text-align: left;" x-text="op.error"></div>
          </template>

          <div class="log-viewer" x-ref="opLog" style="max-height: 60vh;">
            <template x-for="(line, i) in lines" :key="i">
              <span :class="line.cls" x-text="line.text"></span>
            </template>
            <template x-if="lines.length === 0">
              <span style="color: var(--text-muted);">Waiting for output…</span>
            </template>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Settings Page ═══ -->
  <template x-if="$store.router.page === 'settings'">
    <div x-data="settingsPage">
      <div class="page-header">
        <h1 class="page-title">Settings</h1>
      </div>

      <div class="tabs">
        <button x-show="isAdmin()" class="tab" :class="{ active: tab === 'servers' }" @click="tab = 'servers'">Servers</button>
        <button class="tab" :class="{ active: tab === 'groups' }" @click="tab = 'groups'">Groups</button>
        <button x-show="isAdmin()" class="tab" :class="{ active: tab === 'notifications' }" @click="tab = 'notifications'">Notifications</button>
        <button x-show="isAdmin()" class="tab" :class="{ active: tab === 'registry' }" @click="tab = 'registry'">Registry</button>
        <button x-show="isAdmin()" class="tab" :class="{ active: tab === 'mcp' }" @click="tab = 'mcp'">MCP</button>
        <button x-show="isAdmin()" class="tab" :class="{ active: tab === 'users' }" @click="tab = 'users'">Users</button>
        <button class="tab" :class="{ active: tab === 'account' }" @click="tab = 'account'">Account</button>
      </div>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <!-- Servers Tab -->
      <template x-if="!loading && tab === 'servers'">
        <div>
          <div class="form-row" style="margin-bottom: 16px;">
            <div class="form-group">
              <label class="form-label">Name</label>
              <input class="form-input" x-model="newServer.name" placeholder="prod">
            </div>
            <div class="form-group">
              <label class="form-label">Host</label>
              <input class="form-input" x-model="newServer.host" placeholder="192.168.1.100">
            </div>
            <div class="form-group">
              <label class="form-label">User</label>
              <input class="form-input" x-model="newServer.user" placeholder="root">
            </div>
            <div class="form-group">
              <label class="form-label">Role</label>
              <select class="form-input" x-model="newServer.role">
                <option value="app">Standard</option>
                <option value="lb">Load Balancer</option>
              </select>
            </div>
            <button class="btn btn-primary" @click="addServer()" >Add</button>
          </div>

          <template x-if="serverList().length > 0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Host</th>
                    <th>User</th>
                    <th>Role</th>
                    <th style="width: 80px;"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="s in serverList()" :key="s.name">
                    <tr>
                      <td x-text="s.name"></td>
                      <td style="font-family: var(--mono); font-size: 12px;" x-text="s.host"></td>
                      <td x-text="s.user || 'root'"></td>
                      <td x-text="(s.role || 'app') === 'lb' ? 'Load Balancer' : 'Standard'"></td>
                      <td style="display: flex; gap: 6px; justify-content: flex-end;">
                        <button class="btn btn-sm" @click="editServer(s.name)">Edit</button>
                        <button class="btn btn-sm btn-danger" @click="deleteServer(s.name)">Remove</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <!-- Edit Server Form -->
          <template x-if="editingServer">
            <div class="table-wrap" style="padding: 20px; margin-top: 16px;">
              <h3 class="section-title" style="font-size: 14px;">Edit <span x-text="editingServer.originalName"></span></h3>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Name</label>
                  <input class="form-input" x-model="editingServer.name">
                </div>
                <div class="form-group">
                  <label class="form-label">Host</label>
                  <input class="form-input" x-model="editingServer.host">
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">User</label>
                  <input class="form-input" x-model="editingServer.user">
                </div>
                <div class="form-group">
                  <label class="form-label">Role</label>
                  <select class="form-input" x-model="editingServer.role">
                    <option value="app">Standard</option>
                    <option value="lb">Load Balancer</option>
                  </select>
                </div>
              </div>
              <div style="display: flex; gap: 8px; margin-top: 12px;">
                <button class="btn btn-primary" @click="saveEditServer()">Save</button>
                <button class="btn" @click="cancelEdit()">Cancel</button>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- Groups Tab -->
      <template x-if="!loading && tab === 'groups'">
        <div>
          <div class="form-row" style="margin-bottom: 16px;">
            <div class="form-group">
              <input class="form-input" x-model="newGroupName" placeholder="Group name">
            </div>
            <button class="btn btn-primary" @click="createGroup()" >Create</button>
          </div>

          <template x-if="groups && groups.length > 0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Apps</th>
                    <th style="width: 80px;"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="g in groups" :key="g.name">
                    <tr>
                      <td x-text="g.name"></td>
                      <td x-text="(g.apps || []).length"></td>
                      <td style="display: flex; gap: 6px; justify-content: flex-end;">
                        <button class="btn btn-sm" @click="renameGroup(g.name)">Rename</button>
                        <button class="btn btn-sm btn-danger" @click="deleteGroup(g.name)">Delete</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="!groups || groups.length === 0">
            <div class="empty-state"><p>No groups. Create one to organize your apps.</p></div>
          </template>
        </div>
      </template>

      <!-- Notifications Tab -->
      <template x-if="!loading && tab === 'notifications'">
        <div>
          <p class="subtitle" style="margin-bottom: 16px;">Alerts fire on monitor state changes (up→down, down→up). Configure at least one channel.</p>

          <h3 class="section-title" style="font-size: 14px; margin-top: 8px;">Webhook</h3>
          <div class="form-group">
            <label class="form-label">Webhook URL</label>
            <input class="form-input" x-model="notifications.webhook_url" placeholder="https://hooks.slack.com/services/...">
          </div>

          <h3 class="section-title" style="font-size: 14px; margin-top: 24px;">Email (SMTP)</h3>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">SMTP Host</label>
              <input class="form-input" x-model="notifications.smtp_host" placeholder="smtp.gmail.com">
            </div>
            <div class="form-group">
              <label class="form-label">SMTP Port</label>
              <input class="form-input" type="number" x-model.number="notifications.smtp_port" placeholder="587">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">SMTP User</label>
              <input class="form-input" x-model="notifications.smtp_user" placeholder="alerts@example.com">
            </div>
            <div class="form-group">
              <label class="form-label">SMTP Password</label>
              <input class="form-input" type="password" x-model="notifications.smtp_pass" placeholder="••••••••">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">From</label>
              <input class="form-input" x-model="notifications.email_from" placeholder="alerts@example.com">
            </div>
            <div class="form-group">
              <label class="form-label">To</label>
              <input class="form-input" x-model="notifications.email_to" placeholder="team@example.com">
            </div>
          </div>

          <div style="display: flex; gap: 8px; margin-top: 16px;">
            <button class="btn btn-primary" @click="saveNotifications()">Save</button>
          </div>
        </div>
      </template>

      <!-- Registry Tab -->
      <template x-if="!loading && tab === 'registry'">
        <div>
          <div class="form-row" style="margin-bottom: 16px;">
            <div class="form-group">
              <label class="form-label">Server</label>
              <input class="form-input" x-model="newReg.server" placeholder="ghcr.io">
            </div>
            <div class="form-group">
              <label class="form-label">Username</label>
              <input class="form-input" x-model="newReg.username" placeholder="username">
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input class="form-input" type="password" x-model="newReg.password" placeholder="token">
            </div>
            <button class="btn btn-primary" @click="addRegistry()" >Add</button>
          </div>

          <template x-if="registries && registries.length > 0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Server</th>
                    <th>Username</th>
                    <th style="width: 80px;"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="r in registries" :key="r.server">
                    <tr>
                      <td x-text="r.server"></td>
                      <td x-text="r.username"></td>
                      <td>
                        <button class="btn btn-sm btn-danger" @click="deleteRegistry(r.server)">Remove</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="!registries || registries.length === 0">
            <div class="empty-state"><p>No registries configured.</p></div>
          </template>
        </div>
      </template>

      <!-- Account Tab -->
      <!-- MCP Tab -->
      <template x-if="!loading && tab === 'mcp'">
        <div style="max-width: 640px;">
          <div class="card" style="padding: 24px; margin-bottom: 16px;">
            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">MCP access tokens</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
              Let AI clients (Claude Code, Cursor, any MCP client) read fleet state and run deploy
              actions through this dashboard. Every action goes through the teploy CLI — the same
              path as the buttons here — so there is no second source of truth. Endpoint:
              <code style="font-family: var(--mono);">POST /api/mcp</code> with the token as a Bearer header.
            </p>
            <div class="form-row" style="margin-bottom: 16px; align-items: flex-end;">
              <div class="form-group">
                <label class="form-label">Token name</label>
                <input class="form-input" x-model="newMcpToken.name" placeholder="claude-code">
              </div>
              <div class="form-group">
                <label class="form-label">Access</label>
                <select class="form-input" x-model="newMcpToken.readOnly">
                  <option value="false">Read + actions</option>
                  <option value="true">Read-only</option>
                </select>
              </div>
              <button class="btn btn-primary" @click="createMcpToken()">Create</button>
            </div>

            <template x-if="createdMcpToken">
              <div class="card" style="padding: 14px 16px; margin-bottom: 16px; border: 1px solid var(--green); ">
                <p style="font-size: 13px; margin-bottom: 8px;">Copy this token now — it will not be shown again.</p>
                <code style="font-family: var(--mono); font-size: 12px; word-break: break-all;" x-text="createdMcpToken"></code>
              </div>
            </template>

            <template x-if="mcpTokens.length > 0">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr><th>Name</th><th>Access</th><th>Created</th><th>Last used</th><th style="width: 80px;"></th></tr>
                  </thead>
                  <tbody>
                    <template x-for="t in mcpTokens" :key="t.id">
                      <tr>
                        <td x-text="t.name"></td>
                        <td x-text="t.read_only ? 'Read-only' : 'Read + actions'"></td>
                        <td style="font-size: 12px;" x-text="new Date(t.created_at).toLocaleDateString()"></td>
                        <td style="font-size: 12px;" x-text="t.last_used && !t.last_used.startsWith('0001') ? new Date(t.last_used).toLocaleString() : 'never'"></td>
                        <td style="text-align: right;">
                          <button class="btn btn-sm btn-danger" @click="deleteMcpToken(t.id)">Revoke</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
            <template x-if="mcpTokens.length === 0 && !createdMcpToken">
              <p style="font-size: 13px; color: var(--text-muted);">No tokens yet.</p>
            </template>
          </div>

          <div class="card" style="padding: 24px;">
            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">Connect a client</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">Claude Code example:</p>
            <pre style="font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto;">claude mcp add teploy --transport http \
  --header "Authorization: Bearer &lt;token&gt;" \
  <span x-text="location.origin + '/api/mcp'"></span></pre>
          </div>
        </div>
      </template>

      <!-- Users Tab -->
      <template x-if="!loading && tab === 'users'">
        <div style="max-width: 720px;">
          <div class="card" style="padding: 24px; margin-bottom: 16px;">
            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">Team access</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
              Dashboard accounts and their roles. <strong>Admin</strong> manages users, servers, and settings;
              <strong>Editor</strong> can deploy and run app actions; <strong>Viewer</strong> is read-only.
              Access governs this dashboard only — anyone with SSH to a server can still act on it directly.
            </p>
            <div class="form-row" style="margin-bottom: 16px; align-items: flex-end;">
              <div class="form-group">
                <label class="form-label">Username</label>
                <input class="form-input" x-model="newUser.username" placeholder="jane">
              </div>
              <div class="form-group">
                <label class="form-label">Password</label>
                <input class="form-input" type="password" x-model="newUser.password" placeholder="At least 8 characters">
              </div>
              <div class="form-group">
                <label class="form-label">Role</label>
                <select class="form-input" x-model="newUser.role">
                  <option value="viewer">Viewer</option>
                  <option value="editor">Editor</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <button class="btn btn-primary" @click="createUser()">Add user</button>
            </div>

            <template x-if="users.length > 0">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr><th>Username</th><th>Role</th><th style="width: 220px;"></th></tr>
                  </thead>
                  <tbody>
                    <template x-for="u in users" :key="u.username">
                      <tr>
                        <td x-text="u.username"></td>
                        <td>
                          <select class="form-input" style="max-width: 130px; padding: 4px 8px;"
                                  @change="changeRole(u.username, $event.target.value)">
                            <option value="viewer" :selected="u.role === 'viewer'">Viewer</option>
                            <option value="editor" :selected="u.role === 'editor'">Editor</option>
                            <option value="admin" :selected="u.role === 'admin'">Admin</option>
                          </select>
                        </td>
                        <td style="display: flex; gap: 6px; justify-content: flex-end;">
                          <button class="btn btn-sm" @click="resetUserPassword(u.username)">Reset password</button>
                          <button class="btn btn-sm btn-danger" @click="deleteUser(u.username)"
                                  x-show="u.username !== (me && me.username)">Remove</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
            <template x-if="users.length === 0">
              <p style="font-size: 13px; color: var(--text-muted);">No users yet.</p>
            </template>
          </div>
        </div>
      </template>

      <template x-if="!loading && tab === 'account'">
        <div style="max-width: 420px;">
          <div class="card" style="padding: 24px;">
            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 4px;">Change password</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">After changing your password you will be signed out.</p>
            <div class="form-group">
              <label class="form-label">Current password</label>
              <input class="form-input" type="password" x-model="pw.current" autocomplete="current-password">
            </div>
            <div class="form-group">
              <label class="form-label">New password</label>
              <input class="form-input" type="password" x-model="pw.next" autocomplete="new-password" placeholder="At least 8 characters">
            </div>
            <div class="form-group">
              <label class="form-label">Confirm new password</label>
              <input class="form-input" type="password" x-model="pw.confirm" autocomplete="new-password">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 4px;">
              <button class="btn btn-primary" @click="changePassword()" :disabled="pw.saving">
                <span x-text="pw.saving ? 'Saving...' : 'Change password'"></span>
              </button>
            </div>
            <p x-show="pw.error" x-text="pw.error" style="font-size: 13px; color: var(--red); margin-top: 12px;"></p>
          </div>
        </div>
      </template>
    </div>
  </template>

</div>

<!-- Toast Container -->
<div id="toast-container" class="toast-container"></div>

</body>
</html>
