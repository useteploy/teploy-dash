                  <div class="form-group" x-show="draft.scope === 'monitor'">
                    <label class="form-label">Monitor</label>
                    <select class="form-input" x-model="draft.target">
                      <template x-for="m in monitors" :key="m.id"><option :value="m.id" x-text="m.name"></option></template>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">For</label>
                    <select class="form-input" x-model.number="draft.duration_minutes">
                      <option value="30">30 minutes</option>
                      <option value="60">1 hour</option>
                      <option value="240">4 hours</option>
                      <option value="1440">1 day</option>
                      <option value="10080">7 days</option>
                    </select>
                  </div>
                  <div class="form-group" style="flex: 2;">
                    <label class="form-label">Reason</label>
                    <input class="form-input" x-model="draft.reason" placeholder="database migration">
                  </div>
                  <button class="btn" @click="addSilence()">Silence</button>
                </div>
              </div>

              <div class="table-wrap" style="padding: 12px 16px;">
                <strong>Recent alert deliveries</strong>
                <template x-if="deliveries.length === 0"><p class="card-meta" style="margin: 6px 0 0;">No alerts yet.</p></template>
                <template x-for="d in deliveries.slice(0, 20)" :key="d.id">
                  <div style="margin-top: 6px; font-size: 13px;">
                    <span class="badge" :class="deliveryClass(d.status)" x-text="d.status"></span>
                    <span x-text="kindText(d.kind) + ': ' + (d.rule_name || d.rule_id)"></span>
                    <span class="card-meta" x-text="' ' + formatDate(d.created_at)"></span>
                    <div class="card-meta" style="margin: 2px 0 0;" x-show="d.note" x-text="d.note"></div>
                    <div class="card-meta" style="margin: 2px 0 0; font-family: var(--mono); word-break: break-word;" x-show="d.status !== 'delivered' && d.last_error" x-text="d.last_error"></div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Empty State -->
          <template x-if="!loading && !loadFailed && monitors.length === 0">
            <div class="empty-state">
              <div class="empty-icon">
                <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
              </div>
              <h3>No monitors yet</h3>
              <p>Add your first uptime monitor to start tracking availability.</p>
              <button class="btn btn-primary" @click="openCreate()">Add Monitor</button>
            </div>
          </template>
        </div>
      </template>

      <!-- Monitor detail: loading / not-found states for a deep link -->
      <template x-if="detailId && !selectedMonitor">
        <div>
          <a href="/monitors" class="back-link" @click.prevent="openList()">&larr; Monitors</a>
          <template x-if="detailError">
            <div role="alert" class="empty-state"><p x-text="detailError"></p><button class="btn btn-sm" @click="loadDetail()">Retry</button></div>
          </template>
          <template x-if="!detailError">
            <div class="empty-state" role="status"><p>Loading monitor...</p></div>
          </template>
        </div>
      </template>

      <!-- Monitor Detail View -->
      <template x-if="detailId && selectedMonitor">
        <div>
          <div class="page-header">
            <div>
              <a href="/monitors" class="back-link" @click.prevent="openList()">&larr; Monitors</a>
              <h1 class="page-title" x-text="selectedMonitor?.monitor?.name"></h1>
              <p class="subtitle" x-text="selectedMonitor?.monitor?.target"></p>
            </div>
            <div class="header-actions" style="display: flex; gap: 8px; align-items: center;">
              <label style="display: flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer;">
                <input type="checkbox" :checked="selectedMonitor.monitor.enabled" @change="toggleEnabled(selectedMonitor.monitor)">
                <span x-text="selectedMonitor.monitor.enabled ? 'Enabled' : 'Disabled'"></span>
              </label>
              <button class="btn" @click="testMonitor(selectedMonitor.monitor.id)" :disabled="testing">
                <span x-text="testing ? 'Testing...' : 'Test Now'"></span>
              </button>
              <button class="btn" @click="startEdit(selectedMonitor.monitor)">Edit</button>
              <button class="btn btn-danger" @click="deleteMonitor(selectedMonitor.monitor.id)">Delete</button>
            </div>
          </div>

          <!-- Push monitor URL and alert policy (Alerts v2). -->
          <template x-if="selectedMonitor.monitor.type === 'push'">
            <div class="table-wrap" style="padding: 12px 16px; margin-bottom: 16px;">
              <strong>Push URL</strong>
              <p class="card-meta" style="margin: 4px 0;">Request this URL when the job succeeds; add <code>?status=down&amp;msg=...</code> on failure. Treat it as a secret.</p>
              <template x-if="!pushPath">
                <button class="btn btn-sm" @click="revealPushURL(selectedMonitor.monitor)">Show push URL</button>
              </template>
              <template x-if="pushPath">
                <div>
                  <code style="word-break: break-all;" x-text="pushURL()"></code>
                  <button class="btn btn-sm" style="margin-left: 8px;" @click="copyPushURL()">Copy</button>
                </div>
              </template>
            </div>
          </template>
          <p class="card-meta" style="margin: 0 0 12px;" x-text="policyText(selectedMonitor.monitor)"></p>

          <!-- Test result flash -->
          <template x-if="testResult">
            <div class="test-result" :class="testResult.status === 'up' ? 'test-result-up' : 'test-result-down'" style="padding: 12px; border-radius: 6px; margin-bottom: 16px;">
              <strong x-text="testResult.status === 'up' ? 'UP' : 'DOWN'"></strong>
              <span x-show="testResult.status_code" x-text="' — HTTP ' + testResult.status_code"></span>
              <span x-show="testResult.response_time" x-text="' — ' + fmtMs(testResult.response_time)"></span>
              <span x-show="testResult.message" x-text="' — ' + testResult.message"></span>
            </div>
          </template>

          <!-- Stats -->
          <template x-if="selectedMonitor?.stats">
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-value" x-text="selectedMonitor.stats.uptime_percent?.toFixed(2) + '%'"></div>
                <div class="stat-label">Uptime (24h)</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" x-text="selectedMonitor.stats.total_checks || 0"></div>
                <div class="stat-label">Total Checks</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" x-text="fmtMs(selectedMonitor.stats.avg_response)"></div>
                <div class="stat-label">Avg Response</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" x-text="selectedMonitor.stats.down_checks || 0"></div>
                <div class="stat-label">Downtime Events</div>
              </div>
            </div>
          </template>

          <!-- Alert delivery (D08): the durable outbox's last delivery for
               this monitor — status, attempts, the exact last failure, and
               the next retry. Hidden when there is nothing to say (no
               delivery yet, or the last one landed). -->
          <template x-if="selectedMonitor?.delivery">
            <div class="section" style="margin-top: 4px;">
              <h2>Alert delivery</h2>
              <div class="table-wrap" style="padding: 12px 16px;">
                <div style="display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap;">
                  <span class="badge"
                        :class="selectedMonitor.delivery.status === 'delivered' ? 'green' : (selectedMonitor.delivery.status === 'dead_lettered' ? 'red' : 'yellow')"
                        x-text="selectedMonitor.delivery.status"></span>
                  <span x-text="'attempt ' + (selectedMonitor.delivery.attempts || 0)"></span>
                  <span class="card-meta" style="margin: 0;"
                        x-text="'event: ' + selectedMonitor.delivery.event_status + ' at ' + formatDate(selectedMonitor.delivery.occurred_at)"></span>
                  <span class="card-meta" style="margin: 0;"
                        x-show="selectedMonitor.delivery.next_retry_at || selectedMonitor.delivery.next_attempt_at"
                        x-text="'next retry: ' + formatDate(selectedMonitor.delivery.next_retry_at || selectedMonitor.delivery.next_attempt_at)"></span>
                </div>
                <p x-show="selectedMonitor.delivery.last_error"
                   style="margin: 10px 0 0; color: var(--red); font-size: 12px; font-family: var(--mono); word-break: break-word;"
                   x-text="'last failure: ' + selectedMonitor.delivery.last_error"></p>
                <p x-show="selectedMonitor.delivery.last_attempt_at"
                   class="card-meta" style="margin: 4px 0 0;"
                   x-text="'last attempt: ' + formatDate(selectedMonitor.delivery.last_attempt_at)"></p>
              </div>
            </div>
          </template>

          <!-- Check History -->
          <div class="section">
            <h2>Recent Checks</h2>
            <div class="check-list">
              <template x-for="check in (selectedMonitor?.checks || [])" :key="check.checked_at">
                <div class="check-row">
                  <span class="dot" :class="check.status === 'up' ? 'green' : 'red'"></span>
                  <span class="check-status" x-text="check.status"></span>
                  <span class="check-code" x-show="check.status_code" x-text="check.status_code"></span>
                  <span class="check-time" x-text="fmtMs(check.response_time)"></span>
                  <span class="check-date" x-text="formatDate(check.checked_at)"></span>
                  <span class="check-msg" x-show="check.message" x-text="check.message"></span>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- Create Monitor Dialog. Focus is trapped while open (A49/A58):
           Tab/Shift+Tab wrap inside the dialog, Escape closes, and the
           dialog itself takes initial focus so keyboard users land in it. -->
      <div class="dialog-overlay" x-show="showCreateDialog" @click.self="closeDialog()"
           @keydown.tab="trapDialogFocus($event)"
           @keydown.escape.window="showCreateDialog && closeDialog()" x-cloak>
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="monitor-dialog-title"
             tabindex="-1" x-effect="showCreateDialog && $nextTick(() => $el.focus())">
          <h2 id="monitor-dialog-title" x-text="editingId ? 'Edit Monitor' : 'Add Monitor'">Add Monitor</h2>
          <form @submit.prevent="createMonitor()">
            <div class="field">
              <label for="monitor-name">Name</label>
              <input type="text" id="monitor-name" x-model="newMonitor.name" placeholder="My API" required>
            </div>
            <div class="field">
              <label for="monitor-type">Type</label>
              <select id="monitor-type" x-model="newMonitor.type">
                <option value="http">HTTP</option>
                <option value="tcp">TCP</option>
                <option value="ping">TCP ping (reachability)</option>
                <option value="push">Push / heartbeat (a job pings Dash)</option>
              </select>
            </div>
            <template x-if="newMonitor.type === 'push'">
              <div class="field">
                <p style="opacity:0.7;font-size:0.85em;margin:0">
                  Dash gives this monitor a secret URL after saving. Have the job (a backup, a cron task)
                  request it when it finishes: <code>curl -fsS -m 10 URL</code>. Add <code>?status=down&amp;msg=...</code>
                  to report a failure. The monitor goes down when no ping arrives within the interval plus grace.
                </p>
              </div>
            </template>
            <div class="field" x-show="newMonitor.type !== 'push'">
              <label for="monitor-target">Target</label>
              <input type="text" id="monitor-target" x-model="newMonitor.target"
                :placeholder="newMonitor.type === 'http' ? 'https://example.com' : 'example.com:5432 (host:port)'" :required="newMonitor.type !== 'push'">
            </div>
            <div class="field" x-show="newMonitor.type !== 'push'">
              <label><input type="checkbox" x-model="newMonitor.allow_internal"> Allow internal targets</label>
              <p style="opacity:0.6;font-size:0.85em;margin-top:4px">
                Off by default: loopback, private-network (RFC1918), link-local, and cloud
                metadata addresses are rejected. Enable only for monitors intentionally
                targeting your own infrastructure (e.g. over Tailscale).
              </p>
            </div>
            <div class="field-row" x-show="newMonitor.type === 'push'">
              <div class="field">
                <label for="monitor-push-interval">Expected every</label>
                <select id="monitor-push-interval" x-model="newMonitor.push_interval">
                  <option value="300000">5 minutes</option>
                  <option value="3600000">1 hour</option>
                  <option value="86400000">1 day</option>
                  <option value="604800000">1 week</option>
                </select>
              </div>
              <div class="field">
                <label for="monitor-grace">Grace</label>
                <select id="monitor-grace" x-model="newMonitor.grace">
                  <option value="0">Default (10% of interval, at least 5 minutes)</option>
                  <option value="300000">5 minutes</option>
                  <option value="600000">10 minutes</option>
                  <option value="3600000">1 hour</option>
                  <option value="10800000">3 hours</option>
                </select>
              </div>
            </div>
            <div class="field-row" x-show="newMonitor.type !== 'push'">
              <div class="field">
                <label for="monitor-interval">Check Interval</label>
                <select id="monitor-interval" x-model="newMonitor.interval">
                  <option value="30000">30 seconds</option>
                  <option value="60000" selected>1 minute</option>
                  <option value="300000">5 minutes</option>
                  <option value="600000">10 minutes</option>
                </select>
              </div>
              <div class="field">
                <label for="monitor-timeout">Timeout</label>
                <select id="monitor-timeout" x-model="newMonitor.timeout">
                  <option value="5000">5 seconds</option>
                  <option value="10000" selected>10 seconds</option>
                  <option value="30000">30 seconds</option>
                </select>
              </div>
            </div>
            <div class="field-row" x-show="newMonitor.type === 'http'">
              <div class="field">
                <label for="monitor-method">Method</label>
                <select id="monitor-method" x-model="newMonitor.method">
                  <option value="GET">GET</option>
                  <option value="HEAD">HEAD</option>
                  <option value="POST">POST</option>
                </select>
              </div>
              <div class="field">
                <label for="monitor-status">Expected Status <span style="opacity:0.6">(optional)</span></label>
                <input type="number" id="monitor-status" x-model="newMonitor.expected_status" placeholder="any 2xx/3xx">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="monitor-fail-after">Alert after</label>
                <input type="number" id="monitor-fail-after" min="0" max="20" x-model="newMonitor.fail_after" :placeholder="(newMonitor.type === 'push' ? 1 : 3) + ' failures (default)'">
              </div>
              <div class="field">
                <label for="monitor-recover-after">Recover after</label>
                <input type="number" id="monitor-recover-after" min="0" max="20" x-model="newMonitor.recover_after" :placeholder="(newMonitor.type === 'push' ? 1 : 2) + ' passes (default)'">
              </div>
              <div class="field">
                <label for="monitor-repeat">Remind while down</label>
                <select id="monitor-repeat" x-model="newMonitor.repeat_every">
                  <option value="0">Off</option>
                  <option value="3600000">Every hour</option>
                  <option value="14400000">Every 4 hours</option>
                  <option value="86400000">Every day</option>
                </select>
              </div>
            </div>
            <div class="dialog-actions">
              <button type="button" class="btn" @click="closeDialog()">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="creating">
                <span x-show="!creating">Create</span>
                <span x-show="creating">Creating...</span>
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </template>


  <!-- ═══ Restore Tests Page ═══ -->
  <template x-if="$store.router.page === 'restore-tests'">
    <div x-data="restoreTestsPage">
      <div class="page-header">
        <div>
          <h1 class="page-title">Restore Tests</h1>
          <p class="subtitle" x-text="tests.length ? tests.length + ' scheduled verification' + (tests.length !== 1 ? 's' : '') : 'Prove backups restore — on a schedule'"></p>
        </div>
        <div class="header-actions">
          <button class="btn btn-primary" @click="showCreateDialog = true">Add Restore Test</button>
        </div>
      </div>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading && loadFailed && !showingStale">
        <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="loadTests()">Retry</button></div>
      </template>

      <template x-if="showingStale">
        <div role="status" class="stale-banner" x-text="staleBannerText()"></div>
      </template>

      <template x-if="!loading && tests.length > 0">
        <div class="monitor-list">
          <template x-for="t in tests" :key="t.id">
            <div class="monitor-card">
              <div class="monitor-header">
                <div class="monitor-status">
                  <span class="dot" :class="badgeClass(t)"></span>
                  <span class="monitor-name" x-text="t.app + '/' + t.accessory"></span>
                  <span class="monitor-type badge" x-text="t.server"></span>
                  <span class="badge" x-show="!t.enabled" style="opacity:0.6">disabled</span>
                </div>
                <div class="header-actions" style="display:flex; gap:8px;">
                  <button class="btn" @click="runNow(t)" :disabled="running === t.id">
                    <span x-text="running === t.id ? 'Running...' : 'Run Now'"></span>
                  </button>
                  <button class="btn" @click="toggleEnabled(t)" x-text="t.enabled ? 'Disable' : 'Enable'"></button>
                  <button class="btn btn-danger" @click="deleteTest(t.id)">Delete</button>
                </div>
              </div>
              <div class="monitor-target">
                <span x-text="'every ' + t.interval_hours + 'h'"></span>
              </div>
              <div class="monitor-meta">
                <template x-if="t.last_run_at && !t.last_run_at.startsWith('0001')">
                  <span>
                    <strong x-text="t.last_ok ? 'OK' : 'FAILED'" :style="t.last_ok ? 'color:var(--green, #2da44e)' : 'color:var(--red, #cf222e)'"></strong>
                    <span x-show="t.last_date" x-text="' — backup ' + t.last_date"></span>
                    <span x-show="t.last_metric" x-text="' — ' + t.last_metric"></span>
                    <span x-show="t.last_duration_ms" x-text="' — ' + (t.last_duration_ms / 1000).toFixed(1) + 's'"></span>
                    <span x-text="' — ' + formatDate(t.last_run_at)"></span>
                  </span>
                </template>
                <template x-if="!t.last_run_at || t.last_run_at.startsWith('0001')">
                  <span>Never run</span>
                </template>
              </div>
              <div class="monitor-meta" x-show="!t.last_ok && t.last_detail">
                <span class="check-msg" x-text="t.last_detail"></span>
              </div>
              <!-- D08: a failing alert delivery for this test's verdict warns
                   at card level, exactly like the monitors list. -->
              <div class="monitor-meta" x-show="deliveryWarns(t.delivery)">
                <span class="badge" style="background:var(--red, #cf222e);color:#fff;opacity:0.9"
                      :title="(t.delivery && t.delivery.last_error) || ''"
                      x-text="deliveryLabel(t.delivery)"></span>
              </div>
            </div>
          </template>
        </div>
      </template>

      <template x-if="!loading && !loadFailed && tests.length === 0">
        <div class="empty-state">
          <h3>No restore tests yet</h3>
          <p>A restore test regularly restores an accessory's latest backup into a scratch container and verifies it's usable — so a backup that can't restore gets caught before you need it.</p>
          <button class="btn btn-primary" @click="showCreateDialog = true">Add Restore Test</button>
        </div>
      </template>

      <!-- Create Restore Test Dialog (focus-trapped, Escape closes — A49/A58). -->
      <div class="dialog-overlay" x-show="showCreateDialog" @click.self="showCreateDialog = false"
           @keydown.tab="trapDialogFocus($event)"
           @keydown.escape.window="showCreateDialog && closeDialog()" x-cloak>
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="restore-dialog-title"
             tabindex="-1" x-effect="showCreateDialog && $nextTick(() => $el.focus())">
          <h2 id="restore-dialog-title">Add Restore Test</h2>
          <form @submit.prevent="createTest()">
            <div class="field">
              <label for="restore-server">Server</label>
              <select id="restore-server" x-model="newTest.server" required>
                <option value="" disabled>Select a server</option>
                <template x-for="s in servers" :key="s.name">
                  <option :value="s.name" x-text="s.name + ' (' + s.host + ')'"></option>
                </template>
              </select>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="restore-app">App</label>
                <input type="text" id="restore-app" x-model="newTest.app" placeholder="myapp" required>
              </div>
              <div class="field">
                <label for="restore-accessory">Accessory</label>
                <input type="text" id="restore-accessory" x-model="newTest.accessory" placeholder="postgres" required>
              </div>
            </div>
            <p class="card-meta">The backup comes from the server's stored backup target — nothing to configure here.</p>
            <div class="field">
              <label for="restore-interval">Run Every</label>
              <select id="restore-interval" x-model="newTest.interval_hours">
                <option value="6">6 hours</option>
                <option value="12">12 hours</option>
                <option value="24" selected>24 hours</option>
                <option value="168">7 days</option>
              </select>
            </div>
            <div class="dialog-actions">
              <button type="button" class="btn" @click="closeDialog()">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="creating">
                <span x-show="!creating">Create</span>
                <span x-show="creating">Creating...</span>
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </template>

  <!-- ═══ Servers Page ═══ -->
  <template x-if="$store.router.page === 'servers'">
    <div x-data="serversPage">
      <div class="page-header">
        <div>
          <h1 class="page-title">Fleet</h1>
          <p class="subtitle">Every server this dash manages. Unreachable hosts stay listed with their last-known state.</p>
        </div>
      </div>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading && loadFailed && !showingStale">
        <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="load()">Retry</button></div>
      </template>

      <template x-if="showingStale">
        <div role="status" class="stale-banner" x-text="staleBannerText()"></div>
      </template>

      <template x-if="!loading && !loadFailed && (!servers || servers.length === 0)">
        <div class="empty-state"><p>No servers configured. Add servers in Settings.</p></div>
      </template>

      <template x-if="!loading && servers && servers.length > 0">
        <div class="card-grid">
          <template x-for="s in servers" :key="s.name">
            <div class="card" @click="openServer(s.name)">
              <div class="card-title">
                <span class="status-dot" :class="cardDotClass(s)"></span>
                <span x-text="s.name"></span>
                <!-- D01: observation freshness from /api/fleet; hidden when the
                     fleet envelope is unavailable (s.freshness null). -->
                <span class="freshness-chip" :class="s.freshness" x-show="s.freshness" x-text="freshnessLabel(s)"></span>
              </div>
              <div class="card-meta" x-text="s.host"></div>
              <div class="card-hash" x-text="s.role === 'lb' ? 'Load Balancer' : 'Standard'"></div>
              <!-- D01: an unreachable server stays visible with its exact
                   error and its last-known state. -->
              <template x-if="s.error">
                <div class="server-error">
                  <div class="server-error-message" x-text="s.error"></div>
                  <div class="server-error-meta" x-text="unreachableMeta(s)"></div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Server Detail Page ═══ -->
  <template x-if="$store.router.page === 'server-detail'">
    <div x-data="serverDetailPage">
      <a href="#" class="back-link" @click.prevent="$store.router.navigate('servers')">&larr; Fleet</a>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading && !status && loadFailed">
        <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="reload()">Retry</button></div>
      </template>

      <template x-if="!loading && status">
        <div>
          <div class="page-header">
            <h1 class="page-title" x-text="status.name"></h1>
            <span class="card-meta" x-text="status.host"></span>
          </div>

          <!-- Tabs (tablist semantics as on the app page). -->
          <div class="tabs" role="tablist" aria-label="Server sections"
               @keydown.arrow-right.prevent="$el.querySelector('[role=tab][aria-selected=true]')?.nextElementSibling?.focus()"
               @keydown.arrow-left.prevent="$el.querySelector('[role=tab][aria-selected=true]')?.previousElementSibling?.focus()">
            <button class="tab" :class="{ active: tab === 'overview' }" role="tab" id="srv-tab-overview" aria-controls="srv-panel-overview" :aria-selected="(tab === 'overview').toString()" :tabindex="tab === 'overview' ? 0 : -1" @focus="switchTab('overview')">Overview</button>
            <button class="tab" :class="{ active: tab === 'proxy' }" role="tab" id="srv-tab-proxy" aria-controls="srv-panel-proxy" :aria-selected="(tab === 'proxy').toString()" :tabindex="tab === 'proxy' ? 0 : -1" @focus="switchTab('proxy')">Proxy</button>
          </div>

          <!-- Overview Tab -->
          <template x-if="tab === 'overview'">
            <div role="tabpanel" id="srv-panel-overview" aria-labelledby="srv-tab-overview" tabindex="-1">
              <div class="status-grid">
                <div class="status-item">
                  <div class="status-label">Uptime</div>
                  <div class="status-value" style="font-size: 14px;" x-text="status.uptime || 'N/A'"></div>
                </div>
                <div class="status-item">
                  <div class="status-label">CPU Load</div>
                  <div class="status-value mono" x-text="status.cpu_load || 'N/A'"></div>
                </div>
              </div>

              <!-- Memory -->
              <div style="margin-bottom: 16px;">
                <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px;">
                  <span>Memory</span>
                  <span x-text="(status.mem_used || '?') + ' / ' + (status.mem_total || '?') + ' (' + (status.mem_percent || '?') + ')'"></span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill" :class="barClass(parsePercent(status.mem_percent))" :style="'width:' + parsePercent(status.mem_percent) + '%'"></div>
                </div>
              </div>

              <!-- Disk -->
              <div style="margin-bottom: 24px;">
                <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px;">
                  <span>Disk</span>
                  <span x-text="(status.disk_used || '?') + ' / ' + (status.disk_total || '?') + ' (' + (status.disk_percent || '?') + ')'"></span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill" :class="barClass(parsePercent(status.disk_percent))" :style="'width:' + parsePercent(status.disk_percent) + '%'"></div>
                </div>
              </div>

              <!-- Containers -->
              <template x-if="status.containers && status.containers.length > 0">
                <div>
                  <h3 style="margin-bottom: 12px; font-size: 15px;">Containers</h3>
                  <div class="table-wrap">
                    <table>
                      <thead>
                        <tr>
                          <th>Name</th>
                          <th>Image</th>
                          <th>State</th>
                          <th>Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="c in status.containers" :key="c.ID">
                          <tr>
                            <td style="font-family: var(--mono); font-size: 12px;" x-text="c.Name"></td>
                            <td x-text="c.Image"></td>
                            <td>
                              <span class="status-dot" :class="c.State === 'running' ? 'running' : 'stopped'" style="margin-right: 6px;"></span>
                              <span x-text="c.State"></span>
                            </td>
                            <td x-text="c.Status"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
              <template x-if="!status.containers || status.containers.length === 0">
                <div class="empty-state"><p>No containers running on this server.</p></div>
              </template>
            </div>
          </template>

          <!-- Proxy Tab -->
          <template x-if="tab === 'proxy'">
            <div role="tabpanel" id="srv-panel-proxy" aria-labelledby="srv-tab-proxy" tabindex="-1">
              <div class="status-grid" style="margin-bottom: 24px;">
                <div class="status-item">
                  <div class="status-label">Caddy</div>
                  <div class="status-value" style="display: flex; align-items: center; gap: 8px;">
                    <span class="status-dot" :class="proxy && proxy.running ? 'running' : 'stopped'"></span>
                    <span x-text="proxy && proxy.running ? 'Running' : 'Not running'"></span>
                  </div>
                </div>
                <div class="status-item">
                  <div class="status-label">Routes</div>
                  <div class="status-value" x-text="proxy ? proxy.routes.length : 0"></div>
                </div>
              </div>

              <template x-if="proxy && proxy.routes.length > 0">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Domain</th>
                        <th>Upstream</th>
                        <th>Type</th>
                        <th>Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(route, index) in proxy.routes" :key="index">
                        <tr>
                          <td style="font-family: var(--mono); font-size: 12px;" x-text="(route.domains || []).join(', ') || '-'"></td>
                          <td style="font-family: var(--mono); font-size: 12px;" x-text="(route.upstreams || []).join(', ') || '-'"></td>
                          <td x-text="route.handler || '-'"></td>
                          <td>
                            <template x-if="route.maintenance">
                              <span style="color: var(--yellow); font-weight: 500;">Maintenance</span>
                            </template>
                            <template x-if="!route.maintenance">
                              <span style="color: var(--green);">Active</span>
                            </template>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>

              <template x-if="!proxy || proxy.routes.length === 0">
                <div class="empty-state">
                  <template x-if="proxy && proxy.running">
                    <p>Caddy is running but no routes are configured. Deploy an app to add routes.</p>
                  </template>
                  <template x-if="!proxy || !proxy.running">
                    <p>Caddy is not running. Run <code style="background: var(--bg-input); padding: 2px 6px; border-radius: 4px;">teploy setup</code> to install it.</p>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Templates Page ═══ -->
  <template x-if="$store.router.page === 'sources'">
    <div x-data="sourcesPage">
      <div class="page-header">
        <div>
          <h1 class="page-title">Sources</h1>
          <p class="subtitle">Register a repository so dash can receive and verify its webhook pushes. Provider names select credentials configured by the operator.</p>
        </div>
        <div class="header-actions">
          <button class="btn" @click="load()" :disabled="loading">Refresh</button>
        </div>
      </div>
      <p role="alert" class="stale-banner" x-show="loadError" x-text="loadError"></p>
      <p role="alert" class="stale-banner" x-show="error" x-text="error"></p>
      <p class="text-muted" x-show="!loading && !loadError && sources.length === 0">No sources configured.</p>
      <template x-for="src in sources" :key="src.id">
        <div class="card source-card">
          <button class="btn" @click="select(src.id)" :disabled="busy" x-text="src.display_name || src.clone_url"></button>
          <span x-text="src.credential_verdict"></span><span x-text="src.degrade_reason || ''"></span>
        </div>
      </template>
      <form @submit.prevent="create()" class="card source-form">
        <h2 class="section-title">Add repository</h2>
        <label class="field">Forge <select x-model="form.forge"><option>github</option><option>gitlab</option><option>forgejo</option><option>gitea</option><option>generic</option></select></label>
        <label class="field">Clone URL <input type="url" required x-model="form.clone_url"></label>
        <label class="field">Watched branch <input x-model="form.default_branch"></label>
        <label class="field">Provider name <input required x-model="form.credential_ref" autocomplete="off"></label>
        <label class="field">Display name <input x-model="form.display_name"></label>
        <button type="submit" class="btn btn-primary" :disabled="busy">Add source</button>
      </form>
      <template x-if="selected">
        <section class="card source-detail">
          <h2 x-text="selected.display_name || selected.clone_url"></h2>
          <p>Webhook URL: <code x-text="selected.webhook_url"></code></p>
          <button class="btn btn-sm" @click="action('verify')" :disabled="busy">Verify credentials</button>
          <button class="btn btn-sm" @click="action('rotate-secret')" :disabled="busy">Rotate webhook secret</button>
          <div x-show="webhookSecret"><p>Save this webhook secret now. It is shown once.</p><code x-text="webhookSecret"></code><button class="btn btn-sm" @click="webhookSecret = ''">Hide</button></div>
          <h3>Recent deliveries</h3>
          <template x-for="delivery in selected.deliveries || []" :key="delivery.id + delivery.received_at"><p><code x-text="delivery.commit"></code> <span x-text="delivery.disposition"></span> <span x-text="delivery.reason"></span></p></template>
          <p class="card-meta">Pushes to a repository an app builds from wake that app's server-side poll (which decides what deploys); every authenticated push is recorded here.</p>
        </section>
      </template>
    </div>

  <template x-if="$store.router.page === 'templates'">
    <div x-data="templatesPage">
      <div class="page-header">
        <h1 class="page-title">Templates</h1>
        <p class="subtitle">Install ready-made apps from the teploy catalog.</p>
      </div>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading && loadFailed && !showingStale">
        <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="load()">Retry</button></div>
      </template>

      <template x-if="showingStale">
        <div role="status" class="stale-banner" x-text="staleBannerText()"></div>
      </template>

      <template x-if="!loading && !loadFailed && (templates || []).length === 0">
        <div class="empty-state">
          <p>No templates available. Check that teploy CLI is installed and `teploy template list` returns results.</p>
        </div>
      </template>

      <template x-if="!loading && selected">
        <div class="table-wrap" style="padding: 20px; margin-bottom: 16px;">
          <h2 class="section-title" x-text="'Install ' + selected.name"></h2>
          <p class="subtitle" x-text="selected.description"></p>
          <!-- D05: the version pin is truthful — it states what dash can
               actually guarantee. A versioned catalog pins the SELECTED
               version (re-checked at submit; a moved catalog refuses with
               the upgrade notes). An unversioned catalog says so instead
               of pretending a reviewed package exists. -->
          <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 12px;" x-text="selected.version_state === 'versioned'
            ? 'Version pin: v' + selected.version + ' (verified against the catalog when you submit)'
            : 'This template is unversioned — the install uses the catalog\'s current revision.'"></p>
          <template x-if="selected.upgrade">
            <div class="table-wrap" style="padding: 12px; margin-bottom: 12px; border-left: 3px solid var(--warning, #d08770);">
              <p style="margin: 0; font-size: 13px;"><strong x-text="'Upgrade available: v' + selected.upgrade.from + ' -> v' + selected.upgrade.to"></strong></p>
              <p style="margin: 4px 0 0; font-size: 13px; color: var(--text-muted);" x-text="selected.upgrade.notes || 'See the template\'s upgrade notes.'"></p>
              <p x-show="selected.upgrade.backup_scope" style="margin: 4px 0 0; font-size: 13px; color: var(--text-muted);" x-text="'Backup before upgrading: ' + (selected.upgrade.backup_scope || '')"></p>
            </div>
          </template>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="install-domain">Domain</label>
              <input class="form-input" id="install-domain" x-model="installForm.domain" placeholder="app.example.com">
            </div>
            <div class="form-group">
              <label class="form-label" for="install-server">Server</label>
              <select class="form-input" id="install-server" x-model="installForm.server">
                <option value="">Select a server...</option>
                <template x-for="s in serverList" :key="s">
                  <option :value="s" x-text="s"></option>
                </template>
              </select>
            </div>
          </div>

          <template x-for="v in (selected.vars || [])" :key="v.key || v">
            <div class="form-group">
              <label class="form-label" x-text="v.label || v.key || v"></label>
              <input class="form-input" :placeholder="v.default || ''" @input="installForm.vars[v.key || v] = $event.target.value">
            </div>
          </template>

          <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button class="btn btn-primary" @click="install()" :disabled="installing" x-text="installing ? 'Installing...' : 'Install'"></button>
            <button class="btn" @click="selected = null">Cancel</button>
          </div>
        </div>
      </template>

      <template x-if="!loading && !selected && (templates || []).length > 0">
        <div class="card-grid">
          <template x-for="t in templates" :key="t.name">
            <div class="card" @click="selectTemplate(t)">
              <div class="card-title">
                <span x-text="t.name"></span>
                <!-- D05: version state is rendered, never guessed — an
                     unversioned catalog says "unversioned". -->
                <span style="margin-left: 8px; font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--bg-inset, #eee); color: var(--text-muted);"
                  x-text="t.version_state === 'versioned' ? 'v' + t.version : 'unversioned'"></span>
                <span x-show="t.upgrade" style="margin-left: 4px; font-size: 11px; color: var(--warning, #d08770);" x-text="t.upgrade ? 'upgrade to v' + t.upgrade.to : ''"></span>
              </div>
              <div class="card-meta" x-text="t.description"></div>
              <div class="card-meta" x-show="t.installed" style="font-size: 12px;" x-text="t.installed ? ('installed on ' + t.installed.server + (t.installed.version ? ' (v' + t.installed.version + ')' : '')) : ''"></div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Operations Page ═══ -->
  <template x-if="$store.router.page === 'operations'">
    <div x-data="operationsPage">
      <div class="page-header">
        <div><h1 class="page-title">Activity</h1><p style="color: var(--text-muted); margin-top: 6px;">Operations started through Dash: deploys, rollbacks, restarts, and more. Open a job for its progress and logs.</p></div>
        <div class="header-actions">
          <select class="form-input" style="width:auto;" aria-label="Filter by status" x-model="statusFilter" @change="load()">
            <option value="">All statuses</option>
            <option value="queued">Queued</option>
            <option value="running">Running</option>
            <option value="succeeded">Succeeded</option>
            <option value="failed">Failed</option>
            <option value="canceled">Canceled</option>
            <option value="interrupted">Interrupted</option>
          </select>
          <button class="btn btn-sm" @click="load()">Refresh</button>
        </div>
      </div>

      <template x-if="!loading && loadFailed && !showingStale">
        <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="load()">Retry</button></div>
      </template>

      <template x-if="showingStale">
        <div role="status" class="stale-banner" x-text="staleBannerText()"></div>
      </template>

      <template x-if="!loading && !loadFailed && ops.length === 0">
        <div class="empty-state">
          <p>No operations yet.</p>
          <p style="color: var(--text-muted); font-size: 12px; margin-top: 6px;">
            Deploys, rollbacks, and removals started from the dashboard appear here with live logs.
          </p>
        </div>
      </template>

      <template x-if="ops.length > 0">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Status</th>
                <th>Kind</th>
                <th>Target</th>
                <th>Attempt</th>
                <th>Started</th>
                <th>Duration</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="op in ops" :key="op.id">
                <tr style="cursor:pointer;" @click="open(op)">
                  <td>
                    <span class="status-dot" :class="{ running: op.status === 'running' || op.status === 'succeeded', stopped: op.status === 'failed' || op.status === 'interrupted', unknown: op.status === 'queued' || op.status === 'canceled' }"></span>
                    <span x-text="op.status"></span>
                  </td>
                  <td style="font-family: var(--mono); font-size: 12px;" x-text="op.request.kind"></td>
                  <td x-text="op.target"></td>
                  <td x-text="op.attempt"></td>
                  <td x-text="when(op.started_at || op.created_at)"></td>
                  <td x-text="duration(op)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Operation Detail ═══ -->
  <template x-if="$store.router.page === 'operation-detail'">
    <div x-data="operationDetailPage">
      <a href="#" class="back-link" @click.prevent="$store.router.navigate('operations')">&larr; Activity</a>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <template x-if="!loading && !op && loadFailed">
        <div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="load()">Retry</button></div>
      </template>

      <template x-if="!loading && op">
        <div>
          <div class="page-header">
            <h1 class="page-title" x-text="op.request.kind + ' — ' + op.target"></h1>
            <div class="header-actions">
              <button class="btn" x-show="cancelable()" @click="cancel()" :disabled="actionLoading">Cancel</button>
              <button class="btn" x-show="retryable()" @click="retry()" :disabled="actionLoading">Retry</button>
            </div>
          </div>

          <div class="card-grid" style="margin-bottom: 16px;">
            <div class="card">
              <div class="card-meta">Status</div>
              <div class="card-title">
                <span class="status-dot" :class="{ running: op.status === 'running' || op.status === 'succeeded', stopped: op.status === 'failed' || op.status === 'interrupted', unknown: op.status === 'queued' || op.status === 'canceled' }"></span>
                <span x-text="op.status"></span>
              </div>
            </div>
            <div class="card">
              <div class="card-meta">Started</div>
              <div class="card-title" style="font-size: 13px;" x-text="when(op.started_at)"></div>
            </div>
            <div class="card">
              <div class="card-meta">Duration</div>
              <div class="card-title" style="font-size: 13px;" x-text="duration(op)"></div>
            </div>
            <div class="card">
              <div class="card-meta">Exit code</div>
              <div class="card-title mono" x-text="op.exit_code === null || op.exit_code === undefined ? '—' : op.exit_code"></div>
            </div>
            <!-- D06 granted-at audit trail: which principal admitted this
                 work and the capability grant it was authorized under at
                 admission (role + basis; the full set on hover). -->
            <div class="card" x-show="op.actor">
              <div class="card-meta">Admitted by</div>
              <div class="card-title" style="font-size: 13px;"
                   :title="(op.actor && op.actor.capabilities && op.actor.capabilities.length) ? 'granted at admission: ' + op.actor.capabilities.join(', ') : ''"
                   x-text="actorLabel(op)"></div>
            </div>
          </div>

          <template x-if="op.error">
            <div class="cli-banner" style="margin: 0 0 16px; border-radius: var(--radius); text-align: left;" x-text="op.error"></div>
          </template>

          <!-- No whitespace between children: .log-viewer is pre-wrap, so
               template indentation would render as leading blank space. -->
          <div class="log-viewer" x-ref="opLog" style="max-height: 60vh;"><template x-for="(line, i) in lines" :key="i"><span :class="line.cls" x-text="line.text"></span></template><template x-if="lines.length === 0"><span style="color: var(--text-muted);">Waiting for output…</span></template></div>
        </div>
      </template>
    </div>
  </template>

  <!-- ═══ Settings Page ═══ -->
  <template x-if="$store.router.page === 'settings'">
    <div x-data="settingsPage">
      <div class="page-header">
        <h1 class="page-title">Settings</h1>
      </div>

      <div class="tabs">
        <button x-show="isAdmin()" class="tab" :class="{ active: tab === 'servers' }" @click="tab = 'servers'">Servers</button>
        <button class="tab" :class="{ active: tab === 'groups' }" @click="tab = 'groups'">Groups</button>
        <button x-show="isAdmin()" class="tab" :class="{ active: tab === 'notifications' }" @click="tab = 'notifications'">Notifications</button>
        <button x-show="isAdmin()" class="tab" :class="{ active: tab === 'registry' }" @click="tab = 'registry'">Registry</button>
        <button x-show="isAdmin()" class="tab" :class="{ active: tab === 'mcp' }" @click="tab = 'mcp'">MCP</button>
        <button x-show="isAdmin()" class="tab" :class="{ active: tab === 'users' }" @click="tab = 'users'">Users</button>
        <button x-show="isAdmin()" class="tab" :class="{ active: tab === 'sso' }" @click="tab = 'sso'">SSO</button>
        <button class="tab" :class="{ active: tab === 'links' }" @click="tab = 'links'">Links</button>
        <button class="tab" :class="{ active: tab === 'account' }" @click="tab = 'account'">Account</button>
      </div>

      <template x-if="loading">
        <div class="loading"><div class="spinner"></div></div>
      </template>

      <!-- Servers Tab -->
      <template x-if="!loading && tab === 'servers'">
        <div>
          <div class="form-row" style="margin-bottom: 16px;">
            <div class="form-group">
              <label class="form-label" for="new-server-name">Name</label>
              <input class="form-input" id="new-server-name" x-model="newServer.name" placeholder="prod">
            </div>
            <div class="form-group">
              <label class="form-label" for="new-server-host">Host</label>
              <input class="form-input" id="new-server-host" x-model="newServer.host" placeholder="192.168.1.100">
            </div>
            <div class="form-group">
              <label class="form-label" for="new-server-user">User</label>
              <input class="form-input" id="new-server-user" x-model="newServer.user" placeholder="root">
            </div>
            <div class="form-group">
              <label class="form-label" for="new-server-role">Role</label>
              <select class="form-input" id="new-server-role" x-model="newServer.role">
                <option value="app">Standard</option>
                <option value="lb">Load Balancer</option>
              </select>
            </div>
            <button class="btn btn-primary" @click="addServer()" >Add</button>
          </div>

          <template x-if="serverList().length > 0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Host</th>
                    <th>User</th>
                    <th>Role</th>
                    <th style="width: 80px;"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="s in serverList()" :key="s.name">
                    <tr>
                      <td x-text="s.name"></td>
                      <td style="font-family: var(--mono); font-size: 12px;" x-text="s.host"></td>
                      <td x-text="s.user || 'root'"></td>
                      <td x-text="(s.role || 'app') === 'lb' ? 'Load Balancer' : 'Standard'"></td>
                      <td style="display: flex; gap: 6px; justify-content: flex-end;">
                        <button class="btn btn-sm" @click="editServer(s.name)">Edit</button>
                        <button class="btn btn-sm btn-danger" @click="deleteServer(s.name)">Remove</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <!-- Edit Server Form -->
          <template x-if="editingServer">
            <div class="table-wrap" style="padding: 20px; margin-top: 16px;">
              <h3 class="section-title" style="font-size: 14px;">Edit <span x-text="editingServer.originalName"></span></h3>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="edit-server-name">Name</label>
                  <input class="form-input" id="edit-server-name" x-model="editingServer.name">
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-server-host">Host</label>
                  <input class="form-input" id="edit-server-host" x-model="editingServer.host">
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="edit-server-user">User</label>
                  <input class="form-input" id="edit-server-user" x-model="editingServer.user">
                </div>
                <div class="form-group">
                  <label class="form-label" for="edit-server-role">Role</label>
                  <select class="form-input" id="edit-server-role" x-model="editingServer.role">
                    <option value="app">Standard</option>
                    <option value="lb">Load Balancer</option>
                  </select>
                </div>
              </div>
              <div style="display: flex; gap: 8px; margin-top: 12px;">
                <button class="btn btn-primary" @click="saveEditServer()">Save</button>
                <button class="btn" @click="cancelEdit()">Cancel</button>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- Groups Tab -->
      <template x-if="!loading && tab === 'groups'">
        <div>
          <div class="form-row" style="margin-bottom: 16px;">
            <div class="form-group">
              <input class="form-input" x-model="newGroupName" placeholder="Group name">
            </div>
            <button class="btn btn-primary" @click="createGroup()" >Create</button>
          </div>

          <template x-if="groups && groups.length > 0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Apps</th>
                    <th style="width: 80px;"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="g in groups" :key="g.name">
                    <tr>
                      <td x-text="g.name"></td>
                      <td x-text="(g.apps || []).length"></td>
                      <td style="display: flex; gap: 6px; justify-content: flex-end;">
                        <button class="btn btn-sm" @click="renameGroup(g.name)">Rename</button>
                        <button class="btn btn-sm btn-danger" @click="deleteGroup(g.name)">Delete</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="!groups || groups.length === 0">
            <div class="empty-state"><p>No groups. Create one to organize your apps.</p></div>
          </template>
        </div>
      </template>

      <!-- Notifications Tab (Alerts v2): channel list, public URL, Dash
           self-heartbeat, silences, open incidents and delivery history.
           Secrets are never shown: each secret field is Keep / Replace /
           Clear against a write-only draft. -->
      <template x-if="!loading && tab === 'notifications'">
        <div x-data="alertsSettings">
          <p class="subtitle" style="margin-bottom: 16px;">An incident opens after a monitor fails its configured number of consecutive checks (default 3) and recovers after its passing checks (default 2). Each incident is sent once when it opens and once when it recovers. Deploys, maintenance, deploy locks and silences hold alerts rather than dropping them.</p>
          <template x-if="loadError"><div role="alert" class="empty-state"><p x-text="loadError"></p><button class="btn btn-sm" @click="load()">Retry</button></div></template>

          <h3 class="section-title" style="font-size: 14px; margin-top: 8px;">Channels</h3>
          <template x-if="channels.length === 0">
            <div class="empty-state"><p>No alert channel configured: monitors record up/down but notify nobody. When you add the first channel, Dash sends one summary of anything already down.</p></div>
          </template>
          <template x-if="channels.length > 0">
            <div class="table-wrap">
              <table>
                <thead><tr><th>Name</th><th>Type</th><th>Receives</th><th>Health</th><th></th></tr></thead>
                <tbody>
                  <template x-for="ch in channels" :key="ch.id">
                    <tr>
                      <td><span x-text="ch.name || ch.id"></span> <span class="card-meta" x-show="!ch.usable">(incomplete)</span></td>
                      <td x-text="typeLabel(ch.type)"></td>
                      <td x-text="(ch.kinds && ch.kinds.length) ? ch.kinds.map(kindLabel).join(', ') : 'all'"></td>
                      <td>
                        <span class="badge" :class="channelHealthClass(ch)" x-text="channelHealthText(ch)"></span>
                        <div class="card-meta" style="margin: 2px 0 0; font-family: var(--mono); word-break: break-word;" x-show="ch.health && ch.health.dead_lettered && ch.health.last_error" x-text="'last failure: ' + (ch.health ? ch.health.last_error : '')"></div>
                        <div class="card-meta" style="margin: 2px 0 0;" x-show="testResults[ch.id]" x-text="testResults[ch.id] ? (testResults[ch.id].ok ? 'test delivered' : 'test failed: ' + testResults[ch.id].error) : ''"></div>
                      </td>
                      <td style="display: flex; gap: 6px; justify-content: flex-end;">
                        <button class="btn btn-sm" @click="testChannel(ch.id)" :disabled="testing === ch.id" x-text="testing === ch.id ? 'Sending...' : 'Send test'"></button>
                        <button class="btn btn-sm" @click="editChannel(ch)">Edit</button>
                        <button class="btn btn-sm btn-danger" @click="deleteChannel(ch.id)">Delete</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <div style="display: flex; gap: 8px; align-items: center; margin-top: 12px;" x-show="!editor">
            <select class="form-input" style="max-width: 260px;" aria-label="New channel type" x-model="newType">
              <option value="ntfy">ntfy (phone push)</option>
              <option value="slack">Slack-compatible (Slack, Mattermost, Rocket.Chat, Google Chat)</option>
              <option value="discord">Discord</option>
              <option value="email">Email (SMTP)</option>
              <option value="webhook">Webhook (signed JSON, Event v2)</option>
              <option value="ship">Teploy Ship intake</option>
            </select>
            <button class="btn btn-primary" @click="newChannel(newType)">Add channel</button>
          </div>

          <template x-if="editor">
            <div class="table-wrap" style="padding: 16px; margin-top: 12px;">
              <h3 class="section-title" style="font-size: 14px; margin-top: 0;" x-text="(editor.isNew ? 'New ' : 'Edit ') + typeLabel(editor.type) + ' channel'"></h3>
              <div class="form-group">
                <label class="form-label">Name</label>
                <input class="form-input" x-model="editor.name" placeholder="Ops phone">
              </div>
              <template x-if="editor.type !== 'email'">
                <div class="form-group">
                  <label class="form-label" x-text="urlLabel(editor.type)"></label>
                  <input class="form-input" x-model="editor.url" :placeholder="editor.urlSet && credentialURL(editor.type) ? ('(set: ' + (editor.urlHint || 'hidden') + ') - leave blank to keep') : urlPlaceholder(editor.type)">
                  <p class="card-meta" style="margin: 4px 0 0;" x-text="urlHelp(editor.type)"></p>
                </div>
              </template>
              <template x-if="editor.type === 'webhook' || editor.type === 'ship'">
                <div class="form-group">
                  <label class="form-label" x-text="editor.type === 'ship' ? 'Intake signing secret (SHIP_DASH_INTAKE_SECRET)' : 'Signing secret (optional)'"></label>
                  <div class="form-row" style="align-items:center; gap:8px;">
                    <input class="form-input" type="password" x-model="editor.secretDraft" :disabled="editor.secretMode === 'keep'"
                           :placeholder="editor.secretMode === 'keep' ? (editor.secretSet ? '(set - unchanged)' : '(not set)') : 'secret'">
                    <select class="form-input" style="max-width:130px;" aria-label="Signing secret: keep, replace, or clear" x-model="editor.secretMode">
                      <option value="keep" :disabled="!editor.secretSet">Keep</option>
                      <option value="replace">Replace</option>
                      <option value="clear" :disabled="!editor.secretSet">Clear</option>
                    </select>
                  </div>
                </div>
              </template>
              <template x-if="editor.type === 'ntfy'">

                          <option value="replace">Replace</option>

                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-group"><label class="form-label">From</label><input class="form-input" x-model="editor.email_from" placeholder="alerts@example.com"></div>
                    <div class="form-group"><label class="form-label">To</label><input class="form-input" x-model="editor.email_to" placeholder="team@example.com"></div>
                  </div>
                  <label style="font-size: 13px;"><input type="checkbox" x-model="editor.smtp_allow_insecure"> Allow plaintext SMTP (trusted LAN relay only)</label>
                </div>
              </template>
              <template x-if="editor.type !== 'email'">
                <label style="font-size: 13px; display: block; margin-top: 8px;"><input type="checkbox" x-model="editor.allow_internal"> Allow an internal address (loopback, private network, Tailscale). Off by default: such targets are refused, as for monitors.</label>
              </template>
              <div class="form-group" style="margin-top: 12px;">
                <label class="form-label">Receives</label>

                  <template x-for="k in allKinds" :key="k">

              <div style="display: flex; gap: 8px; margin-top: 12px;">

                <button class="btn" @click="editor = null">Cancel</button>

          </template>

          <h3 class="section-title" style="font-size: 14px; margin-top: 24px;">Dash URL</h3>
          <div class="form-group">
            <label class="form-label">Public Dash URL (used for links in alerts)</label>
            <div class="form-row" style="gap: 8px;">
              <input class="form-input" x-model="publicURL" placeholder="https://dash.example.com">
              <button class="btn" @click="saveSettings()">Save</button>
            </div>
          </div>

          <h3 class="section-title" style="font-size: 14px; margin-top: 24px;">Dash heartbeat</h3>
          <p class="card-meta" style="margin: 0 0 8px;">Dash cannot report its own death. Every few minutes it pings these URLs; a dead-man receiver alerts you when the pings stop. Use a receiver on a different host or a hosted service. ntfy cannot do this (it delivers messages, it does not notice missing ones).</p>
          <template x-if="heartbeats.length > 0">
            <div class="table-wrap">
              <table>
                <thead><tr><th>Receiver</th><th>URL</th><th>Last ping</th><th></th></tr></thead>
                <tbody>
                  <template x-for="hb in heartbeats" :key="hb.id">
                    <tr>
                      <td>
                        <span x-text="hb.name || hb.id"></span>
                        <div class="card-meta" style="margin: 2px 0 0; color: var(--red);" x-show="hb.warning" x-text="hb.warning"></div>
                      </td>
                      <td class="card-meta" x-text="hb.url_hint"></td>
                      <td>
                        <span class="badge" :class="hb.last ? (hb.last.ok ? 'green' : 'red') : ''" x-text="hb.last ? (hb.last.ok ? 'ok' : 'failed') : 'not yet'"></span>
                        <div class="card-meta" style="margin: 2px 0 0;" x-show="hb.last" x-text="hb.last ? (formatDate(hb.last.at) + (hb.last.error ? ' - ' + hb.last.error : '')) : ''"></div>
                      </td>
                      <td style="display: flex; gap: 6px; justify-content: flex-end;">
                        <button class="btn btn-sm" @click="testHeartbeat(hb.id)">Ping now</button>
                        <button class="btn btn-sm btn-danger" @click="deleteHeartbeat(hb.id)">Delete</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <div class="form-row" style="gap: 8px; margin-top: 8px; align-items: flex-end;">
            <div class="form-group">
              <label class="form-label">Preset</label>

              </select>
            </div>
            <div class="form-group" style="flex: 2;">
              <label class="form-label">Ping URL</label>
              <input class="form-input" x-model="hbDraft.url" :placeholder="presetPlaceholder()">
            </div>
            <button class="btn btn-primary" @click="addHeartbeat()">Add receiver</button>
          </div>
          <p class="card-meta" style="margin: 4px 0 0;" x-text="presetHelp()"></p>
          <label style="font-size: 13px; display: block; margin-top: 4px;"><input type="checkbox" x-model="hbDraft.allow_internal"> Receiver is on an internal address (private network or Tailscale)</label>
          <div class="form-group" style="max-width: 260px; margin-top: 8px;">
            <label class="form-label">Ping every (minutes)</label>
            <div class="form-row" style="gap: 8px;">
              <input class="form-input" type="number" min="1" max="60" x-model.number="heartbeatInterval">
              <button class="btn" @click="saveSettings()">Save</button>
            </div>
          </div>
        </div>
      </template>

      <!-- Registry Tab -->
      <template x-if="!loading && tab === 'registry'">
        <div>
          <div class="form-row" style="margin-bottom: 16px;">
            <div class="form-group">
              <label class="form-label">Server</label>
              <input class="form-input" x-model="newReg.server" placeholder="ghcr.io">

            <div class="form-group">
              <label class="form-label">Username</label>
              <input class="form-input" x-model="newReg.username" placeholder="username">
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input class="form-input" type="password" x-model="newReg.password" placeholder="token">
            </div>
            <button class="btn btn-primary" @click="addRegistry()" >Add</button>
          </div>

          <template x-if="registries && registries.length > 0">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Server</th>
                    <th>Username</th>
                    <th style="width: 80px;"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="r in registries" :key="r.server">
                    <tr>
                      <td x-text="r.server"></td>
                      <td x-text="r.username"></td>
                      <td>
                        <button class="btn btn-sm btn-danger" @click="deleteRegistry(r.server)">Remove</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="!registries || registries.length === 0">
            <div class="empty-state"><p>No registries configured.</p></div>
          </template>
        </div>
