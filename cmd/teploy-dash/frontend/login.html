<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Teploy Dash</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      background: #0d1117;
      color: #e6edf3;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative;
      width: 100%;
      max-width: 390px;
      padding: 34px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #161b22;
    }
    .brand-row { margin-bottom: 28px; }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    h1 {
      margin-bottom: 7px;
      font-size: 20px;
      font-weight: 700;
    }
    .subtitle {
      margin-bottom: 26px;
      color: #8b949e;
      font-size: 12px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #8b949e;
      font-size: 12px;
    }
    input[type="password"] {
      width: 100%;
      min-height: 40px;
      margin-bottom: 16px;
      padding: 9px 11px;
      border: 1px solid #30363d;
      border-radius: 6px;
      outline: none;
      background: #0d1117;
      color: #e6edf3;
      font-size: 13px;
      transition: border-color .12s, box-shadow .12s;
    }
    input[type="password"]:focus { border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88,166,255,.1); }
    button {
      width: 100%;
      min-height: 40px;
      border: 1px solid #58a6ff;
      border-radius: 6px;
      background: #161b22;
      color: #58a6ff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background .12s, transform .12s;
    }
    button:hover:not(:disabled) { background: rgba(88,166,255,.1); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { margin-top: 12px; color: #f85149; font-size: 12px; }
    .security-note { margin-top: 18px; color: #6e7681; font-size: 10px; text-align: center; }
    @media (max-width: 440px) { .card { padding: 26px 22px; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-row"><div class="brand">TEPLOY DASH</div></div>
    <h1>Welcome back</h1>
    <div class="subtitle">Sign in to manage your deployment fleet.</div>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="" autofocus>
    <button id="btn">Sign in</button>
    <div class="error" id="err" hidden></div>
    <p class="security-note">Credentials stay on this Teploy Dash instance.</p>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const input = document.getElementById('password');
    const err = document.getElementById('err');

    async function login() {
      const password = input.value;
      if (!password) return;
      btn.disabled = true;
      err.hidden = true;
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password}),
        });
        if (resp.ok) {
          const params = new URLSearchParams(location.search);
          const next = params.get('next') || '/';
          location.href = next.startsWith('/') && !next.startsWith('//') ? next : '/';
        } else {
          const data = await resp.json().catch(() => ({}));
          err.textContent = data.error || 'Incorrect password.';
          err.hidden = false;
          btn.disabled = false;
          input.select();
        }
      } catch {
        err.textContent = 'Network error — try again.';
        err.hidden = false;
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', login);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
