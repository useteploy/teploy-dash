<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>teploy dash</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 40px;
      width: 100%;
      max-width: 360px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 14px;
      color: #e5e5e5;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus {
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover:not(:disabled) { background: #2563eb; }
    button:disabled { opacity: 0.6; cursor: default; }

    .error {
      font-size: 13px;
      color: #ef4444;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">teploy dash</div>
    <div class="subtitle">Enter your password to continue.</div>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="" autofocus>
    <button id="btn">Sign in</button>
    <div class="error" id="err" hidden></div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const input = document.getElementById('password');
    const err = document.getElementById('err');

    async function login() {
      const password = input.value;
      if (!password) return;
      btn.disabled = true;
      err.hidden = true;
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password}),
        });
        if (resp.ok) {
          const params = new URLSearchParams(location.search);
          const next = params.get('next') || '/';
          location.href = next.startsWith('/') && !next.startsWith('//') ? next : '/';
        } else {
          const data = await resp.json().catch(() => ({}));
          err.textContent = data.error || 'Incorrect password.';
          err.hidden = false;
          btn.disabled = false;
          input.select();
        }
      } catch {
        err.textContent = 'Network error — try again.';
        err.hidden = false;
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', login);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
