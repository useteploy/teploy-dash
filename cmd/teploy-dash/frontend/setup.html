<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set up | Teploy Dash</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      background: #090a0c;
      color: #f2f3f5;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before { content: ""; position: fixed; width: 620px; height: 620px; top: -390px; left: 50%; border-radius: 50%; background: rgba(101,130,237,.13); filter: blur(90px); transform: translateX(-50%); pointer-events: none; }
    .card {
      position: relative;
      width: 100%;
      max-width: 410px;
      padding: 34px;
      border: 1px solid #282b31;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(255,255,255,.02), transparent 42%), #111317;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
    }
    .brand-row { display: flex; margin-bottom: 26px; align-items: center; gap: 9px; }
    .brand-mark { position: relative; width: 24px; height: 24px; overflow: hidden; border-radius: 7px; background: linear-gradient(145deg, #8ba6ff, #536fe0); box-shadow: 0 4px 16px rgba(83,111,224,.28); }
    .brand-mark::before, .brand-mark::after { content: ""; position: absolute; height: 3px; border-radius: 3px; background: #fff; transform: rotate(-24deg); }
    .brand-mark::before { top: 8px; left: 6px; width: 12px; }
    .brand-mark::after { right: 5px; bottom: 6px; width: 8px; opacity: .8; }
    .brand { font-size: 15px; font-weight: 680; letter-spacing: -.025em; }
    .brand span { color: #7f858f; font-weight: 500; }
    h1 { margin-bottom: 7px; font-size: 24px; font-weight: 650; letter-spacing: -.035em; }
    .subtitle { margin-bottom: 25px; color: #7f858f; font-size: 13px; }
    label { display: block; margin-bottom: 6px; color: #a9afb9; font-size: 11px; font-weight: 580; }
    input {
      width: 100%;
      min-height: 40px;
      margin-bottom: 16px;
      padding: 9px 11px;
      border: 1px solid #292c32;
      border-radius: 7px;
      outline: none;
      background: #0c0e11;
      color: #f2f3f5;
      font-size: 14px;
      transition: border-color .12s, box-shadow .12s;
    }
    input:focus { border-color: #7594ff; box-shadow: 0 0 0 3px rgba(117,148,255,.1); }
    button {
      width: 100%;
      min-height: 40px;
      margin-top: 4px;
      border: 1px solid #809bfa;
      border-radius: 7px;
      background: #718ef2;
      box-shadow: inset 0 1px rgba(255,255,255,.18), 0 5px 18px rgba(75,105,215,.18);
      color: #0a1022;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: background .12s, transform .12s;
    }
    button:hover:not(:disabled) { background: #8aa5ff; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { margin-top: 12px; color: #ec6a72; font-size: 12px; }
    .hint { margin: -10px 0 16px; color: #60656e; font-size: 10px; }
    @media (max-width: 440px) { .card { padding: 26px 22px; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-row"><span class="brand-mark" aria-hidden="true"></span><div class="brand">teploy <span>dash</span></div></div>
    <h1>Secure your dashboard</h1>
    <div class="subtitle">Create the local account for this Teploy instance.</div>

    <label for="username">Username</label>
    <input type="text" id="username" value="admin" autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="new-password" autofocus>
    <p class="hint">At least 8 characters.</p>

    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" autocomplete="new-password">

    <button id="btn">Create account</button>
    <div class="error" id="err" hidden></div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const confirmEl  = document.getElementById('confirm');
    const err        = document.getElementById('err');

    async function setup() {
      const username         = usernameEl.value.trim() || 'admin';
      const password         = passwordEl.value;
      const confirm_password = confirmEl.value;

      if (!password) { showErr('Password is required.'); return; }
      if (password.length < 8) { showErr('Password must be at least 8 characters.'); return; }
      if (password !== confirm_password) { showErr('Passwords do not match.'); return; }

      btn.disabled = true;
      err.hidden = true;

      try {
        const resp = await fetch('/api/setup', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password, confirm_password}),
        });
        if (resp.ok) {
          location.href = '/';
        } else {
          const data = await resp.json().catch(() => ({}));
          showErr(data.error || 'Setup failed.');
          btn.disabled = false;
        }
      } catch {
        showErr('Network error — try again.');
        btn.disabled = false;
      }
    }

    function showErr(msg) {
      err.textContent = msg;
      err.hidden = false;
    }

    btn.addEventListener('click', setup);
    [usernameEl, passwordEl, confirmEl].forEach(el =>
      el.addEventListener('keydown', e => { if (e.key === 'Enter') setup(); })
    );
  </script>
</body>
</html>
