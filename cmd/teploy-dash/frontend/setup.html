<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set up | Teploy Dash</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      background: #0d1117;
      color: #e6edf3;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative;
      width: 100%;
      max-width: 410px;
      padding: 34px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #161b22;
    }
    .brand-row { margin-bottom: 26px; }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    h1 { margin-bottom: 7px; font-size: 20px; font-weight: 700; }
    .subtitle { margin-bottom: 25px; color: #8b949e; font-size: 12px; }
    label { display: block; margin-bottom: 6px; color: #8b949e; font-size: 12px; }
    input {
      width: 100%;
      min-height: 40px;
      margin-bottom: 16px;
      padding: 9px 11px;
      border: 1px solid #30363d;
      border-radius: 6px;
      outline: none;
      background: #0d1117;
      color: #e6edf3;
      font-size: 13px;
      transition: border-color .12s, box-shadow .12s;
    }
    input:focus { border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88,166,255,.1); }
    button {
      width: 100%;
      min-height: 40px;
      margin-top: 4px;
      border: 1px solid #58a6ff;
      border-radius: 6px;
      background: #161b22;
      color: #58a6ff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background .12s, transform .12s;
    }
    button:hover:not(:disabled) { background: rgba(88,166,255,.1); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { margin-top: 12px; color: #f85149; font-size: 12px; }
    .hint { margin: -10px 0 16px; color: #6e7681; font-size: 10px; }
    @media (max-width: 440px) { .card { padding: 26px 22px; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-row"><div class="brand">TEPLOY DASH</div></div>
    <h1>Secure your dashboard</h1>
    <div class="subtitle">Create the local account for this Teploy instance.</div>

    <label for="username">Username</label>
    <input type="text" id="username" value="admin" autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="new-password" autofocus>
    <p class="hint">At least 8 characters.</p>

    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" autocomplete="new-password">

    <button id="btn">Create account</button>
    <div class="error" id="err" hidden></div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const confirmEl  = document.getElementById('confirm');
    const err        = document.getElementById('err');

    async function setup() {
      const username         = usernameEl.value.trim() || 'admin';
      const password         = passwordEl.value;
      const confirm_password = confirmEl.value;

      if (!password) { showErr('Password is required.'); return; }
      if (password.length < 8) { showErr('Password must be at least 8 characters.'); return; }
      if (password !== confirm_password) { showErr('Passwords do not match.'); return; }

      btn.disabled = true;
      err.hidden = true;

      try {
        const resp = await fetch('/api/setup', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password, confirm_password}),
        });
        if (resp.ok) {
          location.href = '/';
        } else {
          const data = await resp.json().catch(() => ({}));
          showErr(data.error || 'Setup failed.');
          btn.disabled = false;
        }
      } catch {
        showErr('Network error — try again.');
        btn.disabled = false;
      }
    }

    function showErr(msg) {
      err.textContent = msg;
      err.hidden = false;
    }

    btn.addEventListener('click', setup);
    [usernameEl, passwordEl, confirmEl].forEach(el =>
      el.addEventListener('keydown', e => { if (e.key === 'Enter') setup(); })
    );
  </script>
</body>
</html>
